dag_type: plain_text
description: A workflow for creating a simple workflow DAG
name: create_simple_workflow
nodes:
  decompose_tasks_into_steps:
    agent: false
    description: Decompose identified tasks into fundamental steps
    name: decompose_tasks_into_steps
    nodes_depended_on:
    - identify_required_tasks
    nodes_dependent_on: []
    prompt: Take each identified task and decompose it into the most granular, actionable
      steps possible. Ensure each step is self-contained and focused on a single outcome.
  define_prompts_for_each_step:
    agent: false
    description: Create specific prompts or instructions for each step in the DAG
    name: define_prompts_for_each_step
    nodes_depended_on:
    - organize_steps_into_dag
    nodes_dependent_on: []
    prompt: For each step in the DAG, craft a clear, concise prompt that guides the
      execution of that step. Ensure the prompt is focused on the specific task or
      operation.
  define_workflow_objective:
    agent: false
    description: Define the objective of the workflow
    name: define_workflow_objective
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Clearly state the primary goal or objective of the workflow. What is it
      intended to achieve?
  determine_step_dependencies:
    agent: false
    description: Determine dependencies between the decomposed steps
    name: determine_step_dependencies
    nodes_depended_on:
    - decompose_tasks_into_steps
    nodes_dependent_on: []
    prompt: Analyze the decomposed steps to identify any dependencies between them.
      Determine which steps must be completed before others can begin.
  finalize_workflow_dag:
    agent: false
    description: Compile the final workflow DAG with all steps and dependencies
    name: finalize_workflow_dag
    nodes_depended_on:
    - define_prompts_for_each_step
    nodes_dependent_on: []
    prompt: Combine the structured DAG, step prompts, and dependencies into a comprehensive
      workflow definition. Ensure all elements are correctly connected and referenced.
  identify_required_tasks:
    agent: false
    description: Identify tasks required to achieve the workflow objective
    name: identify_required_tasks
    nodes_depended_on:
    - define_workflow_objective
    nodes_dependent_on: []
    prompt: List the specific tasks or operations necessary to achieve the workflow's
      objective. Break down complex tasks into simpler components.
  organize_steps_into_dag:
    agent: false
    description: Organize the steps into a Directed Acyclic Graph (DAG) structure
    name: organize_steps_into_dag
    nodes_depended_on:
    - determine_step_dependencies
    nodes_dependent_on: []
    prompt: Using the identified dependencies, structure the steps into a DAG that
      maximizes concurrency while maintaining the required dependencies.
