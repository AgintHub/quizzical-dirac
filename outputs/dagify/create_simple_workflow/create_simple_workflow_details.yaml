dag_type: plain_text
description: A workflow to create a simple workflow DAG
name: create_simple_workflow
nodes:
  create_workflow_dag:
    agent: false
    description: Create the workflow DAG
    name: create_workflow_dag
    nodes_depended_on:
    - define_task_dependencies
    nodes_dependent_on: []
    prompt: Create the workflow DAG using the defined tasks and dependencies.
  decompose_workflow:
    agent: false
    description: Decompose the workflow into smaller tasks
    name: decompose_workflow
    nodes_depended_on:
    - define_workflow_objective
    nodes_dependent_on:
    - identify_atomic_tasks
    prompt: Decompose the workflow objective into smaller, manageable tasks.
  define_task_dependencies:
    agent: false
    description: Define the dependencies between tasks
    name: define_task_dependencies
    nodes_depended_on:
    - identify_atomic_tasks
    nodes_dependent_on:
    - create_workflow_dag
    prompt: Define the dependencies between the identified atomic tasks.
  define_workflow_objective:
    agent: false
    description: Define the objective of the workflow
    name: define_workflow_objective
    nodes_depended_on: []
    nodes_dependent_on:
    - decompose_workflow
    prompt: Clearly define the objective of the workflow. What is it supposed to accomplish?
  identify_atomic_tasks:
    agent: false
    description: Identify the atomic tasks in the workflow
    name: identify_atomic_tasks
    nodes_depended_on:
    - decompose_workflow
    nodes_dependent_on:
    - define_task_dependencies
    prompt: Identify the atomic tasks that cannot be further decomposed.
