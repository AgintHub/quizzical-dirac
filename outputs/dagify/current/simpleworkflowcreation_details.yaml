dag_type: spec
description: A basic workflow to create a simple workflow
name: simpleworkflowcreation
nodes:
  create_workflow_dag:
    agent: false
    description: Create a Directed Acyclic Graph (DAG) representing the workflow
    name: create_workflow_dag
    nodes_depended_on:
    - determine_task_dependencies
    nodes_dependent_on: []
    output_structure:
    - description: A string representation of the workflow DAG
      key: workflow_dag
      type: str
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Use the output of 'determine_task_dependencies' (List[str]) and parse
          it into a suitable data structure for DAG construction
        reason: The task dependencies are required to construct the DAG
        text: Parse the task dependencies from the output of the 'determine_task_dependencies'
          node
      - complexity: MEDIUM
        impact: HIGH
        method: Utilize a graph library or implement a DAG construction algorithm
          that can handle the task dependencies
        reason: A DAG construction algorithm is necessary to create the workflow representation
        text: Use a suitable algorithm to construct the DAG from the parsed task dependencies
      - complexity: LOW
        impact: HIGH
        method: Use a graph serialization method or implement a custom string representation
          of the DAG
        reason: The output requires a string representation of the DAG
        text: Convert the constructed DAG into a string representation
      - complexity: MEDIUM
        impact: MEDIUM
        method: Implement checks for cyclic dependencies, invalid task names, or other
          potential inconsistencies
        reason: Error handling is crucial for robustness
        text: Handle any potential errors or inconsistencies in the task dependencies
    prompt: Using the task dependencies, create a DAG representing the workflow.
  define_workflow_objective:
    agent: false
    description: Define the objective of the simple workflow
    name: define_workflow_objective
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: The primary objective of the workflow
      key: workflow_objective
      type: str
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Read and parse the prompt to identify key elements that describe the
          workflow's purpose and goals
        reason: To accurately define the workflow objective, it's crucial to comprehend
          the workflow's context and requirements
        text: Analyze the given prompt to understand the context and requirements
          of the simple workflow
      - complexity: MEDIUM
        impact: HIGH
        method: Use natural language processing techniques to extract significant
          phrases or words from the prompt
        reason: Key phrases or words often directly or indirectly point to the main
          objective of the workflow
        text: Identify key phrases or words in the prompt that indicate the primary
          goal or objective of the workflow
      - complexity: MEDIUM
        impact: HIGH
        method: Synthesize the information gathered from the prompt analysis into
          a coherent and precise statement that represents the workflow's primary
          objective
        reason: A well-defined objective statement is essential for guiding the subsequent
          steps in the workflow creation process
        text: Formulate a clear and concise statement that captures the primary goal
          of the workflow based on the analysis
      - complexity: LOW
        impact: HIGH
        method: Review the statement against the original prompt and make adjustments
          as necessary to ensure clarity and relevance
        reason: Validation ensures that the defined objective is accurate and relevant
          to the workflow's purpose
        text: Validate the formulated objective statement to ensure it aligns with
          the prompt's intent and is free from ambiguity
    prompt: Identify the primary goal of the simple workflow.
  determine_task_dependencies:
    agent: false
    description: Determine dependencies between the identified tasks
    name: determine_task_dependencies
    nodes_depended_on:
    - identify_required_tasks
    nodes_dependent_on: []
    output_structure:
    - description: List of task dependencies in the format 'taskA->taskB'
      key: task_dependencies
      type: List[str]
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Use the task_names and task_descriptions lists from the 'identify_required_tasks'
          node as input.
        reason: To determine task dependencies, we first need to understand the tasks
          involved and their characteristics.
        text: Parse the output of the 'identify_required_tasks' node to extract task
          names and descriptions.
      - complexity: MEDIUM
        impact: HIGH
        method: Apply natural language processing (NLP) techniques or rule-based approaches
          to identify dependencies. For example, look for keywords like 'after', 'before',
          'depends on' in task descriptions.
        reason: Task dependencies are crucial for creating a valid workflow DAG.
        text: Implement a dependency analysis algorithm to identify dependencies between
          tasks based on their names and descriptions.
      - complexity: LOW
        impact: MEDIUM
        method: Use string manipulation techniques to format the dependencies correctly.
        reason: The output needs to be in a specific format for the next node to process.
        text: Format the identified dependencies into the required 'taskA->taskB'
          format.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Implement a fallback strategy, such as logging the ambiguity for human
          review or using a default dependency assumption.
        reason: To ensure the robustness of the workflow creation process.
        text: Handle cases where task dependencies cannot be automatically determined
          (e.g., due to ambiguous task descriptions).
      - complexity: MEDIUM
        impact: HIGH
        method: Check for circular dependencies, ensure all tasks are included, and
          verify the format of the dependencies list.
        reason: To prevent downstream errors in the workflow creation process.
        text: Validate the generated task dependencies list for consistency and correctness.
    prompt: Analyze the tasks and determine their dependencies.
  identify_required_tasks:
    agent: false
    description: Identify tasks required to achieve the workflow objective
    name: identify_required_tasks
    nodes_depended_on:
    - define_workflow_objective
    nodes_dependent_on: []
    output_structure:
    - description: Names of tasks required for the workflow
      key: task_names
      type: List[str]
    - description: Descriptions of tasks required for the workflow
      key: task_descriptions
      type: List[str]
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Parse the workflow objective string to extract key concepts and goals.
        reason: Understanding the workflow objective is crucial to identifying the
          required tasks.
        text: Analyze the workflow objective obtained from the 'define_workflow_objective'
          node to understand the primary goal of the workflow.
      - complexity: MEDIUM
        impact: HIGH
        method: Implement a task identification algorithm or query a knowledge base
          relevant to the workflow domain.
        reason: This step leverages domain knowledge or algorithms to map workflow
          objectives to specific tasks.
        text: Use a task identification algorithm or knowledge base to determine the
          tasks necessary to achieve the workflow objective.
      - complexity: LOW
        impact: MEDIUM
        method: Iterate through the identified tasks and extract their names.
        reason: Task names are essential for creating a clear and understandable list
          of tasks.
        text: Extract and list the names of the identified tasks.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Use natural language processing techniques or template-based descriptions
          to generate task descriptions.
        reason: Task descriptions provide context and clarity on what each task entails.
        text: Generate descriptions for each identified task based on the task name
          and workflow objective.
      - complexity: LOW
        impact: HIGH
        method: 'Iterate through the tasks, populating two lists: one for task names
          and one for task descriptions.'
        reason: The output needs to be in a specific format to be consumed by subsequent
          nodes.
        text: Compile the task names and descriptions into the required output format
          (List[str] for both task_names and task_descriptions).
    prompt: List the tasks necessary to accomplish the workflow objective.
  validate_workflow:
    agent: false
    description: Validate the created workflow DAG
    name: validate_workflow
    nodes_depended_on:
    - create_workflow_dag
    nodes_dependent_on: []
    output_structure:
    - description: Whether the workflow DAG is valid
      key: is_valid
      type: bool
    - description: Validation message or error details
      key: validation_message
      type: str
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: Use a graph parsing library to convert the string representation into
          a directed graph object.
        reason: To analyze the DAG for correctness and acyclicity, we need to convert
          it into a usable graph format.
        text: Parse the input workflow DAG string into a graph data structure using
          a library like NetworkX.
      - complexity: MEDIUM
        impact: HIGH
        method: Apply a topological sorting algorithm to the graph and check for any
          errors indicating cycles.
        reason: A DAG must not contain any cycles, and topological sorting can verify
          this.
        text: Check the graph for acyclicity using a topological sorting algorithm.
      - complexity: HIGH
        impact: HIGH
        method: Cross-reference the task names and dependencies in the graph with
          the original task list and dependencies.
        reason: To ensure correctness, we need to validate that the nodes and edges
          in the graph correspond to actual tasks and dependencies.
        text: Verify that all nodes in the graph have valid task names and that edges
          represent valid task dependencies.
      - complexity: LOW
        impact: LOW
        method: Set 'is_valid' to True and craft a appropriate success message.
        reason: A valid and acyclic DAG should result in a positive validation response.
        text: If the graph is valid and acyclic, return 'is_valid' as True along with
          a success validation message.
      - complexity: MEDIUM
        impact: HIGH
        method: Set 'is_valid' to False and provide a descriptive error message based
          on the validation failure reason.
        reason: Invalid or cyclic DAGs should be clearly reported with relevant error
          details.
        text: If the graph contains cycles or is otherwise invalid, return 'is_valid'
          as False along with detailed error information.
    prompt: Check the workflow DAG for correctness and acyclicity.
