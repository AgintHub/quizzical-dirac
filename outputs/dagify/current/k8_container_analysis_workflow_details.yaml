      code_node_type: virtual-pure
      description: Evaluates security configurations based on network policy, secret
        management, and identified vulnerabilities to provide security insights.
      implementation: "def evaluate_security_configurations(network_policy: str, secret_management:\
        \ str, vulnerabilities: str) -> str:\n    \"\"\"\n    Evaluates security configurations\
        \ based on network policy, secret management, and identified vulnerabilities\
        \ to provide security insights.\n\n    Args:\n        network_policy: Input\
        \ parameter of type str\nsecret_management: Input parameter of type str\n\
        vulnerabilities: Input parameter of type str\n\n    Returns:\n        str:\
        \ Output of type str\n    \"\"\"\n    import json\n    import re\n    from\
        \ typing import Dict, List, Any\n    \n    # --- Network Policy Analysis ---\n\
        \    network_score = 0\n    network_issues = []\n    \n    # Check for basic\
        \ network policy configurations\n    if \"NetworkPolicy\" in network_policy:\n\
        \        network_score += 30\n    else:\n        network_issues.append(\"\
        No NetworkPolicy resources found\")\n    \n    # Check for ingress/egress\
        \ rules\n    if \"ingress\" in network_policy.lower():\n        network_score\
        \ += 20\n    else:\n        network_issues.append(\"No ingress rules defined\"\
        )\n        \n    if \"egress\" in network_policy.lower():\n        network_score\
        \ += 20\n    else:\n        network_issues.append(\"No egress rules defined\"\
        )\n    \n    # Check for pod selectors\n    if \"podSelector\" in network_policy:\n\
        \        network_score += 15\n    else:\n        network_issues.append(\"\
        No pod selectors configured\")\n        \n    # Check for namespace selectors\n\
        \    if \"namespaceSelector\" in network_policy:\n        network_score +=\
        \ 15\n    else:\n        network_issues.append(\"No namespace selectors configured\"\
        )\n    \n    # --- Secret Management Assessment ---\n    secret_score = 0\n\
        \    secret_issues = []\n    \n    # Check for encrypted secrets\n    if \"\
        encryption\" in secret_management.lower() or \"encrypted\" in secret_management.lower():\n\
        \        secret_score += 25\n    else:\n        secret_issues.append(\"Secrets\
        \ are not encrypted at rest\")\n    \n    # Check for RBAC on secrets\n  \
        \  if \"rbac\" in secret_management.lower() or \"role\" in secret_management.lower():\n\
        \        secret_score += 25\n    else:\n        secret_issues.append(\"No\
        \ RBAC controls found for secret access\")\n    \n    # Check for secret rotation\n\
        \    if \"rotation\" in secret_management.lower() or \"rotate\" in secret_management.lower():\n\
        \        secret_score += 20\n    else:\n        secret_issues.append(\"No\
        \ secret rotation policy found\")\n    \n    # Check for external secret management\n\
        \    if any(provider in secret_management.lower() for provider in [\"vault\"\
        , \"aws\", \"azure\", \"gcp\", \"external\"]):\n        secret_score += 20\n\
        \    else:\n        secret_issues.append(\"No external secret management system\
        \ detected\")\n    \n    # Check for secret scanning\n    if \"scan\" in secret_management.lower()\
        \ or \"detect\" in secret_management.lower():\n        secret_score += 10\n\
        \    else:\n        secret_issues.append(\"No secret scanning mechanisms found\"\
        )\n    \n    # --- Vulnerability Assessment ---\n    vuln_score = 0\n    vuln_issues\
        \ = []\n    critical_vulns = 0\n    high_vulns = 0\n    medium_vulns = 0\n\
        \    \n    # Parse vulnerabilities and assign CVSS-like scoring\n    vuln_lines\
        \ = vulnerabilities.split('\\n')\n    for line in vuln_lines:\n        line_lower\
        \ = line.lower()\n        if any(critical_term in line_lower for critical_term\
        \ in [\"critical\", \"rce\", \"remote code\", \"privilege escalation\", \"\
        cvss:9\", \"cvss:10\"]):\n            critical_vulns += 1\n        elif any(high_term\
        \ in line_lower for high_term in [\"high\", \"injection\", \"xss\", \"csrf\"\
        , \"cvss:7\", \"cvss:8\"]):\n            high_vulns += 1\n        elif any(medium_term\
        \ in line_lower for medium_term in [\"medium\", \"disclosure\", \"dos\", \"\
        cvss:4\", \"cvss:5\", \"cvss:6\"]):\n            medium_vulns += 1\n    \n\
        \    # Score based on vulnerability count and severity\n    total_vulns =\
        \ critical_vulns + high_vulns + medium_vulns\n    \n    if total_vulns ==\
        \ 0:\n        vuln_score = 100\n    else:\n        # Penalty system based\
        \ on severity\n        penalty = (critical_vulns * 40) + (high_vulns * 20)\
        \ + (medium_vulns * 10)\n        vuln_score = max(0, 100 - penalty)\n    \n\
        \    if critical_vulns > 0:\n        vuln_issues.append(f\"{critical_vulns}\
        \ critical vulnerabilities require immediate attention\")\n    if high_vulns\
        \ > 0:\n        vuln_issues.append(f\"{high_vulns} high severity vulnerabilities\
        \ need prompt remediation\")\n    if medium_vulns > 0:\n        vuln_issues.append(f\"\
        {medium_vulns} medium severity vulnerabilities should be addressed\")\n  \
        \  \n    # --- Calculate Overall Security Score ---\n    overall_score = (network_score\
        \ + secret_score + vuln_score) / 3\n    \n    # --- Generate Security Insights\
        \ Report ---\n    if overall_score >= 80:\n        security_level = \"EXCELLENT\"\
        \n        summary = \"Security configurations are well-implemented with minimal\
        \ risks.\"\n    elif overall_score >= 60:\n        security_level = \"GOOD\"\
        \n        summary = \"Security configurations are adequate but have room for\
        \ improvement.\"\n    elif overall_score >= 40:\n        security_level =\
        \ \"MODERATE\"\n        summary = \"Security configurations have significant\
        \ gaps that should be addressed.\"\n    else:\n        security_level = \"\
        POOR\"\n        summary = \"Security configurations have critical issues requiring\
        \ immediate attention.\"\n    \n    # --- Compile Recommendations ---\n  \
        \  recommendations = []\n    \n    if network_score < 70:\n        recommendations.append(\"\
        Implement comprehensive NetworkPolicy resources with proper ingress/egress\
        \ rules\")\n        recommendations.append(\"Configure pod and namespace selectors\
        \ for network segmentation\")\n    \n    if secret_score < 70:\n        recommendations.append(\"\
        Enable encryption at rest for all secrets\")\n        recommendations.append(\"\
        Implement RBAC controls for secret access\")\n        recommendations.append(\"\
        Establish secret rotation policies\")\n        recommendations.append(\"Consider\
        \ external secret management solutions\")\n    \n    if critical_vulns > 0:\n\
        \        recommendations.append(\"URGENT: Address all critical vulnerabilities\
        \ immediately\")\n    if high_vulns > 0:\n        recommendations.append(\"\
        HIGH PRIORITY: Remediate high severity vulnerabilities within 7 days\")\n\
        \    \n    # --- Format Final Report ---\n    report = f\"\"\"SECURITY CONFIGURATION\
        \ ANALYSIS REPORT\n===============================================\n\nOVERALL\
        \ SECURITY LEVEL: {security_level}\nOVERALL SCORE: {overall_score:.1f}/100\n\
        \nSUMMARY:\n{summary}\n\nDETAILED SCORES:\n- Network Policy Security: {network_score}/100\n\
        - Secret Management Security: {secret_score}/100\n- Vulnerability Assessment:\
        \ {vuln_score}/100\n\nIDENTIFIED ISSUES:\n\nNetwork Policy Issues:\n{chr(10).join('-\
        \ ' + issue for issue in network_issues) if network_issues else '- No significant\
        \ issues found'}\n\nSecret Management Issues:\n{chr(10).join('- ' + issue\
        \ for issue in secret_issues) if secret_issues else '- No significant issues\
        \ found'}\n\nVulnerability Issues:\n{chr(10).join('- ' + issue for issue in\
        \ vuln_issues) if vuln_issues else '- No vulnerabilities detected'}\n\nRECOMMENDATIONS:\n\
        {chr(10).join('- ' + rec for rec in recommendations) if recommendations else\
        \ '- Continue maintaining current security practices'}\n\nVULNERABILITY SUMMARY:\n\
        - Critical: {critical_vulns}\n- High: {high_vulns}\n- Medium: {medium_vulns}\n\
        - Total: {total_vulns}\n\"\"\"\n    \n    return report"
      name: evaluate_security_configurations
      nodes_depended_on: []
      nodes_dependent_on: []
