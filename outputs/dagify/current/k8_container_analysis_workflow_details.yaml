        \ list) or not isinstance(memory_list, list):\n        raise ValueError(\"\
        Input strings must represent JSON lists\")\n    \n    # Handle edge case of\
        \ empty lists\n    if len(cpu_list) == 0 and len(memory_list) == 0:\n    \
        \    return []\n    \n    # Validate that lists are of the same length\n \
        \   if len(cpu_list) != len(memory_list):\n        raise ValueError(f\"CPU\
        \ and memory lists must be of the same length. CPU: {len(cpu_list)}, Memory:\
        \ {len(memory_list)}\")\n    \n    # Validate that all elements are valid\
        \ float values\n    try:\n        cpu_floats = [float(x) for x in cpu_list]\n\
        \        memory_floats = [float(x) for x in memory_list]\n    except (ValueError,\
        \ TypeError) as e:\n        raise ValueError(f\"All elements in CPU and memory\
        \ lists must be convertible to float: {e}\")\n    \n    # Combine metrics\
