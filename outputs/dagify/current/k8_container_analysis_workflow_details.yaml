        \    except json.JSONDecodeError:\n        # If JSON parsing fails, try to\
        \ extract numeric values using regex\n        # Look for memory-related patterns\
        \ like \"memory: 85.5%\" or \"mem_util: 0.75\"\n        memory_pattern = r'(?:memory|mem|ram)(?:[_\\\
        s]*(?:util|usage|used|percent))?[:\\s=]+([0-9]*\\.?[0-9]+)'\n        matches\
        \ = re.findall(memory_pattern, parsed_metrics, re.IGNORECASE)\n        if\
        \ matches:\n            return [float(match) for match in matches]\n     \
        \   \n        # Fallback: extract all numeric values that could be percentages\
        \ or ratios\n        numeric_pattern = r'([0-9]*\\.?[0-9]+)%?'\n        all_numbers\
        \ = re.findall(numeric_pattern, parsed_metrics)\n        return [float(num)\
        \ for num in all_numbers if num]\n    \n    # Extract memory metrics from\
        \ parsed JSON/dict data\n    memory_metrics = []\n    \n    def extract_from_dict(data_item):\n\
        \        \"\"\"Helper function to extract memory values from a dictionary\"\
        \"\"\n        if isinstance(data_item, dict):\n            for key, value\
        \ in data_item.items():\n                # Check if key relates to memory\n\
        \                if any(mem_keyword in key.lower() for mem_keyword in ['memory',\
        \ 'mem', 'ram', 'util', 'usage']):\n                    if isinstance(value,\
        \ (int, float)):\n                        memory_metrics.append(float(value))\n\
        \                    elif isinstance(value, str):\n                      \
        \  # Try to extract numeric value from string (e.g., \"85.5%\")\n        \
        \                numeric_match = re.search(r'([0-9]*\\.?[0-9]+)', value)\n\
        \                        if numeric_match:\n                            memory_metrics.append(float(numeric_match.group(1)))\n\
        \                elif isinstance(value, (dict, list)):\n                 \
        \   extract_from_dict(value)\n        elif isinstance(data_item, list):\n\
        \            for item in data_item:\n                extract_from_dict(item)\n\
        \    \n    # Handle different data structures\n    if isinstance(parsed_data,\
        \ list):\n        for item in parsed_data:\n            extract_from_dict(item)\n\
        \    elif isinstance(parsed_data, dict):\n        extract_from_dict(parsed_data)\n\
        \    else:\n        # If it's a simple numeric value\n        if isinstance(parsed_data,\
        \ (int, float)):\n            memory_metrics.append(float(parsed_data))\n\
        \    \n    return memory_metrics"
