        \    high_util_count = sum(1 for u in utilizations if u > 80)\n    low_util_count\
        \ = sum(1 for u in utilizations if u < 20)\n    \n    if high_util_count >\
        \ len(utilizations) * 0.3:\n        recommendations.append(\"Frequent high\
