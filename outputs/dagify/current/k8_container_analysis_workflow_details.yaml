      implementation: "from typing import List\n\ndef check_resource_security(resource_limits:\
        \ str, container_names: str) -> List[str]:\n    \"\"\"\n    Checks for resource-based\
        \ security issues given container names and resource limits.\n\n    Args:\n\
        \        resource_limits: Input parameter of type str\ncontainer_names: Input\
        \ parameter of type str\n\n    Returns:\n        List[str]: Output of type\
        \ List[str]\n    \"\"\"\n    import json\n    import re\n    \n    vulnerabilities\
        \ = []\n    \n    # Parse resource_limits string into usable data structure\n\
        \    try:\n        if resource_limits.strip():\n            # Try to parse\
        \ as JSON first\n            try:\n                limits_data = json.loads(resource_limits)\n\
        \            except json.JSONDecodeError:\n                # If not JSON,\
        \ try to parse as key=value pairs\n                limits_data = {}\n    \
        \            pairs = resource_limits.split(',')\n                for pair\
        \ in pairs:\n                    if '=' in pair:\n                       \
        \ key, value = pair.split('=', 1)\n                        limits_data[key.strip()]\
        \ = value.strip()\n        else:\n            limits_data = {}\n    except\
        \ Exception:\n        limits_data = {}\n    \n    # Parse container_names\
        \ string into list\n    try:\n        if container_names.strip():\n      \
        \      # Try to parse as JSON first\n            try:\n                names_list\
        \ = json.loads(container_names)\n                if not isinstance(names_list,\
        \ list):\n                    names_list = [str(names_list)]\n           \
        \ except json.JSONDecodeError:\n                # If not JSON, split by comma\n\
        \                names_list = [name.strip() for name in container_names.split(',')\
        \ if name.strip()]\n        else:\n            names_list = []\n    except\
        \ Exception:\n        names_list = []\n    \n    # Check for resource-based\
        \ security vulnerabilities\n    \n    # Check memory limits\n    if isinstance(limits_data,\
        \ dict):\n        memory_limit = limits_data.get('memory', limits_data.get('Memory',\
        \ ''))\n        if memory_limit:\n            # Extract numeric value from\
        \ memory limit\n            memory_match = re.search(r'(\\d+)', str(memory_limit))\n\
        \            if memory_match:\n                memory_value = int(memory_match.group(1))\n\
        \                # Check if memory limit is too high (potential DoS) or too\
        \ low (potential instability)\n                if memory_value > 8192:  #\
        \ > 8GB\n                    vulnerabilities.append(f\"High memory limit detected:\
        \ {memory_limit} - potential resource exhaustion\")\n                elif\
        \ memory_value < 64:  # < 64MB\n                    vulnerabilities.append(f\"\
        Very low memory limit detected: {memory_limit} - potential instability\")\n\
        \        \n        # Check CPU limits\n        cpu_limit = limits_data.get('cpu',\
