        \ utilizations = []\n    \n    if not utilizations:\n        return \"No valid\
        \ utilization data found for analysis.\"\n    \n    # Calculate statistics\n\
        \    avg_utilization = mean(utilizations)\n    max_utilization = max(utilizations)\n\
        \    min_utilization = min(utilizations)\n    \n    # Generate recommendations\
