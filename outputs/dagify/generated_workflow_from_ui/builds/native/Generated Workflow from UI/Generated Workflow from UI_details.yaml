dag_type: plain_text
description: Generated workflow from UI.
name: Generated Workflow from UI
nodes:
  backtest_trading_strategy:
    agent: false
    description: Test the trading strategy on historical data.
    name: backtest_trading_strategy
    nodes_depended_on:
    - define_trading_strategy
    - configure_trading_infrastructure
    nodes_dependent_on: []
    prompt: 'Backtest the trading strategy using historical data. Report key performance
      metrics: returns, Sharpe ratio, drawdowns.'
  compile_trading_workflow_summary:
    agent: false
    description: Summarize the trading workflow, including strategy, infrastructure,
      and risk management.
    name: compile_trading_workflow_summary
    nodes_depended_on:
    - define_trading_strategy
    - configure_trading_infrastructure
    - implement_risk_management
    nodes_dependent_on: []
    prompt: Compile a comprehensive summary of the trading workflow, covering the
      strategy, infrastructure setup, and risk management implementation. Provide
      an overview of the entire system.
  configure_trading_infrastructure:
    agent: false
    description: Set up the necessary infrastructure for trading.
    name: configure_trading_infrastructure
    nodes_depended_on:
    - select_trading_platform
    nodes_dependent_on: []
    prompt: Configure the trading infrastructure, including setting up API connections,
      data feeds, and execution systems. List the specific components and their configurations.
  define_risk_management_rules:
    agent: false
    description: Establish risk management rules to control exposure.
    name: define_risk_management_rules
    nodes_depended_on:
    - define_trading_strategy
    nodes_dependent_on: []
    prompt: Define risk management rules, including position sizing, stop-loss levels,
      and portfolio hedging strategies. Provide specific numerical values or rules.
  define_trading_strategy:
    agent: false
    description: Identify the core trading strategy and its key components.
    name: define_trading_strategy
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Specify the primary trading strategy (e.g., trend following, mean reversion).
      List key factors: indicators, signals, entry/exit rules.'
  implement_risk_management:
    agent: false
    description: Integrate risk management rules into the trading system.
    name: implement_risk_management
    nodes_depended_on:
    - configure_trading_infrastructure
    - define_risk_management_rules
    nodes_dependent_on: []
    prompt: Implement risk management rules within the trading infrastructure. Describe
      how each rule is integrated and monitored.
  monitor_and_adjust:
    agent: false
    description: Continuously monitor the trading system's performance and adjust
      as needed.
    name: monitor_and_adjust
    nodes_depended_on:
    - implement_risk_management
    - backtest_trading_strategy
    nodes_dependent_on: []
    prompt: Establish a monitoring process to track the trading system's performance.
      Describe the metrics to be monitored and the adjustment procedures.
  select_trading_platform:
    agent: false
    description: Choose the trading platform or broker to execute trades.
    name: select_trading_platform
    nodes_depended_on:
    - define_trading_strategy
    nodes_dependent_on: []
    prompt: Select a suitable trading platform or broker based on the strategy's requirements
      (e.g., API access, asset coverage). Provide the platform name and key features.
