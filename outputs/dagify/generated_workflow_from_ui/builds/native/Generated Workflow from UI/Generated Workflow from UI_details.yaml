dag_type: plain_text
description: Generated workflow from UI.
name: Generated Workflow from UI
nodes:
  analyze_indicator_predictive_power:
    agent: false
    description: Analyzes the predictive power of a set of technical indicators by
      correlating them with statistical metadata and identifying the most informative
      indicators for generating trading signals.
    name: analyze_indicator_predictive_power
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Analyze the predictive power of the provided indicators DataFrame using
      the supplied statistical metadata and return a concise summary string.
  analyze_trading_results:
    agent: false
    description: Analyze the results of trading activities to identify areas for improvement.
    name: analyze_trading_results
    nodes_depended_on:
    - monitor_trading_performance
    nodes_dependent_on: []
    prompt: Analyze trading results to understand the effectiveness of the strategy
      and risk management, identifying areas for improvement or optimization.
  assess_statistical_significance:
    agent: false
    description: Determines if the current trading win rate is statistically significant
      relative to historical performance.
    name: assess_statistical_significance
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: '```markdown

      ## Assess Statistical Significance


      **Purpose**: Determine whether the observed win rate is statistically significant
      compared to historical performance data.


      **Input Parameters**:

      - `observed_win_rate` (float or str): The win rate observed in the current monitoring
      period.

      - `historical_data` (JSON string): Historical win rates and associated metrics
      in JSON format.


      **Output**:

      - `output` (bool): `true` if the observed win rate differs significantly from
      the historical mean at the chosen significance level; `false` otherwise.

      ```'
  backtest_trading_strategy:
    agent: false
    description: Test the trading strategy on historical data to evaluate performance.
    name: backtest_trading_strategy
    nodes_depended_on:
    - define_trading_strategy
    nodes_dependent_on: []
    prompt: Backtest the defined strategy on historical data, calculating performance
      metrics such as return, drawdown, and Sharpe ratio.
  calculate_annualized_return:
    agent: false
    description: Calculates the annualized return of a trading strategy using its
      cumulative total return and the total number of trading days.
    name: calculate_annualized_return
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Calculate the annualized return.


      **Input Parameters**

      - `total_return`: A string representing the total cumulative return (e.g., "0.35"
      for 35% total return).

      - `trading_days`: A string representing the total number of trading days the
      return covers.


      **Output**

      - `output`: A float representing the annualized return (e.g., 0.12 for 12% annualized
      return).


      **Example**

      ```

      total_return = "0.35"

      trading_days = "210"


      output = calculate_annualized_return(total_return, trading_days)

      # output ≈ 0.112

      ```'
  calculate_average_return_per_trade:
    agent: false
    description: Calculates the average return per trade by processing snapshot data
      and total trade count.
    name: calculate_average_return_per_trade
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Calculate the average return per trade given snapshot_average, snapshot_data,
      and total_trades.
  calculate_data_quality_score:
    agent: false
    description: Computes a numeric score between 0 and 1 representing the overall
      quality of cleaned market data based on completeness, consistency, and validity
      metrics.
    name: calculate_data_quality_score
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Calculate a data quality score for the cleaned market data provided as
      a JSON string. Input data: {{data}}'
  calculate_max_drawdown:
    agent: false
    description: Calculates the maximum drawdown from a given equity curve string
      representation.
    name: calculate_max_drawdown
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Given an equity_curve as a CSV string of cumulative equity values, compute
      the maximum drawdown as a float.
  calculate_performance_metrics:
    agent: false
    description: Computes key trading performance statistics from closed trade data
      and an equity curve.
    name: calculate_performance_metrics
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Given JSON strings for `closed_trades` and `equity_curve`, return a JSON
      string containing total trades, winning trades, losing trades, win rate, average
      return per trade, maximum drawdown, and Sharpe ratio.
  calculate_sharpe_ratio:
    agent: false
    description: Calculates the Sharpe ratio of a strategy from daily return values
      and an annual risk‑free rate.
    name: calculate_sharpe_ratio
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: '## calculate_sharpe_ratio

      Calculate the Sharpe ratio for a series of daily returns given a risk‑free rate.


      **Parameters**:

      - **daily_returns** (str): String representation of a list of daily return floats
      (e.g., "[0.01, -0.02, 0.03]").

      - **risk_free_rate** (str): String representation of the annual risk‑free rate
      (e.g., "0.02").


      **Output**:

      - **output** (float): The calculated Sharpe ratio.'
  calculate_trade_pnl:
    agent: false
    description: Calculates the profit or loss for a trade based on entry and exit
      prices, quantity, side, instrument, and timestamp.
    name: calculate_trade_pnl
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Calculate trade PnL for entry_price: {entry_price}, exit_price: {exit_price},
      quantity: {quantity}, side: {side}, instrument: {instrument}, timestamp: {timestamp}.
      Return a JSON with keys ''output'', ''entry_price'', ''exit_price'', ''quantity'',
      ''side'', ''instrument'', ''timestamp''.'
  calculate_win_rate:
    agent: false
    description: Calculates the win rate as the ratio of winning trades to total trades,
      returning a float between 0 and 1.
    name: calculate_win_rate
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Calculate the win rate given the number of winning trades and total trades.
  check_alert_conditions:
    agent: false
    description: Evaluates performance metrics against alert thresholds and returns
      a boolean flag indicating whether an alert should be triggered.
    name: check_alert_conditions
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Implement a function `check_alert_conditions(metrics: str, alert_thresholds:
      str) -> str` that parses the JSON strings `metrics` and `alert_thresholds`,
      compares each metric value to its corresponding threshold, and returns the string
      `''true''` if any metric breaches its threshold, otherwise `''false''`.'
  clean_and_validate_market_data:
    agent: false
    description: Cleans and validates raw historical market data, ensuring schema
      compliance, data integrity, and quality flags.
    name: clean_and_validate_market_data
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Clean and validate the provided raw market data JSON string.
  collect_historical_market_data:
    agent: false
    description: Gather historical market data for analysis and strategy development.
    name: collect_historical_market_data
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Collect historical price data for the desired assets and timeframes. Ensure
      data is clean and properly formatted.
  compute_descriptive_statistics:
    agent: false
    description: Computes descriptive statistics grouped by asset and timeframe from
      a provided data frame string.
    name: compute_descriptive_statistics
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: '### Compute Descriptive Statistics

      **Input:** a string referencing a CSV or pickle file containing historical market
      data with columns `asset`, `timeframe`, `timestamp`, `price`.

      **Task:** Load the data, group by `asset` and `timeframe`, compute standard
      descriptive statistics (`count`, `mean`, `std`, `min`, `25%`, `50%`, `75%`,
      `max`).

      **Output:** a JSON string mapping each `(asset, timeframe)` pair to its statistics
      dictionary.

      **Return:** the JSON string as the `output` field.'
  compute_total_trades:
    agent: false
    description: Computes the total number of trades for a monitoring period, using
      an optional snapshot total or falling back to the sum of winning and losing
      trades.
    name: compute_total_trades
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Description: Typed node for shim compute_total_trades'
  configure_trading_infrastructure:
    agent: false
    description: Set up the necessary infrastructure for executing trades.
    name: configure_trading_infrastructure
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Configure the trading infrastructure, including selecting a brokerage
      API, setting up a trading platform, and ensuring connectivity.
  create_position_sizing_rule:
    agent: false
    description: Generates a position sizing rule string for a trading strategy based
      on a specified risk tolerance and chosen sizing method.
    name: create_position_sizing_rule
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Create a concise position sizing rule string using the provided risk_tolerance
      and method. Return the rule as a plain string.
  create_risk_management_rule:
    agent: false
    description: Creates a risk management rule string based on maximum drawdown,
      maximum number of assets, and maximum daily loss.
    name: create_risk_management_rule
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Generate a risk management rule string using the provided max_drawdown,
      max_assets, and max_daily_loss values.
  define_trading_strategy:
    agent: false
    description: Develop a trading strategy based on analysis of historical data.
    name: define_trading_strategy
    nodes_depended_on:
    - collect_historical_market_data
    nodes_dependent_on: []
    prompt: Using the historical data, define a trading strategy including entry and
      exit rules, risk management, and position sizing.
  deserialize_monitoring_snapshot:
    agent: false
    description: Deserializes a JSON string representing a monitoring snapshot into
      a Python dictionary for further processing.
    name: deserialize_monitoring_snapshot
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Please deserialize the monitoring snapshot input string into a Python
      dictionary. The input is a JSON string containing trading performance metrics.
  design_exit_rules:
    agent: false
    description: Generates a textual exit rule specification from indicator data and
      statistical metadata.
    name: design_exit_rules
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: "Design exit rules based on the provided indicator dataframe and statistical\
      \ data. \n\n**Inputs**:\n- `indicators_df`: String representation of the indicators\
      \ DataFrame (e.g., CSV or JSON). \n- `statistical_data`: String representation\
      \ of descriptive statistics for the assets (e.g., JSON). \n\n**Output**:\n-\
      \ `output`: A concise, human‑readable string describing the exit rules to be\
      \ used by the trading strategy."
  evaluate_performance_stability:
    agent: false
    description: Evaluates whether trading performance metrics fall within acceptable
      thresholds and returns a stability status.
    name: evaluate_performance_stability
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Given performance metrics and threshold limits as JSON strings, determine
      if the performance is stable and return the result as a JSON string.
  execute_trades:
    agent: false
    description: Execute trades based on the defined strategy and risk management
      rules.
    name: execute_trades
    nodes_depended_on:
    - backtest_trading_strategy
    - configure_trading_infrastructure
    - implement_risk_management
    nodes_dependent_on: []
    prompt: Execute trades according to the strategy, using the configured infrastructure
      and adhering to risk management rules.
  fetch_raw_market_data:
    agent: false
    description: Fetch raw market data for specified assets, timeframes, and source,
      returning the raw data dictionary as a JSON string.
    name: fetch_raw_market_data
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: '## Fetch Raw Market Data


      **Parameters**

      - `assets` (str): comma‑separated asset tickers (e.g., `AAPL,MSFT`).

      - `timeframes` (str): comma‑separated timeframes (e.g., `1D,1H`).

      - `source` (str): name of the data source provider (e.g., `yfinance`).


      **Output**

      Returns a JSON string `output` containing the raw market data dictionary, along
      with the echoed input parameters `assets`, `timeframes`, and `source`.

      '
  filter_successful_trades:
    agent: false
    description: Filters successful trades from a batch of executed trades and returns
      them as a JSON string.
    name: filter_successful_trades
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: '### Filter Successful Trades


      Given JSON string representations of trade execution data (status, IDs, prices,
      quantities, instruments, sides, and timestamps), return a JSON string of only
      the trades whose status is `true`.


      **Inputs** (each is a JSON string representing an array of the same length):

      - `trade_status`

      - `trade_ids`

      - `trade_prices`

      - `trade_quantities`

      - `trade_instruments`

      - `trade_sides`

      - `trade_timestamps`


      **Output**:

      - `output` – a JSON string representing an array of objects, each object containing
      the fields `id`, `instrument`, `side`, `price`, `quantity`, and `timestamp`
      for successful trades.'
  filter_tradeable_assets:
    agent: false
    description: Filters a list of asset tickers based on their data quality score,
      trading volume, and a minimum quality threshold to produce a list of tradeable
      assets.
    name: filter_tradeable_assets
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Given a comma‑separated string of asset tickers, their corresponding data
      quality scores, a serialized DataFrame of their historical data, and a minimum
      quality threshold, return a comma‑separated string of assets that meet the threshold
      and have sufficient trading volume.
  format_market_data_output:
    agent: false
    description: Formats cleaned market data into a standardized dictionary for downstream
      consumption.
    name: format_market_data_output
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Implement format_market_data_output: Given a JSON string representing
      cleaned market data, produce a JSON string containing standardized fields such
      as assets, timeframes, timestamps, price_values, record_count, and is_clean.'
  formulate_entry_rules:
    agent: false
    description: Generate a concise entry rule string for a trading strategy based
      on the predictive power analysis of technical indicators.
    name: formulate_entry_rules
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: '## Entry Rule Generation


      You are given two inputs:


      1. **signal_results** – a JSON string that maps indicator names to their predictive
      power metrics (e.g., correlation, ROC AUC).

      2. **indicators_df** – a CSV string containing the historical values of each
      technical indicator for the assets under consideration.


      Your task is to generate a single, plain‑text *entry rule* string that a trading
      strategy can use. Use only indicators whose predictive power exceeds **0.20**
      and combine them with logical `AND`/`OR` operators. The rule should be easy
      to parse and should reference indicator names and threshold conditions (e.g.,
      `EMA10 > EMA20`). Return only the rule string, no additional formatting.


      **Output:** A plain text string representing the composite entry rule.'
  generate_improvement_suggestions:
    agent: false
    description: Generate a concise set of improvement suggestions based on win rate,
      maximum drawdown, and Sharpe ratio.
    name: generate_improvement_suggestions
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Given the win rate, maximum drawdown, and Sharpe ratio of a trading strategy,
      output a comma‑separated list of improvement suggestions.
  generate_performance_summary:
    agent: false
    description: Generates a concise textual performance summary for a trading strategy
      based on provided performance metrics.
    name: generate_performance_summary
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Generate a concise performance summary for the strategy "{strategy_name}"
      given the following metrics: {metrics}'
  generate_recommended_adjustments:
    agent: false
    description: Produces a list of strategy or risk management adjustments based
      on performance metrics and thresholds.
    name: generate_recommended_adjustments
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Generate recommended adjustments given performance metrics, thresholds,
      and stability result.


      **Input**

      - `metrics`: JSON string of performance metrics.

      - `thresholds`: JSON string of performance thresholds.

      - `stability_result`: JSON string indicating stability status.


      **Output**

      - A JSON-formatted string containing a list of recommended adjustments.'
  generate_strategy_name:
    agent: false
    description: Creates a concise, descriptive trading strategy name based on provided
      entry rules and timeframes.
    name: generate_strategy_name
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Generate a concise, descriptive trading strategy name from the given entry
      rules and timeframes.
  generate_technical_indicators:
    agent: false
    description: Generates a comprehensive set of technical indicators for the provided
      market data across specified timeframes.
    name: generate_technical_indicators
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Please provide a JSON object with keys \"output\", \"dataframe\", and
      \"timeframes\" where \"output\" is the JSON string of the dataframe with computed
      indicators. The \"dataframe\" and \"timeframes\" keys are input strings.
  get_current_iso_timestamp:
    agent: false
    description: Returns the current UTC timestamp formatted as an ISO‑8601 string.
    name: get_current_iso_timestamp
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Generate the current UTC timestamp in ISO‑8601 format (e.g., '2025-09-28T12:34:56Z').
  implement_risk_management:
    agent: false
    description: Develop and implement risk management rules to control exposure.
    name: implement_risk_management
    nodes_depended_on:
    - define_trading_strategy
    nodes_dependent_on: []
    prompt: Implement risk management rules based on the strategy, including position
      sizing, stop‑loss levels, and portfolio diversification.
  initialize_monitoring_state:
    agent: false
    description: Initializes in-memory monitoring state for tracking positions, closed
      trades, and equity curve.
    name: initialize_monitoring_state
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Initialize an in-memory monitoring state consisting of a position map,
      a list of closed trades, and an equity curve list. Return the state as a dictionary.
  load_performance_thresholds:
    agent: false
    description: Loads and returns the performance threshold configuration as a JSON
      string.
    name: load_performance_thresholds
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Load performance thresholds configuration from the system and return it
      as a JSON string. Do not output anything else.
  map_suggestions_to_actions:
    agent: false
    description: Transforms a comma‑separated string of improvement suggestions into
      a string of concrete, implementable action items.
    name: map_suggestions_to_actions
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: '### Map Suggestions to Actions


      You are given a list of improvement suggestions:


      ```

      {{suggestions}}

      ```


      Translate each suggestion into a concrete, actionable item that can be implemented
      by the trading system. Return the action items as a single string, each item
      on a new line, prefixed with a dash.

      '
  monitor_trading_performance:
    agent: false
    description: Continuously monitors executed trades to calculate performance statistics,
      detect deviations from expected behavior, recommend strategy adjustments, and
      trigger alerts when performance deteriorates.
    name: monitor_trading_performance
    nodes_depended_on:
    - execute_trades
    nodes_dependent_on: []
    prompt: Monitor trading performance in real‑time, tracking key metrics and adjusting
      the strategy or risk management rules as necessary to maintain optimal performance.
  parse_market_data_request:
    agent: false
    description: Parses a general market data request string and keyword arguments
      to extract asset tickers and requested timeframes for historical data collection.
    name: parse_market_data_request
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Parse the market data request from the input string and kwargs to extract
      the list of asset tickers and timeframes, then return a dictionary containing
      these values.
  refine_trading_strategy:
    agent: false
    description: Refine the trading strategy based on analysis of trading results.
    name: refine_trading_strategy
    nodes_depended_on:
    - analyze_trading_results
    nodes_dependent_on: []
    prompt: Using insights from trading results, refine the trading strategy to improve
      performance, adjusting parameters or rules as necessary.
  retrieve_historical_price_data:
    agent: false
    description: Retrieve historical price data for a set of assets over specified
      timeframes and return the data as a JSON string.
    name: retrieve_historical_price_data
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Retrieve historical price data for the following assets and timeframes:

      ```json

      {retrieve_stock_data_input}

      ```

      The input should be a JSON string containing `assets` (comma‑separated asset
      symbols) and `timeframes` (comma‑separated timeframe identifiers such as `daily`,
      `weekly`, `monthly`).'
  select_optimal_data_source:
    agent: false
    description: Selects the best data source for the provided asset tickers based
      on coverage, latency, cost, and data quality.
    name: select_optimal_data_source
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: '## Select Optimal Data Source


      Given a comma‑separated list of asset tickers, determine the best data source
      for retrieving historical market data. The data source should be chosen based
      on coverage, latency, cost, and data quality. Return the name of the selected
      data source.


      **Input**:

      - `assets`: Comma‑separated string of asset tickers.


      **Output**:

      - `output`: Name of the selected data source.'
  simulate_trade_execution:
    agent: false
    description: Simulates the execution of trades over historical price data using
      specified entry, exit, position sizing, and risk management rules, returning
      a list of trade outcomes.
    name: simulate_trade_execution
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Simulate trade execution over historical data.


      **Inputs**

      - historical_data: JSON string containing time‑series price data for each asset.

      - entry_rules: String describing the conditions that trigger a long or short
      position.

      - exit_rules: String describing the conditions that close a position.

      - position_sizing: String rule that determines how much capital or shares to
      trade.

      - risk_management: String rule that sets stop‑losses, max draw‑downs, etc.


      **Output**

      - output: JSON string representing a list of trade objects (each with entry
      time, exit time, asset, position size, pnl, etc.).'
  update_equity_curve:
    agent: false
    description: Updates the equity curve data structure by incorporating the return
      fraction of a closed trade.
    name: update_equity_curve
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Given the current equity curve and the return fraction of a closed trade,
      update the equity curve accordingly and return a status message.
  update_position_map:
    agent: false
    description: Updates the position map with a new trade, detects closures, and
      returns details about the update.
    name: update_position_map
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: '# Update Position Map


      **Purpose**: Update the position map based on a single trade execution.


      **Inputs**:

      - `position_map` (dict): Current mapping of instrument to open positions.

      - `instrument` (str): The trade’s instrument symbol.

      - `side` (str): Trade side – either `''buy''` or `''sell''`.

      - `price` (str): Trade price.

      - `quantity` (str): Trade quantity.

      - `timestamp` (str): ISO 8601 timestamp of the trade.


      **Output**: `output` (any) – a dictionary containing

      - `position_closed` (bool)

      - `entry_price` (float)

      - `closed_quantity` (float)

      - `original_side` (str)


      **Instructions**: Implement the shim to parse the inputs, update the position
      map, detect full or partial closures, and return the structured result.

      '
  validate_and_structure_data:
    agent: false
    description: Transforms raw string inputs of assets, timestamps, price values,
      and timeframes into a validated, structured pandas DataFrame and returns it
      as a CSV string.
    name: validate_and_structure_data
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: '### validate_and_structure_data Prompt


      You will receive four comma‑separated string inputs:

      - **assets** – asset tickers (e.g., `AAPL,MSFT,GOOG`)

      - **timestamps** – ISO 8601 timestamps (e.g., `2023-01-01T00:00:00Z,2023-01-01T01:00:00Z`)

      - **price_values** – numeric price values (e.g., `150.5,152.3,149.8`)

      - **timeframes** – timeframe labels (e.g., `1h,1h,1h`)


      Your task is to:

      1. Split each input into a list.

      2. Validate that all lists have identical length.

      3. Confirm each timestamp is valid ISO 8601.

      4. Convert all price values to floats.

      5. Build a pandas DataFrame with columns `asset`, `timestamp`, `price`, `timeframe`.

      6. Return the DataFrame as a CSV string under the key `output`.


      Respond with a JSON object containing a single key `output` and the CSV string.'
  validate_output_schema:
    agent: false
    description: Validates that the provided output data string conforms to the expected
      schema for the node and raises an error if validation fails.
    name: validate_output_schema
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Validate that the JSON string in `output_data` conforms to the node's
      output schema and return a success flag or raise an informative error.
  validate_strategy_definition:
    agent: false
    description: Validates and normalizes the trading strategy definition, ensuring
      all required fields are present and correctly formatted, and determines any
      additional required timeframes.
    name: validate_strategy_definition
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: '## Prompt


      You are given a JSON string representing a `DefineTradingStrategyOutput` object.
      Your task is to validate that all required fields are present and non‑empty,
      parse the `assets_traded` field into a list, derive any additional `required_timeframes`
      based on the strategy (e.g., if the entry or exit rules mention a specific timeframe,
      include it), and return a JSON string of a Python dict containing the following
      keys:


      - `strategy_name`

      - `entry_rules`

      - `exit_rules`

      - `position_sizing_rule`

      - `risk_management_rule`

      - `assets_traded` (list of strings)

      - `required_timeframes` (list of strings)


      If any required field is missing or empty, raise a `ValueError` with a descriptive
      message. The returned dict should be serializable to JSON.


      **Input:** `strategy_input: str` (JSON string)


      **Output:** `output: str` (JSON string of the validated dict)'
