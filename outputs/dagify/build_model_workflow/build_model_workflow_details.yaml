dag_type: plain_text
description: A workflow that creates a PlainTextDAGModel to build a workflow for building
  a workflow.
name: build_model_workflow
nodes:
  clarify_model_objective:
    agent: false
    description: Elucidate the objective for the PlainTextDAGModel
    name: clarify_model_objective
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: The prompt for this step should describe the objective of building a workflow
      to build a workflow.
  define_workflow_dag_steps:
    agent: false
    description: Define the workflow steps required for creating the workflow DAG.
    name: define_workflow_dag_steps
    nodes_depended_on:
    - generate_workflow_dag_schema
    nodes_dependent_on: []
    prompt: List the fundamental steps required for creating the workflow DAG, adhering
      to the Elemental Thoughts framework.
  generate_workflow_dag_schema:
    agent: false
    description: Generate the PlainTextDAGModel schema.
    name: generate_workflow_dag_schema
    nodes_depended_on:
    - identify_required_fields
    nodes_dependent_on: []
    prompt: Define the PlainTextDAGModel schema structure in the form of a JSON object.
  identify_required_fields:
    agent: false
    description: Identify the specific fields required for the PlainTextDAGModel
    name: identify_required_fields
    nodes_depended_on:
    - clarify_model_objective
    nodes_dependent_on: []
    prompt: Describe the  fields required for a PlainTextDAGModel to build a workflow
      DAG.
  populate_workflow_dag_steps:
    agent: false
    description: Populate the workflow DAG steps with specific details.
    name: populate_workflow_dag_steps
    nodes_depended_on:
    - define_workflow_dag_steps
    nodes_dependent_on: []
    prompt: Execute the defined workflow steps, ensuring each step is achievable,
      relies on direct inputs, and accomplishes a single, well-defined outcome.
  refine_workflow_dag_model:
    agent: false
    description: Refine the PlainTextDAGModel with detailed, executable workflow steps.
    name: refine_workflow_dag_model
    nodes_depended_on:
    - validate_workflow_dag
    nodes_dependent_on: []
    prompt: Check correctness, precision, and reasonableness of each internal step
      for achieving the objectives specified, ensuring strict adherence to the workflow
      DAG.
  validate_workflow_dag:
    agent: false
    description: Validate that the workflow DAG meets the acyclic and connected requirements.
    name: validate_workflow_dag
    nodes_depended_on:
    - populate_workflow_dag_steps
    nodes_dependent_on: []
    prompt: Verify that the workflow DAG consists of an acyclic graph and includes
      direct parent-node relations for nodes based on the nodes they depend on.
