        reason: Implied volatility must be aligned day‑for‑day with realized volatility
          to be used later in feature engineering and model training.
        text: Retrieve the implied‑volatility index series from the provider identified
          in step 1 for the exact same date range as `price_df`.
      - complexity: LOW
