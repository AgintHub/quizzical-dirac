          equity value: `(equity_curve[''Equity''] - cumulative_max) / cumulative_max`.  The
          maximum drawdown is the minimum (most negative) value of the drawdown series.  Return
          the max drawdown as a negative number.'
        reason: Max drawdown indicates the largest peak-to-trough decline during the
          backtest period and assesses risk.
