dag_type: plain_text
description: Generated workflow from UI.
name: Generated Workflow from UI
nodes:
  compile_trading_workflow_documentation:
    agent: false
    description: Compile all elements into a comprehensive trading workflow documentation.
    name: compile_trading_workflow_documentation
    nodes_depended_on:
    - define_trading_objectives
    - select_trading_strategy
    - identify_tradable_assets
    - define_risk_management_rules
    - specify_execution_plan
    - develop_performance_metrics
    - create_monitoring_and_control_process
    nodes_dependent_on: []
    prompt: Synthesize the outputs from prior steps into a cohesive document outlining
      the complete trading workflow.
  create_monitoring_and_control_process:
    agent: false
    description: Establish a process for ongoing monitoring and control of the trading
      workflow.
    name: create_monitoring_and_control_process
    nodes_depended_on:
    - specify_execution_plan
    - develop_performance_metrics
    nodes_dependent_on: []
    prompt: Outline the process for continuously monitoring the trading workflow's
      performance and risk, and for making adjustments as necessary.
  define_risk_management_rules:
    agent: false
    description: Establish risk management rules to control exposure.
    name: define_risk_management_rules
    nodes_depended_on:
    - select_trading_strategy
    nodes_dependent_on: []
    prompt: Specify risk management rules, including position sizing, stop-loss levels,
      and portfolio diversification requirements.
  define_trading_objectives:
    agent: false
    description: Identify the primary objectives for the trading workflow.
    name: define_trading_objectives
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: State the core objectives for the trading workflow, including target returns,
      risk tolerance, and any specific constraints.
  develop_performance_metrics:
    agent: false
    description: Define metrics to evaluate the performance of the trading workflow.
    name: develop_performance_metrics
    nodes_depended_on:
    - define_trading_objectives
    nodes_dependent_on: []
    prompt: Specify the key performance indicators (KPIs) to be used, such as return
      on investment (ROI), Sharpe ratio, or maximum drawdown.
  identify_tradable_assets:
    agent: false
    description: Determine the assets or instruments to be traded.
    name: identify_tradable_assets
    nodes_depended_on:
    - select_trading_strategy
    nodes_dependent_on: []
    prompt: List the specific assets or instruments that the chosen strategy will
      trade, such as stocks, futures, or currencies.
  select_trading_strategy:
    agent: false
    description: Choose a suitable trading strategy based on the defined objectives.
    name: select_trading_strategy
    nodes_depended_on:
    - define_trading_objectives
    nodes_dependent_on: []
    prompt: Select a trading strategy that aligns with the stated objectives, such
      as trend following, mean reversion, or statistical arbitrage.
  specify_execution_plan:
    agent: false
    description: Outline the plan for executing trades.
    name: specify_execution_plan
    nodes_depended_on:
    - identify_tradable_assets
    - define_risk_management_rules
    nodes_dependent_on: []
    prompt: Describe the execution plan, including the trading venues, order types,
      and any specific execution algorithms to be used.
