      - complexity: MEDIUM
        impact: MEDIUM
        method: '```python

          delta = df[''Close''].diff()

          up = delta.clip(lower=0)

          down = -delta.clip(upper=0)

          roll_up = up.ewm(span=14, adjust=False).mean()

          roll_down = down.ewm(span=14, adjust=False).mean()

          RS = roll_up / roll_down

          rsi = 100 - (100 / (1 + RS))

          ``` Assign to column `rsi`.'
        reason: RSI is a widely‑used momentum oscillator; the 14‑day period is standard
          and provides a balanced signal.
        text: 'Implement the Relative Strength Index (RSI) with a 14‑day look‑back:
