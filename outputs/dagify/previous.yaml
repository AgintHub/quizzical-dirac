        reason: Consistent chronological order is required for time‑series feature
          engineering; eliminating rows with missing data simplifies later processing.
        text: Sort the DataFrame by `Date` ascending and drop any rows that still
          contain `NaN` after reindexing if the business rule is to exclude incomplete
          days.
      - complexity: LOW
        impact: HIGH
        method: Use pandas `.tolist()` on each column. Cast `volumes` explicitly to
