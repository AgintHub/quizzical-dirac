        reason: Predictions are needed to construct daily position signals and subsequent
          performance series.
        text: Generate predictions on the Test DataFrame for each valid model. Use
          the model's `predict` method on the feature matrix (exclude `Target` and
          `Date`). Store predictions as a NumPy array aligned with the Test dates.
      - complexity: LOW
        impact: MEDIUM
        method: '`positions = np.sign(predictions)`; ensure positions are -1, 0, or
          +1; store as `model_id -> positions`.'
        reason: A deterministic signal generation rule enables reproducible performance
          metrics across all candidates.
        text: 'Convert raw predictions into daily position signals. Adopt a simple
          long‑short rule: `position = np.sign(prediction)`. Optionally, apply a volatility‑scaled
          position size using the `GARCHForecast` from `compute_volatility_features`
          if available; otherwise use unit exposure.'
      - complexity: LOW
        impact: HIGH
        method: Element‑wise multiplication; produce a Series `daily_ret` indexed
          by Date.
        reason: Portfolio returns are the direct input for Sharpe, drawdown, turnover
          and hit‑rate calculations.
        text: 'Compute daily portfolio returns for each model: `return_t = position_t
          * test_df[''Target''].values`. This assumes the Target column is the next‑day
          excess return of the primary asset.'
      - complexity: MEDIUM
        impact: HIGH
        method: 'Implement helper functions: `calc_sharpe`, `calc_ann_return`, `calc_max_dd`,
          `calc_turnover`, `calc_hit_rate`. Use `numpy` for vectorised operations;
          guard against zero‑variance (std=0) by returning Sharpe=0.'
        reason: These metrics directly answer the node's prompt and provide a basis
          for ranking.
        text: 'Calculate performance metrics per model:

          - **Sharpe ratio**: mean(daily_ret) / std(daily_ret) * sqrt(252).

          - **Annualized return**: (1 + mean(daily_ret))^252 - 1, expressed in percent.

          - **Max drawdown**: use the cumulative product of (1+daily_ret) to build
          equity curve, then compute peak‑to‑trough decline.

          - **Turnover**: average absolute change in position per day (`|Δposition|`)
          expressed as a percent of the notional (since position values are -1/0/1,
          turnover = mean(|Δposition|) * 100).

          - **Hit‑rate**: proportion of days where `daily_ret > 0`.

          Store each metric in its respective list.'
      - complexity: LOW
        impact: MEDIUM
        method: Create NumPy arrays for each metric; apply weights; use `np.argsort`
          to produce rank list aligned with `candidate_models`.
        reason: A single numeric ranking enables clear ordering while respecting risk‑adjusted
          performance.
        text: 'Assemble a composite ranking score. Define the score as a weighted
          sum: `score = Sharpe * 0.5 - MaxDrawdown * 0.3 + AnnualizedReturn * 0.2`.
          Higher scores are better. Compute scores for all candidates and obtain ranks
          via `np.argsort(-score) + 1` (1 = best).'
      - complexity: LOW
        impact: HIGH
        method: Iterate over stored metric dicts; cast to Python `float`; build final
          dict matching `output_structure`.
        reason: Ensures the output conforms exactly to the declared schema for downstream
          nodes.
        text: 'Populate the output fields in the order of the original candidate list:

          - `candidate_models` = list of identifiers.

          - `sharpe_ratios`, `annualized_returns`, `max_drawdowns`, `turnovers`, `hit_rates`,
          `ranks` = corresponding metric lists.

          Convert percentages to float (e.g., 12.5 for 12.5%).'
      - complexity: LOW
        impact: MEDIUM
        method: '`assert len(set(ranks)) == N and max(ranks) == N` etc.; use Python
          `assert` with custom error text.'
        reason: Pre‑empt downstream failures (e.g., `select_best_model`) caused by
          malformed output.
        text: 'Validate the final output: confirm all lists have identical length,
          no `None` values, and ranks form a permutation of 1..N. If any check fails,
          raise an exception with a clear message.'
      - complexity: LOW
        impact: LOW
        method: Use Python `logging` module at INFO level; format string with f‑interpolation.
        reason: Transparency for users and for automated pipelines that capture logs.
        text: 'Log a concise summary to stdout or a logger: number of evaluated models,
          best model identifier, its Sharpe and max drawdown. This aids debugging
          and audit trails.'
    prompt: Using the Test set, calculate Sharpe ratio, annualized return, max drawdown,
      turnover, and hit‑rate for each candidate. Output a ranked table.
