dag_type: spec
description: Generated workflow from UI.
name: multi_factor_quant_strategy_generation
nodes:
  align_and_clean_data:
    agent: false
    description: Synchronize all fetched datasets to a common calendar, handle missing
      values, and store a clean master dataset.
    name: align_and_clean_data
    nodes_depended_on:
    - fetch_price_data
    - fetch_cross_asset_data
    - fetch_regime_indicator_data
    - fetch_volatility_data
    nodes_dependent_on: []
    output_structure:
    - description: CSV‑formatted text of the cleaned master DataFrame after merging
        and imputation.
      key: cleaned_data_csv
      type: str
    - description: Number of rows (dates) present in the cleaned DataFrame.
      key: row_count
      type: int
    - description: List of column names in the cleaned DataFrame, including the primary
        asset fields and all feature columns.
      key: column_names
      type: List[str]
    - description: Indicates whether any missing values were forward‑filled during
        the cleaning process (true if any fill occurred, false if none were needed).
      key: missing_values_filled
      type: bool
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Use `pd.DataFrame` constructors from the primitive lists; e.g., for
          fetch_price_data build columns Date, Open, High, Low, Close, Volume. Apply
          `pd.to_datetime(df['Date'])` and `df.set_index('Date', inplace=True)` for
          all five DataFrames.
        reason: Uniform datetime indexing guarantees a deterministic merge order and
          simplifies calendar alignment.
        text: Load each parent node's output into a Pandas DataFrame with Date parsed
          as `datetime64[ns]` and set as the index.
      - complexity: LOW
        impact: MEDIUM
        method: Check `df.index.duplicated().any()` and raise an exception if true;
          enforce `df.index = df.index.tz_localize('UTC')` when tz‑naive.
        reason: Duplicate dates or timezone mismatches cause ambiguous merges and
          hidden NaNs.
        text: Validate that all five DataFrames share the same timezone (UTC) and
          that there are no duplicate Date entries within any table.
      - complexity: MEDIUM
        impact: HIGH
        method: Start with `master_df = price_df`; iterate over `[cross_asset_df,
          regime_df, volatility_df]` and execute `master_df = master_df.join(other_df,
          how='outer')`. Preserve original column names to avoid collisions.
        reason: Outer join preserves the full universe of dates from any source, creating
          the superset calendar required for downstream feature engineering.
        text: Perform an outer join on the Date index across all five DataFrames using
          `pd.merge(..., how='outer')` sequentially or `pd.concat(..., axis=1, join='outer')`.
      - complexity: LOW
        impact: LOW
        method: Store the result; after forward‑fill, compute `missing_after_fill
          = master_df.isna().any().any()` and set `missing_values_filled = missing_before_fill
          and not missing_after_fill`.
        reason: The output field `missing_values_filled` must reflect whether forward‑fill
          actually occurred.
        text: Create a boolean flag `missing_before_fill = master_df.isna().any().any()`
          to record whether any NaNs exist prior to imputation.
      - complexity: LOW
        impact: HIGH
        method: Execute `master_df.ffill(inplace=True); master_df.bfill(inplace=True)`.
        reason: Forward‑fill respects causality (using the most recent known value),
          while a trailing `bfill` ensures the first rows are not dropped unnecessarily.
        text: Apply forward‑fill (`ffill`) on the merged DataFrame, then backward‑fill
          (`bfill`) as a safety net for leading NaNs.
      - complexity: LOW
        impact: MEDIUM
        method: Call `master_df.dropna(inplace=True)` and verify `master_df.empty`
          is false; otherwise raise an alert.
        reason: Downstream models cannot handle missing entries; dropping ensures
          a clean dataset.
        text: Drop any remaining rows that still contain NaN values after imputation
          using `master_df.dropna(inplace=True)`.
      - complexity: LOW
        impact: LOW
        method: Assign variables directly after the final drop operation.
        reason: These fields are required by the downstream schema and useful for
          sanity‑checking the cleaning step.
        text: Capture `row_count = master_df.shape[0]` and `column_names = list(master_df.columns)`
          for output metadata.
      - complexity: LOW
        impact: LOW
        method: Use `cleaned_data_csv = master_df.reset_index().to_csv(index=False,
          line_terminator='\n')`.
        reason: The downstream nodes expect CSV text; omitting the index avoids an
          extra unnamed column.
        text: Convert the cleaned DataFrame to a CSV‑formatted string without the
          index (`index=False`) and store as `cleaned_data_csv`.
      - complexity: LOW
        impact: HIGH
        method: 'Return `{ ''cleaned_data_csv'': cleaned_data_csv, ''row_count'':
          int(row_count), ''column_names'': column_names, ''missing_values_filled'':
          bool(missing_values_filled) }`.'
        reason: Consistent typing and field naming allow downstream nodes to consume
          the result without conversion errors.
        text: Assemble the final output dictionary matching the declared `output_structure`
          and return it to the workflow engine.
    prompt: Merge the five tables on Date, forward‑fill any missing values, and drop
      rows still containing NaNs. Return the cleaned DataFrame as CSV text.
  analyze_feature_importance:
    agent: false
    description: Compute and report the importance of each feature for the selected
      model.
    name: analyze_feature_importance
    nodes_depended_on:
    - select_best_model
    - assemble_feature_matrix
    nodes_dependent_on: []
    output_structure:
    - description: Identifier of the model selected as best (e.g., "GBM_v1" or "LSTM_ensemble")
      key: model_id
      type: str
    - description: List of feature names sorted from most to least important
      key: feature_names
      type: str
    - description: Corresponding importance scores for each feature in feature_names
        (higher means more important)
      key: importance_scores
      type: float
    - description: Method used to compute importance (e.g., "SHAP", "gain", "permutation")
      key: ranking_method
      type: str
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Access the `best_model_identifier` field from the `select_best_model`
          node's output.
        reason: The `model_id` is required to load the selected model for feature
          importance analysis.
        text: Retrieve the best model identifier from the output of the `select_best_model`
          node.
      - complexity: MEDIUM
        impact: HIGH
        method: Use a CSV parsing library (e.g., pandas in Python) to load the `feature_matrix_csv`
          into a dataframe.
        reason: The model needs the feature data used for training to determine feature
          importances. Loading from CSV ensures consistent data format.
        text: Load the feature matrix from the CSV string provided in the `feature_matrix_csv`
          field of the `assemble_feature_matrix` node's output.
      - complexity: MEDIUM
        impact: HIGH
        method: Implement a model registry or loading function that maps `model_id`
          to a corresponding model object. Handle potential errors like model not
          found.
        reason: The model needs to be loaded to calculate feature importances based
          on its internal structure or through permutation methods.
        text: Load the selected model based on the `model_id` retrieved earlier. Assume
          a model registry or loading function exists. If the model ID contains information
          about the model type, use that.
      - complexity: HIGH
        impact: HIGH
        method: Implement a conditional logic to select the feature importance method
          based on the model type. Account for cases where feature importance is not
          available through direct model introspection. Allow overriding this choice
          using external config parameters.
        reason: Different model types have different methods for determining feature
          importance. This step selects the appropriate method.
        text: Determine feature importance ranking method. If the model is a tree-based
          model (e.g., Gradient Boosting), use 'gain' (mean decrease in impurity).
          If the model is linear/logistic regression, use coefficients as the importance
          score. If the above are not applicable, or if specified in configuration,
          use SHAP values.
      - complexity: HIGH
        impact: HIGH
        method: Use model-specific methods to compute feature importances. For tree
          based models, use `model.feature_importances_`. For SHAP, instantiate a
          `shap.Explainer` object with the model (or model's prediction function)
          and compute SHAP values for a representative sample of the data.
        reason: This is the core step where the feature importances are calculated.
        text: Compute feature importances using the chosen method. For 'gain', extract
          the feature importances directly from the model. For SHAP values, use a
          SHAP explainer on a subset of the feature matrix.
      - complexity: LOW
        impact: HIGH
        method: Sort the feature names based on the corresponding importance scores
          using a sorting algorithm (e.g., `sorted` function in Python with `reverse=True`).
        reason: The ranked list provides the most relevant features at the top.
        text: Rank the features based on their importance scores in descending order.
      - complexity: LOW
        impact: LOW
        method: Unzip the sorted list of tuples (feature name, importance score).
        reason: This prepares the data for the output structure.
        text: Extract the sorted feature names and corresponding importance scores
          into separate lists.
      - complexity: LOW
        impact: HIGH
        method: Assign the calculated values to the corresponding fields in the output
          dictionary.
        reason: This provides the results in the required format.
        text: Populate the output structure with the `model_id`, sorted `feature_names`,
          `importance_scores`, and `ranking_method`.
    prompt: For the chosen model, generate a ranked list of feature importances (e.g.,
      gain, SHAP values). Present as a table with Feature and ImportanceScore.
  assemble_feature_matrix:
    agent: false
    description: Combine all individual feature tables into a single matrix aligned
      with the target variable.
    name: assemble_feature_matrix
    nodes_depended_on:
    - compute_price_action_features
    - compute_cross_asset_features
    - compute_regime_features
    - compute_volatility_features
    nodes_dependent_on: []
    output_structure:
    - description: CSV‑formatted string containing the complete feature matrix with
        a Date column, all merged feature columns, and a Target column for the next‑day
        return.
      key: feature_matrix_csv
      type: str
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: Use pandas.read_csv with `parse_dates=['Date']`, `dayfirst=False`,
          `dtype` inference disabled; wrap in try/except to capture malformed rows.
        reason: Ensures that all feature tables are correctly interpreted before any
          join operation; parsing errors are caught early.
        text: Load the CSV payloads from each parent node (price_action, cross_asset,
          regime, volatility) into in‑memory data frames using a robust CSV parser
          that respects ISO‑8601 dates and quoted fields.
      - complexity: LOW
        impact: HIGH
        method: Apply `df['Date'] = pd.to_datetime(df['Date']).dt.normalize()` and
          then `df.set_index('Date', inplace=True)`.
        reason: Date inconsistencies (timezones, format variations) would cause mismatched
          joins and missing rows.
        text: Standardize the Date column across all data frames to midnight UTC and
          set it as the index to guarantee exact alignment during the merge.
      - complexity: MEDIUM
        impact: HIGH
        method: Use `merged = price_df.join([cross_df, regime_df, vol_df], how='inner')`.
        reason: Target computation requires a complete set of predictors; dropping
          dates with missing features avoids NaNs later in modeling.
        text: Perform an inner join on the Date index across the four feature data
          frames to keep only dates present in every source, thereby guaranteeing
          a complete feature row for each observation.
      - complexity: MEDIUM
        impact: MEDIUM
        method: After merging, inspect `merged.columns`. For any duplicates, rename
          using a prefix based on source table (e.g., `price_`, `vol_`). Implement
          a helper `unique_rename(columns, source_prefix)`.
        reason: Duplicate columns cause CSV export failures and ambiguous feature
          references in downstream models.
        text: Detect and resolve any duplicate column names that may arise from overlapping
          feature names (e.g., both price and volatility tables containing a column
          called `date`).
      - complexity: MEDIUM
        impact: HIGH
        method: Create a series `next_day_return = price_df['close'].shift(-1) / price_df['close']
          - 1`. Append as a new column `Target` to the merged data frame. Drop the
          final row where Target is NaN.
        reason: The model learns to predict this target; it must be aligned with the
          feature row date (i.e., return from t to t+1 assigned to row at date t).
        text: Compute the target variable – next‑day simple return – using the cleaned
          primary asset closing price series that resides in the price_action feature
          table (column `close`).
      - complexity: LOW
        impact: LOW
        method: Execute `merged.sort_index(inplace=True); merged.reset_index(inplace=True)`.
        reason: Ordered dates simplify downstream time‑series splits and improve readability
          of the CSV output.
        text: Re‑index the final merged data frame to ensure chronological order (oldest
          to newest) and reset the index to a regular `Date` column for CSV export.
      - complexity: MEDIUM
        impact: MEDIUM
        method: 'Run assertions: `assert merged.isnull().sum().sum() == 0`, `assert
          ''Target'' in merged.columns`, `assert len(merged) == expected_rows`.'
        reason: A sanity check prevents propagation of corrupted data into model training
          and backtesting stages.
        text: 'Validate the final matrix: ensure no missing values, confirm that the
          column count equals sum of unique feature columns plus `Date` and `Target`,
          and verify that row count matches the expected number of trading days (original
          dates minus one for target lag).'
      - complexity: LOW
        impact: HIGH
        method: Use `feature_matrix_csv = merged.to_csv(index=False, line_terminator='\n')`
          and store as a Python string.
        reason: The downstream nodes expect a plain string CSV; consistent encoding
          avoids hidden character issues.
        text: Serialize the validated data frame to a CSV‑formatted string with UTF‑8
          encoding, ensuring the header line includes `Date` followed by all feature
          names and finally `Target`.
      - complexity: LOW
        impact: LOW
        method: 'Construct a log message: `logger.info(f''Feature matrix generated:
          {len(merged)} rows, {len(merged.columns)} columns, dates {merged["Date"].min()}–{merged["Date"].max()}'')`
          then assign to output.'
        reason: Provides transparency for pipeline monitoring and aids debugging if
          downstream nodes fail.
        text: Return the CSV string as the node output `feature_matrix_csv` and log
          a concise summary (row count, column count, date range) for observability.
    prompt: Merge the four feature tables on Date, ensure no duplicate columns, and
      keep the target variable (next‑day return) as a separate column named Target.
      Return the full matrix as CSV.
  compile_strategy_documentation:
    agent: false
    description: Assemble all model, feature, risk, execution, and backtest artifacts
      into a single strategy dossier.
    name: compile_strategy_documentation
    nodes_depended_on:
    - select_best_model
    - design_risk_controls
    - draft_execution_logic
    - summarize_backtest_results
    nodes_dependent_on: []
    output_structure:
    - description: Markdown text summarizing the high‑level strategy intent, asset
        universe, time horizon, and performance goals.
      key: strategy_overview
      type: str
    - description: Markdown description of data sources, cleaning steps, and a concise
        list of engineered features.
      key: data_and_features
      type: str
    - description: Markdown detailing the selected model(s), algorithmic components,
        input shapes, and how predictions are combined.
      key: model_architecture
      type: str
    - description: Markdown table (or bullet list) ranking features by importance
        scores (e.g., gain, SHAP).
      key: feature_importance
      type: str
    - description: Markdown outlining the portfolio‑level and position‑level risk
        controls, limits, and stop‑loss rules.
      key: risk_management
      type: str
    - description: Markdown block containing the pseudo‑code for real‑time signal
        generation, risk filtering, order sizing, and order submission.
      key: execution_pseudocode
      type: str
    - description: Markdown summary of backtest performance metrics and brief description
        of supporting charts.
      key: backtest_results
      type: str
    - description: Markdown checklist of items required to operationalize the strategy
        (e.g., code deployment, config files, monitoring setup).
      key: implementation_checklist
      type: str
    - description: The complete compiled strategy dossier, concatenating all sections
        in proper heading order.
      key: full_document_markdown
      type: str
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Call the `select_best_model` output, parse the four fields, and assign
          them to variables (e.g., bestModelId, bestSharpe, bestDD, bestAnnRet).
        reason: The model metadata drives the narrative for Strategy Overview and
          Model Architecture, ensuring consistency with the quantitative evaluation.
        text: Extract the best‑model metadata (best_model_identifier, sharpe_ratio,
          max_drawdown, annualized_return) from the `select_best_model` node and store
          it in a temporary JSON object for reuse across multiple sections.
      - complexity: MEDIUM
        impact: HIGH
        method: 'Template string with placeholders: `## Strategy Overview\n- Objective:
          …\n- Selected Model: ${bestModelId}\n- Expected Sharpe: ${bestSharpe}\n-
          Max Drawdown (limit): ${bestDD}\n- Expected Annual Return: ${bestAnnRet}`.'
        reason: Provides stakeholders with a concise executive summary that links
          the chosen model to business goals.
        text: Create the **Strategy Overview** markdown string using the variables
          from step 1 together with static strategy objectives (asset universe, holding
          period) retrieved from the `define_strategy_objectives` node (accessed via
          the global context). Include a bullet list of performance targets (target
          Sharpe, max drawdown, annualized return).
      - complexity: MEDIUM
        impact: MEDIUM
        method: Hard‑code a markdown block based on known feature generation steps
          from `compute_price_action_features`, `compute_cross_asset_features`, `compute_regime_features`,
          and `compute_volatility_features`. Use markdown headings and bullet lists.
        reason: Even though the node does not directly depend on feature‑generation
          nodes, the documentation must describe the data foundation for reproducibility.
        text: Synthesize the **Data & Features** section by enumerating the four data
          pipelines (price, cross‑asset, regime, volatility) described in the DAG.
          Use concise bullet points to outline cleaning (forward‑fill, drop‑remaining
          NaNs) and list engineered features (log returns, moving averages, RSI, MACD,
          ATR, correlations, spreads, regime flags, GARCH forecasts, implied‑vol deltas).
      - complexity: MEDIUM
        impact: HIGH
        method: 'Create a markdown template: `## Model Architecture\n- Model ID: ${bestModelId}\n-
          Components: …\n- Input Shape: …\n- Combination Method: …`.'
        reason: Provides technical readers with a clear view of the predictive engine
          that will be deployed.
        text: Generate the **Model Architecture** markdown using the `bestModelId`
          from step 1 and the model description stored in `specify_model_architecture`
          (access via global context). Include input shape, component list (e.g.,
          Gradient Boosting, LSTM), and the prediction combination method (e.g., weighted
          averaging).
      - complexity: MEDIUM
        impact: MEDIUM
        method: Call `analyze_feature_importance`, iterate over zipped lists, format
          each row as `| Feature | Importance |`, prepend header and alignment row.
        reason: Feature importance is a key deliverable for model transparency; pulling
          from `analyze_feature_importance` ensures accurate rankings.
        text: Construct the **Feature Importance** markdown table. Since explicit
          importance scores are not directly output by any parent, invoke the `analyze_feature_importance`
          node (even though not listed as a direct dependency) to retrieve `feature_names`
          and `importance_scores`. Render them as a pipe‑separated markdown table
          sorted descending by score. If the node is unavailable, fallback to a placeholder
          statement indicating that importance data will be added after model inspection.
      - complexity: LOW
        impact: HIGH
        method: 'Loop index i over length of arrays, format: `- **${risk_control_names[i]}**:
          ${risk_control_thresholds[i]*100}% – `${risk_control_formulas[i]}`.'
        reason: Clearly communicating the quantitative risk limits is essential for
          compliance and for the execution engine to enforce limits.
        text: Build the **Risk Management** markdown by iterating over the three parallel
          arrays (`risk_control_names`, `risk_control_thresholds`, `risk_control_formulas`)
          returned by the `design_risk_controls` node. For each control, output a
          bullet with the name, threshold (as a human‑readable percentage), and the
          formula. Include a top‑level heading and a short description of portfolio‑
          vs. position‑level controls.
      - complexity: LOW
        impact: HIGH
        method: Wrap the pseudocode string in a markdown fenced code block with language
          `python` or `pseudo`.
        reason: The execution logic must be directly traceable to the risk controls
          and model signals; reusing the already‑generated pseudocode guarantees consistency.
        text: Insert the **Execution Pseudocode** markdown exactly as emitted by the
          `draft_execution_logic` node (`execution_logic_pseudocode` field). Prepend
          a heading and a brief narrative explaining how the pseudocode maps to the
          risk controls defined earlier.
      - complexity: LOW
        impact: HIGH
        method: 'Create a table: `| Metric | Value |` with rows for Annualized Return,
          Sharpe, Max Drawdown, Turnover, Win Rate. Then add sections: `### Charts`
          with bullet points using `histogram_description` and `turnover_chart_description`.
          Append `markdown_report`.'
        reason: Stakeholders need a concise performance snapshot together with visual
          insights; the `summarize_backtest_results` node already aggregates these
          stats.
        text: Compose the **Backtest Results** markdown using the seven fields produced
          by the `summarize_backtest_results` node. Present key metrics in a markdown
          table, embed the histogram and turnover‑chart descriptions as bullet items,
          and include the full `markdown_report` content verbatim under a sub‑heading.
      - complexity: LOW
        impact: MEDIUM
        method: 'Hard‑code the list: `- [ ] Deploy model code\n- [ ] Add config.yml
          ...`.'
        reason: A checklist formalizes the hand‑off steps and reduces operational
          risk during production rollout.
        text: 'Draft the **Implementation Checklist** markdown as a static ordered
          list covering: (a) Code deployment, (b) Config file creation, (c) Model
          serialization, (d) Risk‑control parameters upload, (e) Monitoring plan integration
          (reference `create_monitoring_plan` output), (f) Performance validation,
          (g) Documentation upload. Each item should include a checkbox placeholder
          `[ ]`.'
      - complexity: LOW
        impact: HIGH
        method: 'String concatenation with newline separators: `# Strategy Dossier\n\n${strategy_overview}\n\n${data_and_features}\n...`.'
        reason: A single, ordered markdown file is the final artifact expected by
          downstream nodes (e.g., `final_deliverables_package`).
        text: Concatenate all eight section strings in the exact order required by
          the deliverable (Strategy Overview → Data & Features → Model Architecture
          → Feature Importance → Risk Management → Execution Pseudocode → Backtest
          Results → Implementation Checklist) into the final `full_document_markdown`
          field. Ensure each section begins with a level‑2 markdown heading (`##`).
          Add a top‑level title (`# Strategy Dossier`) at the very top.
    prompt: 'Create a structured document containing: (1) Strategy Overview, (2) Data
      & Features, (3) Model Architecture, (4) Feature Importance, (5) Risk Management,
      (6) Execution Pseudocode, (7) Backtest Results, (8) Implementation Checklist.
      Use headings and bullet points.'
  compute_cross_asset_features:
    agent: false
    description: Create correlation and spread features between the primary asset
      and each cross‑asset.
    name: compute_cross_asset_features
    nodes_depended_on:
    - align_and_clean_data
    nodes_dependent_on: []
    output_structure:
    - description: List of dates for the computed features (ISO‑8601 strings, sorted
        ascending).
      key: date
      type: List[str]
    - description: List of cross‑asset pair identifiers used for correlation and spread
        calculation, formatted as "Primary-SecondaryTicker".
      key: asset_pairs
      type: List[str]
    - description: Flattened list of rolling 20‑day Pearson correlation values. Order
        is by date (earliest to latest) then by asset_pairs order.
      key: correlations
      type: List[float]
    - description: Flattened list of daily price spread values (PrimaryClose - SecondaryClose).
        Order matches the correlations list.
      key: price_spreads
      type: List[float]
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Use `pd.read_csv(io.StringIO(cleaned_data_csv), parse_dates=['Date'])`;
          then `df.set_index('Date', inplace=True)`.
        reason: Ensures a structured, time‑aligned dataset that can be directly used
          for rolling calculations and guarantees correct handling of missing dates.
        text: Load the `cleaned_data_csv` string from the parent node `align_and_clean_data`,
          parse it into a pandas DataFrame with `Date` parsed as datetime, and set
          `Date` as the index.
      - complexity: LOW
        impact: MEDIUM
        method: Iterate over `df.columns`; `primary_close_col = [c for c in df.columns
          if c.lower().endswith('_close') and 'primary' in c.lower()][0]`; `secondary_close_cols
          = [c for c in df.columns if c.lower().endswith('_close') and c != primary_close_col]`.
        reason: Clear naming conventions avoid ambiguous column selection and make
          the feature generation robust to future additions of assets.
        text: 'Identify the primary asset columns: locate the column ending with `_Close`
          (or a column named `Primary_Close`). Store its name as `primary_close_col`.
          All other columns that end with `_Close` and are not the primary are treated
          as secondary asset price columns.'
      - complexity: LOW
        impact: HIGH
        method: 'For each close column: `returns_df[col.replace(''_Close'', ''_Ret'')]
          = np.log(df[col]).diff()`; drop the first NaN row after diff.'
        reason: Log returns are additive and preferred for correlation calculations;
          they also match the definition used in downstream model training.
        text: 'Compute daily log returns for the primary asset and each secondary
          asset: `log_return = np.log(price).diff()` and store them in a new DataFrame
          `returns_df` with the same column naming scheme (`<ticker>_ret`).'
      - complexity: MEDIUM
        impact: HIGH
        method: 'Loop over `secondary_close_cols`; for each: `sec_ret = returns_df[sec_col.replace(''_Close'',
          ''_Ret'')]`; `corr_series = returns_df[primary_ret_col].rolling(20).corr(sec_ret)`;
          assign to `corr_df[''corr_'' + ticker]`.'
        reason: Rolling correlation captures the dynamic relationship between assets,
          which is a key predictive signal for the strategy.
        text: For each secondary asset, compute a rolling 20‑day Pearson correlation
          between the primary log return series and the secondary log return series
          using `Series.rolling(window=20).corr()`; store results in a DataFrame `corr_df`
          with column names `corr_<SecondaryTicker>`.
      - complexity: LOW
        impact: MEDIUM
        method: 'For each secondary column: `spread_df[''spread_'' + ticker] = df[primary_close_col]
          - df[sec_col]`.'
        reason: The spread directly measures relative valuation and is a complementary
          feature to correlation.
        text: Compute the daily price spread for each secondary asset as `primary_close
          - secondary_close`; store in a DataFrame `spread_df` with column names `spread_<SecondaryTicker>`.
      - complexity: LOW
        impact: HIGH
