        reason: Annualized return is a standard performance metric for evaluating
          trading strategies.
        text: Calculate the annualized return.
      - complexity: MEDIUM
        impact: HIGH
        method: 'Sharpe Ratio is calculated as: Annualized Return / Annualized Volatility.
          Where Annualized Volatility is the standard deviation of the returns multiplied
          by the square root of 252 (trading days in a year).  Use `daily_returns.std()
          * np.sqrt(252)` to get the annualized volatility.'
        reason: The Sharpe ratio measures risk-adjusted return.
        text: Calculate the Sharpe ratio.
