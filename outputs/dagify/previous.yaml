        text: 'Validate the merged series: confirm that `merged_df` contains no NaNs,
          that the length matches the expected calendar (derived from the longest
          parent series), and that all dates are in ISO‑8601 (`YYYY-MM-DD`) format.'
      - complexity: LOW
        impact: HIGH
        method: Use Python list comprehension or `to_list()` method; ensure float
