          averages, then apply the RSI formula `100 - (100 / (1 + RS))`.'
      - complexity: MEDIUM
        impact: MEDIUM
        method: '```python

          ema_fast = df[''Close''].ewm(span=12, adjust=False).mean()

          ema_slow = df[''Close''].ewm(span=26, adjust=False).mean()

          macd_line = ema_fast - ema_slow

          macd_signal = macd_line.ewm(span=9, adjust=False).mean()

          macd = macd_line - macd_signal

          ``` Store in column `macd`.'
        reason: MACD captures trend‑following momentum; the standard parameter set
          is a de‑facto industry baseline.
        text: 'Compute MACD (Moving Average Convergence Divergence) using standard
          parameters (fast EMA 12, slow EMA 26, signal EMA 9): `macd_line = EMA_fast
          - EMA_slow`; `macd_signal = macd_line.ewm(span=9, adjust=False).mean();
          macd = macd_line - macd_signal`.'
