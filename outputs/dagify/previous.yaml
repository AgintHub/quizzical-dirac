          high_low = df[''High''] - df[''Low'']

          high_prev_close = (df[''High''] - df[''Close''].shift(1)).abs()

          low_prev_close = (df[''Low''] - df[''Close''].shift(1)).abs()

          tr = pd.concat([high_low, high_prev_close, low_prev_close], axis=1).max(axis=1)

          atr = tr.rolling(window=14, min_periods=14).mean()

          ``` Assign to column `atr`.'
        reason: ATR quantifies recent volatility, essential for risk‑adjusted sizing
          and stop‑loss logic.
        text: 'Calculate the Average True Range (ATR) over a 14‑day window: first
          compute True Range (TR) as the max of three values (high‑low, |high‑prev_close|,
          |low‑prev_close|), then apply a rolling mean.'
      - complexity: LOW
