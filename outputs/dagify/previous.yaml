        text: 'Calculate daily returns from the equity curve. '
      - complexity: MEDIUM
        impact: HIGH
        method: 'Calculate the total return over the backtest period.  Then, annualize
          it using the formula: `(1 + total_return)**(252 / number_of_trading_days)
