          and PEP‑8 compliance.
        reason: Providing executable model code enables downstream engineers to quickly
          load and test the model without re‑implementing logic.
        text: 'Generate a runnable Python script **model_code.py** that contains:
          (a) import statements for the selected model''s libraries, (b) a function
          `load_model()` that deserializes the model (placeholder code), (c) a function
          `predict(features)` that returns model predictions, and (d) a `if __name__
          == "__main__"` block demonstrating a mock inference.'
      - complexity: LOW
        impact: MEDIUM
        method: Compose a list of strings `<package>==<latest_version>`; versions
          can be pinned using `import pkg_resources; pkg_resources.get_distribution(pkg).version`.
          Write each entry on a new line to `requirements.txt`.
        reason: A complete requirements file guarantees reproducibility of the environment
          across development, staging, and production.
        text: 'Create **requirements.txt** by aggregating the Python packages required
          for the strategy: core data libraries (pandas, numpy), modelling libraries
          (xgboost, torch, scikit‑learn), back‑testing library (backtrader or zipline),
          and any auxiliary packages (PyYAML, shap).'
      - complexity: MEDIUM
        impact: HIGH
        method: Iterate over `daily_live_metrics` to build a bullet list. For alerts,
          zip `alert_thresholds_metrics` and `alert_thresholds_values` to produce
          a table. Append the free‑form `retraining_schedule` as a numbered list.
          Write the assembled markdown string to `monitoring_plan.md`.
        reason: Stakeholders need a human‑readable specification of operational monitoring;
          markdown is both readable and version‑controllable.
        text: 'Serialize the monitoring configuration into **monitoring_plan.md**
          by transforming the output fields of **create_monitoring_plan** (`daily_live_metrics`,
          `alert_thresholds_metrics`, `alert_thresholds_values`, `retraining_schedule`)
          into a markdown document with sections: *Daily Live Metrics*, *Alert Thresholds*,
          and *Retraining Schedule*.'
      - complexity: MEDIUM
        impact: MEDIUM
        method: 'Create a nested Python dictionary matching the desired hierarchy,
          e.g., `strategy: { assets: [...], holding_period: X }`, `risk: { controls:
          [{name:..., threshold:...}, ...] }`, `model: { id: ..., parameters: {} }`,
          `backtest: { capital: ..., slippage_bps: ..., commission_pct: ..., rebalance:
          ... }`. Use `yaml.safe_dump` with `default_flow_style=False` to output to
          `config.yml`.'
        reason: A YAML configuration centralises all tunable parameters, simplifying
          deployment and future adjustments.
        text: 'Construct **config.yml** containing key runtime parameters: asset universe,
          risk control thresholds, model identifier, and back‑test settings. Pull
          values from the following upstream nodes: **define_strategy_objectives**
          (asset list, holding period), **design_risk_controls** (risk_control_names,
          risk_control_thresholds), **select_best_model** (best_model_identifier),
          and **setup_backtest_environment** (initial_capital, slippage_bps, commission_pct,
          rebalance_frequency).'
      - complexity: LOW
        impact: LOW
        method: Create a Python list literal with the five filenames in the specified
          order.
        reason: The manifest must reflect the ordering defined in the specification
          to avoid downstream parsing errors.
        text: 'Assemble the **manifest_files** list in the exact order required by
          the prompt: `["Strategy_Document.md", "model_code.py", "requirements.txt",
          "config.yml", "monitoring_plan.md"]`.'
      - complexity: LOW
        impact: LOW
        method: Define a list of five strings matching the order of `manifest_files`;
          ensure each description is unique and accurately reflects the file content.
        reason: Providing clear descriptions aids auditors and automated documentation
          tools when unpacking the archive.
        text: Generate the **manifest_descriptions** list, aligning one‑to‑one with
          `manifest_files`. Use concise sentences (≤ 30 words) summarising each file’s
          purpose, e.g., "Comprehensive markdown strategy dossier covering overview,
          data, model, risk, execution, backtest and checklist."
      - complexity: MEDIUM
        impact: HIGH
        method: Use `os.path.isfile` and `os.path.getsize` for existence/size checks;
          raise an exception if any check fails. If all pass, assign `is_ready_for_handoff
          = True`. Record checks in a log file for audit.
        reason: Explicitly marking the package as ready only after validation prevents
          incomplete hand‑offs and provides traceability.
        text: 'Set `package_type` to the literal string **"zip"** and `is_ready_for_handoff`
          to **true** after performing a validation step: (a) confirm all five files
          exist on disk, (b) verify each file size > 0 bytes, (c) optionally compute
          a SHA‑256 checksum for each and log it.'
      - complexity: MEDIUM
        impact: LOW
        method: Instantiate a `BytesIO` buffer, add each file via `ZipFile.writestr(filename,
          file_contents)`, then close the zip. Store the buffer reference if needed
          for downstream consumption (not part of the output schema).
        reason: Providing a ready‑to‑use archive object can speed up later stages
          without violating the current node’s responsibility of only describing the
          manifest.
        text: Optionally create an in‑memory ZIP archive (using `io.BytesIO` and `zipfile.ZipFile`)
          that contains the five files, but **do not** write the archive to disk –
          the manifest fields are sufficient for downstream agents that will perform
          the actual archiving.
    prompt: 'Provide a zip‑style manifest listing: Strategy_Document.md, model_code.py,
      requirements.txt, config.yml, monitoring_plan.md. For each item give a brief
      description.'
  list_data_sources:
    agent: false
    description: Identify all external datasets required for price action, cross‑asset
      correlation, regime detection, and volatility forecasting.
    name: list_data_sources
    nodes_depended_on:
    - define_strategy_objectives
    nodes_dependent_on: []
    output_structure:
    - description: 'Plain list of data source descriptions, each including the dataset
        type, provider name, and update frequency (e.g., "Price History: Bloomberg,
        daily").'
      key: data_sources
      type: str
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: 'Create a Python dictionary where keys are categories (''price_action'',
          ''cross_asset'', ''regime_detection'', ''volatility_forecasting'') and values
          are lists of potential data sources with provider information. EXAMPLE:
          {''price_action'': [{''dataset'': ''Price History'', ''provider'': ''Bloomberg'',
          ''frequency'': ''daily''}]}'
        reason: Provides a structured way to identify the necessary data sources based
          on the strategy's requirements.
        text: Define a dictionary of potential data sources categorized by the analysis
          they support (price action, cross-asset correlation, regime detection, volatility
          forecasting). This will act as a knowledge base for required datasets.
      - complexity: LOW
        impact: HIGH
        method: Retrieve the 'asset_universe' (LIST_STR) and 'primary_tradable_asset'
          (STR) output variables from the 'define_strategy_objectives' node.
        reason: The asset universe dictates which cross-asset data will be considered
          and the primary tradable asset is the focus of price action and volatility
          analysis.
        text: Access the 'define_strategy_objectives' node's output, specifically
          the 'asset_universe' and the 'primary_tradable_asset' fields.
      - complexity: MEDIUM
        impact: HIGH
        method: 'Check the dictionary of potential data sources under ''price_action''.
          Select the ''Price History'' source and tailor it to the ''primary_tradable_asset''.
          Generate string output ''Price History: [Provider], [Frequency]'' (e.g.
          ''Price History: Bloomberg, daily'').'
        reason: Price history is fundamental. The selected asset determines the specific
          data source required.
        text: Based on the 'primary_tradable_asset', identify the primary data source
          for price history.
      - complexity: MEDIUM
        impact: HIGH
        method: 'Iterate through the ''asset_universe'', excluding the ''primary_tradable_asset''.  For
          each secondary asset, check under cross_asset in the data souce dictionary
          for price data options. Generate strings of the format ''Price History for
          [Asset]: [Provider], [Frequency]'' (e.g., ''Price History for SPY: Yahoo
          Finance, daily'').'
        reason: Cross-asset correlation requires price data for each asset under consideration
          within the strategy.
        text: For each asset in 'asset_universe' *other* than the primary asset, identify
          appropriate providers of price data for computing cross-asset correlations.
      - complexity: MEDIUM
        impact: HIGH
        method: 'Check the dictionary of potential data sources under ''regime_detection''.
          Generate strings for each indicator of the format ''[Indicator Name]: [Provider],
          [Frequency]'' (e.g., ''VIX: CBOE, daily'', ''US 10Y-2Y Yield Spread: FRED,
          daily'', ''PMI: ISM, monthly'').'
        reason: Regime detection relies on macro-economic and market indicators. Accessing
          these data sources is essential.
        text: Identify data sources for regime indicators necessary for regime detection.
          Commonly used indicators include VIX, yield curve data, and PMI.
      - complexity: MEDIUM
        impact: HIGH
        method: 'Check the dictionary of potential data sources under ''volatility_forecasting''.
          Generate strings for each source of the format ''[Dataset Name]: [Provider],
          [Frequency]'' (e.g., ''VIX: CBOE, daily'', ''Realized Volatility: Bloomberg,
          daily'').'
        reason: Volatility forecasting requires volatility data.  Having sources defined
          beforehand expedites retrieval.
        text: Identify data sources for volatility forecasting, including implied
          volatility indices and potentially realized volatility data (if available).
      - complexity: LOW
        impact: HIGH
        method: Create a Python list. Append the data source string from price history,
          cross-asset price data, regime indicators, and volatility data while removing
          duplicates. Assign generated list to 'data_sources'.
        reason: A unified list promotes efficient data retrieval in subsequent nodes.
        text: Compile all identified data source strings into a single list, ensuring
          no duplicates. This list will be assigned to the 'data_sources' output variable.
    prompt: Enumerate the data sources (e.g., price history, macro indicators, implied
      volatility, sentiment feeds) with provider names and frequency. Output as a
      plain list.
  run_backtest:
    agent: false
    description: Execute the backtest over the test period and record performance
      timeseries.
    name: run_backtest
    nodes_depended_on:
    - setup_backtest_environment
    nodes_dependent_on: []
    output_structure:
    - description: True if the backtest completed without runtime errors, otherwise
        False.
      key: backtest_success
      type: bool
    - description: 'CSV‑formatted string of the daily equity curve. Columns: Date,
        Equity.'
      key: equity_curve_csv
      type: str
    - description: 'CSV‑formatted string of all executed trades. Columns: Date, Symbol,
        Quantity, Price, PnL.'
      key: trades_log_csv
      type: str
    - description: Brief textual summary of backtest execution (e.g., runtime, any
        warnings).
      key: summary_message
      type: str
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: Create a BacktestingEngine class. Read the `initial_capital` (float),
          `slippage_bps` (float), `commission_pct` (float), `rebalance_frequency`
          (str), `risk_controls_summary` (List of str), and `risk_control_enforcement_method`
          (str) from the `setup_backtest_environment` output. Pass them as arguments
          to the BacktestingEngine's constructor.
        reason: This step initializes the backtesting framework with crucial parameters
          like initial capital, commission, slippage, rebalance frequency, and risk
          controls, enabling realistic simulations.
        text: Instantiate the backtesting engine using settings from `setup_backtest_environment`.
      - complexity: LOW
        impact: HIGH
        method: Access the `cleaned_data_csv` output of the `align_and_clean_data`
          node. Convert the CSV formatted data into a Pandas DataFrame using `pd.read_csv()`.
          The `Date` column should become the index of data frame.
        reason: The cleaned data provides the historical price data and features to
          simulate the trading strategy over time.
        text: Load the cleaned data from `align_and_clean_data` to feed the backtesting
          engine as a DataFrame.
      - complexity: MEDIUM
        impact: HIGH
        method: The `best_model_identifier` from the output of node `select_best_model`
          indicates which model to load and use for backtesting.
        reason: We need the best model found previously in order to simulate it in
          the backtest. So we load the model and use it later.
        text: Load best model saved in previous step `select_best_model`
      - complexity: HIGH
        impact: HIGH
        method: 'For each day: (1) Fetch the current feature vector. (2) Generate
          a trading signal using the loaded model and the current feature vector.
          (3) Enforce risk controls as defined in `setup_backtest_environment`, using
          `risk_controls_summary` and `risk_control_enforcement_method` to guide the
          enforcement. (4) Calculate the order size. (5) Execute the trade, accounting
          for slippage and commission. (6) Update portfolio positions and capital.
          (7) Implement rebalancing according to `rebalance_frequency` from `setup_backtest_environment.`'
        reason: This loop simulates the trading strategy's decision-making process
          on each day, allowing us to observe its performance over time.
        text: 'Implement the core backtesting loop: Iterate through each day in the
          test set of cleaned data obtained from `split_dataset`.'
      - complexity: MEDIUM
        impact: HIGH
        method: Daily store the current ‘equity’ value after the execution of each
          trade. Keep track of the ‘Date’, ‘Symbol’, ‘Quantity’, ‘Price’ and ‘PnL’
          of each trade executed.
        reason: This record keeps track of all trades and daily changes in equity,
          which are key elements for the evaluation of backtest performance.
        text: Record the daily equity and executed trades within the backtesting loop
          so that they can be persisted later
      - complexity: LOW
        impact: LOW
        method: Convert the recorded daily equity data (Date and Equity) into a Pandas
          DataFrame. Then, use the `to_csv()` method to generate a CSV formatted string
          and store in the equity_curve_csv output field.
        reason: The CSV format provides a standard and easily accessible representation
          of the equity curve for further analysis and visualization.
        text: Format the daily equity curve as a CSV string.
      - complexity: LOW
        impact: LOW
        method: Create a Pandas DataFrame using the `Date`, `Symbol`, `Quantity`,
          `Price`, and `PnL` data that was tracked within the backtesting loop. Finally,
          use the DataFrame's `to_csv()` method to create a CSV formatted string.
          This CSV string needs to be placed into the `trades_log_csv` output field.
        reason: The CSV format allows for simple sharing and processing of trade information.
        text: Format the trades log as a CSV string.
      - complexity: LOW
        impact: LOW
        method: Record the runtime of the backtest. Also log any warnings encountered
          during the backtesting process (e.g., risk control violations, data issues).
          Construct a string containing the runtime and any warnings, and assign it
          to the `summary_message` output field.
        reason: This summary provides a quick overview of the backtest, including
          key metrics and any warnings encountered.
        text: Generate textual summary of backtest execution.
      - complexity: LOW
        impact: LOW
        method: By default, set the `backtest_success` to True. If any exception is
          raised during the backtesting loop (e.g., due to data issues or risk control
          violations), catch it and set `backtest_success` to False. Also, store the
          error message to the `summary_message`.
        reason: This boolean flag indicates the overall success of the backtest execution.
        text: Set `backtest_success` to True if the backtest completed without runtime
          errors, otherwise set it to False.
    prompt: Run the backtest using the previously defined environment and generate
      a daily equity curve CSV, plus a log of executed trades (Date, Symbol, Quantity,
      Price, PnL).
  select_best_model:
    agent: false
    description: Pick the model with the highest risk‑adjusted performance according
      to a predefined criterion.
    name: select_best_model
    nodes_depended_on:
    - evaluate_models
    nodes_dependent_on: []
    output_structure:
    - description: Identifier of the selected best model.
      key: best_model_identifier
      type: str
    - description: Sharpe ratio of the selected model.
      key: sharpe_ratio
      type: float
    - description: Maximum drawdown of the selected model.
      key: max_drawdown
      type: float
    - description: Annualized return of the selected model.
      key: annualized_return
      type: float
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Access the `candidate_models`, `sharpe_ratios`, `max_drawdowns`, and
          `annualized_returns` lists from the `evaluate_models` node's output.
        reason: The `evaluate_models` node provides the necessary performance metrics
          (Sharpe Ratio, Max Drawdown, and Annualized Return) for each candidate model
          to determine the best performing one.
        text: Retrieve candidate model performance metrics from the 'evaluate_models'
          node output.
      - complexity: MEDIUM
        impact: HIGH
        method: Define a `max_drawdown_threshold` (e.g., 0.15 for 15%). Iterate through
          the models. If a model's Max Drawdown is *less than or equal to* the `max_drawdown_threshold`,
          store it in a list of valid model candidates. From these valid model candidates,
          choose the model with the highest Sharpe Ratio.
        reason: The prompt specifies selecting the model with the 'best combination
          of Sharpe and low max drawdown'. A sensible approach is to maximize the
          Sharpe Ratio while ensuring the Max Drawdown is below a predefined risk
          tolerance threshold.  This reflects a risk-adjusted return perspective.
        text: Implement a selection criterion based on Sharpe ratio and maximum drawdown,
          prioritizing Sharpe Ratio subject to a Max Drawdown threshold.
      - complexity: MEDIUM
        impact: MEDIUM
        method: If no model satisfies the `max_drawdown_threshold`, select the model
          with the absolute LOWEST max drawdown. If all the models have very high
          drawdowns, choose one that has a 'reasonable' Sharpe Ratio. If even that
          is not avaialble, return null/None for all outputs. Log a warning message
          to indicate this exceptional case.
        reason: It's possible that none of the candidate models meets the Max Drawdown
          threshold, especially if the financial climate was particularly turbulent
          during backtesting.  The strategy should degrade gracefully if no model
          meets the hard constraints.
        text: Handle the case where no model satisfies the risk tolerance threshold
          (max drawdown constraint).
      - complexity: LOW
        impact: HIGH
        method: 'After identifying the best model index, retrieve the corresponding
          values from the `candidate_models`, `sharpe_ratios`, `max_drawdowns`, and
          `annualized_returns` lists. Store the values into output variables named:
          `best_model_identifier`, `sharpe_ratio`, `max_drawdown`, and `annualized_return`'
        reason: The output structure requires the model's identifier and its key metrics.
          This step formats the selected values into the defined output structure.
        text: Extract the 'best_model_identifier', 'sharpe_ratio', 'max_drawdown',
          and 'annualized_return' for selected best model.
      - complexity: LOW
        impact: HIGH
        method: Return the variables created above. The return types must be enforced
          with exception handling or type coercion to meet the requested output structure
          types.
        reason: Deliver required data.
        text: Return the 'best_model_identifier', 'sharpe_ratio', 'max_drawdown',
          and 'annualized_return'.
    prompt: Identify the model with the best combination of Sharpe and low max drawdown
      (e.g., highest Sharpe subject to max drawdown < 15%). Return the model identifier
      and its key metrics.
  setup_backtest_environment:
    agent: false
    description: Configure a backtesting engine with data, model, risk controls, and
      transaction cost assumptions.
    name: setup_backtest_environment
    nodes_depended_on:
    - align_and_clean_data
    - select_best_model
    - design_risk_controls
    nodes_dependent_on: []
    output_structure:
    - description: Starting capital for the backtest (e.g., 1_000_000).
      key: initial_capital
      type: float
    - description: Slippage applied per trade expressed in basis points.
      key: slippage_bps
      type: float
    - description: Commission charged per trade as a percentage of trade value.
      key: commission_pct
      type: float
    - description: How often the portfolio is rebalanced (e.g., "daily", "weekly",
        "monthly").
      key: rebalance_frequency
      type: str
    - description: List of risk‑control rules that will be enforced during the simulation
        (e.g., "max_gross_exposure 20%", "VaR 99% ≤ 2%", "per_asset_weight ≤ 5%",
        "daily_stop_loss 2%", "turnover ≤ 30%/month").
      key: risk_controls_summary
      type: str
    - description: Brief description of how risk controls are applied in the backtest
        engine (e.g., "pre‑trade check that aborts orders violating any rule").
      key: risk_control_enforcement_method
      type: str
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Set the `initial_capital` to 1000000.00. Consider making this configurable
          via a parameter.
        reason: The initial capital is a fundamental parameter that determines the
          trading size and affects performance metrics like Sharpe ratio and drawdown.
        text: Define the initial capital for the backtest. A reasonable starting point
          is 1,000,000.00, but this can be adjusted based on the desired scale and
          risk profile of the strategy.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Set `slippage_bps` to 0.005. Model slippage linearly proportional
          to trade size for increased realism within the backtesting engine.
        reason: Slippage accounts for the difference between the expected and actual
          execution price, especially for large orders or illiquid assets. It provides
          a more realistic backtest environment.
        text: Implement a slippage model. A simple model representing the execution
          cost is to assume a fixed slippage of 0.5 basis points (0.005%).
      - complexity: MEDIUM
        impact: MEDIUM
        method: Set the `commission_pct` to 0.001.  Model this as a percentage of
          the trade value incurred at both entry and exit.
        reason: Commissions are trading costs charged by brokers, which need to be
          accounted for in the backtest. This impacts the overall profitability.
        text: Implement a commission model. A standard commission rate is 0.1% per
          trade (0.001).
      - complexity: LOW
        impact: MEDIUM
        method: Set `rebalance_frequency` to 'daily'. Add input validation to ensure
          allowed values are only 'daily', 'weekly', or 'monthly'.
        reason: Rebalancing ensures that the portfolio maintains its desired asset
          allocation and risk profile. The frequency affects transaction costs and
          tracking error.
        text: Define the rebalancing frequency. Common choices are 'daily', 'weekly',
          or 'monthly'. Choose based on the strategy's typical holding period and
          desired turnover.
      - complexity: MEDIUM
        impact: HIGH
        method: 'Iterate through risk controls from the dependency node `design_risk_controls`.
          Format each control info a string. Example: `max_gross_exposure 20%`. Construct
          the output list `risk_controls_summary`.'
        reason: This step prepares the risk control information for reporting and
          integration into the backtesting engine.
        text: Extract the list of risk control rules from the `design_risk_controls`
          node output. The `risk_control_names`, `risk_control_thresholds`, and `risk_control_formulas`
          are mapped to a human-readable string and stored in `risk_controls_summary`
          list.
      - complexity: MEDIUM
        impact: HIGH
        method: Set `risk_control_enforcement_method` to 'pre-trade check that aborts
          orders violating any rule'. If post-trade, provide method to reduce position
          size if any risk limit is breached post order execution.
        reason: The enforcement method determines how risk controls are applied during
          the simulation. 'Pre-trade check' aborts trades that violate risk limits,
          while 'post-trade check' may trigger corrective actions.
        text: Define the risk control enforcement method. Choose a method such as
          'pre-trade check' or 'post-trade check'.
      - complexity: MEDIUM
        impact: HIGH
        method: Parse data in `cleaned_data_csv` and feed into backtest. Handle potential
          parse errors.
        reason: This ensures the backtest uses a consistent and reliable data source,
          free of missing values and properly aligned for accurate simulation.
        text: Integrate the cleaned data from the `align_and_clean_data` node. The
          cleaned data will be used as the price feed for the backtesting engine.
          CSV format is available in `cleaned_data_csv`.
      - complexity: MEDIUM
        impact: HIGH
        method: Use `best_model_identifier` to load the persisted model and use it
          when generating trading signals in the backtesting engine. This assumes
          a model persistence/loading mechanism is available external to the backtest
          function.
        reason: This step ensures the backtest reflects the expected performance of
          the selected model.
        text: Integrate the selected best model from the `select_best_model` node.
          The `best_model_identifier` specifies the identifier of the model to load
          and use during backtesting.
      - complexity: HIGH
        impact: HIGH
        method: For each risk control extracted in previous step from node `design_risk_controls`,
          implement the corresponding `risk_control_formulas` with the respective
          `risk_control_thresholds`. Implement checks specified in the `risk_control_enforcement_method`.
        reason: Enforcing risk controls accurately during backtesting is critical
          to estimating the strategy's risk-adjusted performance.
        text: Implement the chosen risk controls within the backtesting engine. The
          risk control parameters are from the `design_risk_controls` node.
    prompt: 'Describe the backtest settings: initial capital, slippage model (e.g.,
      0.5 bps), commission (0.1% per trade), rebalance frequency, and how risk controls
      are enforced during simulation.'
  specify_model_architecture:
    agent: false
    description: Choose a concrete predictive model type (e.g., Gradient Boosting
      + LSTM ensemble).
    name: specify_model_architecture
    nodes_depended_on:
    - define_strategy_objectives
    nodes_dependent_on: []
    output_structure:
    - description: A concise description of the chosen model ensemble architecture.
      key: model_ensemble_description
      type: str
    - description: List of individual model components (e.g., Gradient Boosting, LSTM).
      key: model_components
      type: str
    - description: The shape of the input data expected by the model.
      key: input_shape
      type: str
    - description: How the predictions from individual components are combined (e.g.,
        averaging, stacking).
      key: prediction_combination_method
      type: str
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: Choose GBM from the scikit-learn library and LSTM from TensorFlow/Keras.
          Use a sequential model construction in Keras for easy stacking.
        reason: This ensemble combines the strengths of GBM for feature importance
          and non-linear relationships with LSTM's ability to capture temporal dependencies
          in financial time series, fitting the strategy objectives.
        text: 'Define the specific model ensemble: Gradient Boosting Machine (GBM)
          followed by a Long Short-Term Memory (LSTM) network.'
      - complexity: LOW
        impact: HIGH
        method: Inspect the features computed by the previous nodes (price action,
          cross-asset, regime, volatility) to determine the total number of features
          (N). Set T based on a fraction of the `holding_period_days` from `define_strategy_objectives`.
          For instance if holding period is 60 days, then T can be set to 30 days.
        reason: The input shape is critical for both models. LSTM needs a time series
          of data. Features are generated in prior nodes (compute_price_action_features,
          compute_cross_asset_features, compute_regime_features, compute_volatility_features),
          so shape N is informed by the aggregate features.
        text: Determine the input shape for the ensemble. Assume a time series of
          N features over a window of T days. Hence, the input shape will be (T, N).
          The T value will likely be decided based on the asset's holding period as
