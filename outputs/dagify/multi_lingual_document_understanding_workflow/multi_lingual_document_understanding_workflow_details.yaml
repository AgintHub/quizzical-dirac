dag_type: plain_text
description: Workflow to understand multi-lingual, noisy documents while preserving
  document layout, including handwritten elements.
name: multi_lingual_document_understanding_workflow
nodes:
  classify_layout_components:
    agent: false
    description: Classify each segmented layout component into categories while preserving
      document layout.
    name: classify_layout_components
    nodes_depended_on:
    - layout_analysis
    nodes_dependent_on:
    - semantic_grouping
    prompt: Based on the layout analysis results, classify each segmented region (e.g.,
      header, paragraph, table, image, handwritten text) using a trained classification
      model. Include a brief rationale for each classification, maintaining document
      layout information.
  deploy_layout_analysis_model:
    agent: false
    description: Deploy a sophisticated layout prediction model for document segmentation.
    name: deploy_layout_analysis_model
    nodes_depended_on:
    - provision_server_node
    - provision_monitoring_logging
    nodes_dependent_on:
    - layout_analysis
    prompt: Deploy a sophisticated layout prediction model on the provisioned server
      node, optimized for processing document images and outputting detailed segment
      information. Configure monitoring.
  deploy_ocr_service:
    agent: false
    description: Provision and configure a highly available, auto-scaling OCR service.
    name: deploy_ocr_service
    nodes_depended_on:
    - provision_server_node
    - provision_monitoring_logging
    nodes_dependent_on:
    - perform_ocr
    prompt: Provision a highly available OCR service with auto-scaling capabilities
      on the provisioned server node. Configure it to support multi-lingual OCR, including
      handwritten text recognition. Ensure monitoring is configured.
  detect_document_format:
    agent: false
    description: Determine the document's format using a microservice.
    name: detect_document_format
    nodes_depended_on:
    - ingest_document
    - provision_server_node
    nodes_dependent_on:
    - preprocess_document
    prompt: Analyze the ingested document to identify its file format using a deployed
      format detection library on a containerized microservice. Return the format
      type and any relevant metadata.
  detect_languages:
    agent: false
    description: Identify and label the languages present in the extracted text content.
    name: detect_languages
    nodes_depended_on:
    - perform_ocr
    nodes_dependent_on:
    - format_output_json_markdown
    prompt: Analyze the text extracted via OCR to detect all present languages, including
      mixed scripts. Employ an efficient language detection engine to process the
      text streams. Return a list of detected languages along with confidence scores
      for each detected language.
  extract_embedded_elements:
    agent: false
    description: Detect and extract non-textual elements like tables, charts, and
      figures.
    name: extract_embedded_elements
    nodes_depended_on:
    - preprocess_document
    - provision_server_node
    nodes_dependent_on:
    - layout_analysis
    prompt: Identify and extract embedded elements such as tables, charts, and figures
      from the preprocessed document using specialized models. Provide spatial and
      layout details for each element. Output extracted elements and their metadata,
      ensuring layout fidelity and identifying embedded content like charts, plots,
      maps.
  format_output_json_markdown:
    agent: false
    description: Convert grouped content and metadata into standardized JSON and Markdown
      formats, identifying languages and preserving layout.
    name: format_output_json_markdown
    nodes_depended_on:
    - semantic_grouping
    - detect_languages
    - provision_database
    nodes_dependent_on:
    - quality_assurance
    prompt: Merge the semantically grouped content with the language detection output.
      Convert the combined result into a structured JSON and a human-readable Markdown
      format. Log the process to the provisioned database. Ensure output preserves
      document layout hierarchy, element metadata, and identifies all languages present.
  ingest_document:
    agent: false
    description: Ingest the input document, store it in cloud storage, and log its
      metadata.
    name: ingest_document
    nodes_depended_on:
    - provision_storage
    - provision_server_node
    - provision_database
    nodes_dependent_on:
    - detect_document_format
    - preprocess_document
    prompt: Accept an input document from its source. Use a scalable ingestion service
      hosted on the provisioned server node. Store the document in the provisioned
      cloud storage and log its metadata into the provisioned database. Return the
      cloud storage location.
  layout_analysis:
    agent: false
    description: Analyze the document layout to segment regions, utilizing OCR and
      embedded element outputs.
    name: layout_analysis
    nodes_depended_on:
    - perform_ocr
    - extract_embedded_elements
    - deploy_layout_analysis_model
    nodes_dependent_on:
    - classify_layout_components
    prompt: Perform layout analysis to segment the document into logical regions using
      the deployed layout prediction model. Utilize bounding box information from
      OCR and extracted element data. Return positional and hierarchical information
      for each segment, preserving visual hierarchy and semantic grouping.
  perform_ocr:
    agent: false
    description: Extract textual content from the preprocessed document using multi-lingual
      OCR.
    name: perform_ocr
    nodes_depended_on:
    - preprocess_document
    - deploy_ocr_service
    nodes_dependent_on:
    - detect_languages
    - layout_analysis
    prompt: Execute a multi-lingual OCR process on the preprocessed document using
      the provisioned OCR service. Support recognition of handwritten text and non-Latin
      scripts. Output the raw text content and its bounding box information.
  preprocess_document:
    agent: false
    description: Enhance document quality for processing using GPU-accelerated compute.
    name: preprocess_document
    nodes_depended_on:
    - ingest_document
    - detect_document_format
    - provision_server_node
    nodes_dependent_on:
    - perform_ocr
    - extract_embedded_elements
    prompt: Fetch the document from cloud storage. Apply preprocessing techniques
      such as image denoising, contrast enhancement, and skew correction on a GPU-accelerated
      compute instance. Optimize preprocessing for document readability. Output the
      preprocessed document location.
  provision_database:
    agent: false
    description: Provision a managed database service for metadata and processing
      results storage.
    name: provision_database
    nodes_depended_on:
    - provision_vpc
    nodes_dependent_on:
    - ingest_document
    - format_output_json_markdown
    prompt: Provision a managed database service within the VPC. Configure the database
      schema and access controls for storing document metadata and processing outputs.
  provision_monitoring_logging:
    agent: false
    description: Set up comprehensive monitoring and logging infrastructure across
      all services.
    name: provision_monitoring_logging
    nodes_depended_on:
    - provision_vpc
    nodes_dependent_on:
    - deploy_layout_analysis_model
    - deploy_ocr_service
    prompt: Configure cloud-native monitoring and logging services within the VPC.
      Set up dashboards and alerting for key metrics and log aggregation across all
      workflow components.
  provision_network_infrastructure:
    agent: false
    description: Establish core network resources including VPC, subnets, and security
      groups for an isolated and secure environment.
    name: provision_network_infrastructure
    nodes_depended_on: []
    nodes_dependent_on:
    - provision_vpc
    prompt: Provision the foundational Virtual Private Cloud (VPC) network, including
      CIDR blocks and basic routing. This establishes the secure and isolated network
      environment for all subsequent cloud resources.
  provision_server_node:
    agent: false
    description: Provision and configure a scalable server instance to host microservices.
    name: provision_server_node
    nodes_depended_on:
    - provision_vpc
    nodes_dependent_on:
    - deploy_layout_analysis_model
    - deploy_ocr_service
    - detect_document_format
    - preprocess_document
    - ingest_document
    prompt: Provision a scalable server instance within the provisioned VPC. Configure
      the instance with necessary operating systems and dependencies for hosting microservices.
  provision_storage:
    agent: false
    description: Provision a scalable object storage service for ingesting documents
      and storing intermediate artifacts.
    name: provision_storage
    nodes_depended_on:
    - provision_vpc
    nodes_dependent_on:
    - ingest_document
    prompt: Provision a scalable object storage service within the VPC. Configure
      appropriate access policies and lifecycle management for efficient document
      storage and retrieval.
  provision_vpc:
    agent: false
    description: Configure the foundational Virtual Private Cloud (VPC) and its associated
      networking components.
    name: provision_vpc
    nodes_depended_on:
    - provision_network_infrastructure
    nodes_dependent_on:
    - provision_storage
    - provision_monitoring_logging
    - provision_server_node
    - provision_database
    prompt: Configure the core VPC network, including CIDR blocks and basic routing,
      to serve as the foundation for all cloud resources. Ensure subnets and security
      groups are defined for future resource allocation.
  quality_assurance:
    agent: false
    description: Validate the final output for fidelity and accuracy against the original
      document, including multilingual aspects and layout preservation.
    name: quality_assurance
    nodes_depended_on:
    - format_output_json_markdown
    nodes_dependent_on: []
    prompt: Perform a quality check on the produced JSON and Markdown outputs. Use
      automated QA checks with defined metrics and confidence thresholds to validate
      layout fidelity, text extraction accuracy, and language tagging against the
      original document. Report any discrepancies, errors, or quality issues identified,
      ensuring all components including handwritten text and tables are accurately
      represented.
  semantic_grouping:
    agent: false
    description: Group classified components into coherent sections, preserving reading
      order and hierarchy.
    name: semantic_grouping
    nodes_depended_on:
    - classify_layout_components
    nodes_dependent_on:
    - format_output_json_markdown
    prompt: Organize the classified components into semantically coherent groups that
      reflect the document's logical structure and reading order. Output the grouping
      structure, maintaining element hierarchy and preserving layout fidelity.
