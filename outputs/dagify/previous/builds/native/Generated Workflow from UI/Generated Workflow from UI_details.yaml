dag_type: plain_text
description: Generated workflow from UI.
name: Generated Workflow from UI
nodes:
  analyze_cultural_data:
    agent: false
    description: Analyze the collected cultural data
    name: analyze_cultural_data
    nodes_depended_on:
    - collect_cultural_data
    nodes_dependent_on: []
    prompt: Analyze the cultural data to identify patterns or significant features.
  analyze_geographical_data:
    agent: false
    description: Analyze the collected geographical data
    name: analyze_geographical_data
    nodes_depended_on:
    - gather_geographical_data
    nodes_dependent_on: []
    prompt: Analyze the geographical data to identify patterns or significant features.
  collect_cultural_data:
    agent: false
    description: Collect cultural data about the world
    name: collect_cultural_data
    nodes_depended_on:
    - define_world_context
    nodes_dependent_on: []
    prompt: Gather cultural information such as major religions, languages, and cultural
      practices.
  define_world_context:
    agent: false
    description: Define the context and scope of 'world' for this workflow
    name: define_world_context
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Determine what 'world' refers to in this context. Is it geographical,
      cultural, or something else?
  gather_geographical_data:
    agent: false
    description: Collect geographical data about the world
    name: gather_geographical_data
    nodes_depended_on:
    - define_world_context
    nodes_dependent_on: []
    prompt: Gather geographical information such as continents, countries, and major
      landmarks.
  generate_world_report:
    agent: false
    description: Generate a report summarizing the findings about the world
    name: generate_world_report
    nodes_depended_on:
    - integrate_findings
    nodes_dependent_on: []
    prompt: Create a comprehensive report based on the integrated findings.
  integrate_findings:
    agent: false
    description: Integrate geographical and cultural findings
    name: integrate_findings
    nodes_depended_on:
    - analyze_geographical_data
    - analyze_cultural_data
    nodes_dependent_on: []
    prompt: Combine the geographical and cultural analyses to form a comprehensive
      view of the world.
