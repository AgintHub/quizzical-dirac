        method: Encode the rule in a human‑readable string, e.g., "(SMA_20 > SMA_50)
          AND (RSI_14 < 30) AND (Volume > 1.5×MA_Vol)".
        reason: Combining trend and momentum signals typically yields stronger entry
          quality than a single indicator.
        text: Formulate a composite entry rule that combines the top-performing indicators
          using logical operators (e.g., SMA crossover AND RSI threshold) and includes
          a minimum volume filter to ensure liquidity.
      - complexity: MEDIUM
        impact: HIGH
        method: Provide textual description plus numeric formulas; e.g., "TP = entry_price
          + 3*ATR; SL = entry_price - 1*ATR; close if price >= TP or price <= SL or
          holding period >= 5 days."
        reason: Clear exit criteria prevent emotional or ad‑hoc trade closures and
          lock in profitability.
        text: Design exit rules that incorporate both time‑based (e.g., hold for N
          days) and price‑based (e.g., take profit 3×ATR, stop‑loss 1×ATR) conditions
          to capture gains while limiting downside risk.
      - complexity: MEDIUM
        impact: HIGH
        method: 'Explain rule: "size = (risk_per_trade * equity) / (stop_loss_distance
          * entry_price)"; include example calculation in the output.'
        reason: Consistent position sizing maintains risk uniformity across trades.
        text: Specify a position sizing rule using a fixed‑fractional approach where
          a fixed % of capital is risked per trade, calculated from the stop‑loss
          distance and account equity.
      - complexity: MEDIUM
        impact: HIGH
        method: 'Format as: "Max_drawdown = 20% of equity; Stop_loss = 2% per trade;
          Diversify across <=5 assets; Max_daily_loss = 5% of equity."'
        reason: Consolidating risk limits into a single rule facilitates enforcement
          by the execution engine.
        text: Create a risk_management_rule string that details maximum drawdown limit,
          stop‑loss per trade, portfolio diversification (e.g., max 5 assets), and
          any other constraints such as maximum daily loss.
      - complexity: LOW
        impact: LOW
        method: Apply a boolean mask on the parent output lists; return the filtered
          list.
        reason: Trading illiquid or low‑quality data can lead to slippage and execution
          issues.
        text: Filter the assets_traded list from the parent node to include only those
          with data_quality_score >= 0.8 and average daily volume above a set threshold,
          ensuring the strategy trades only liquid and reliable instruments.
      - complexity: LOW
        impact: LOW
        method: 'Use a Python dict: {"strategy_name":..., "entry_rules":..., "exit_rules":...,
          "position_sizing_rule":..., "risk_management_rule":..., "assets_traded":...}
