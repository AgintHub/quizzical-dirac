          vault (e.g., AWS Secrets Manager, HashiCorp Vault) or environment variables,
          and perform a simple format validation (length, alphanumeric).
      - complexity: MEDIUM
        impact: HIGH
        method: Call broker-specific factory method (e.g., `ibapi.wrapper` for Interactive
          Brokers); wrap in try/except to capture authentication failures; log detailed
          error messages.
        reason: Establishing the client object is the first step toward executing
          any API call.
        text: Instantiate the brokerage API client using the retrieved credentials,
          initializing any SDK-specific session or connection parameters.
      - complexity: MEDIUM
        impact: HIGH
        method: Send a `get_account_summary` or `get_market_depth` call; if response
          status is 200 and contains expected fields, set `connectivity_status` to
          true.
        reason: Immediate validation catches network or credential issues early.
        text: Validate the API client by making a lightweight request such as fetching
          the account summary or market data; interpret a successful response as a
          live connection.
      - complexity: LOW
        impact: MEDIUM
        method: Instantiate a `TradingPlatform` class; configure logging level to
          DEBUG for troubleshooting; ensure the class exposes `place_order`, `cancel_order`,
          and `get_order_status` methods.
        reason: A robust wrapper abstracts brokerage-specific quirks and provides
          a stable interface for `execute_trades`.
        text: Set up the local trading platform wrapper (e.g., a lightweight order
          routing module) by importing necessary dependencies, configuring logging,
          and initializing any in-memory data structures needed for order tracking.
      - complexity: LOW
        impact: LOW
        method: Assign boolean variables directly; wrap final assignment in a dictionary
          matching the output structure.
        reason: Consolidates all status flags into the node's defined output schema.
        text: 'Populate the output fields: set `brokerage_api_name` to the selected
          API''s name; set `api_key_status` and `api_secret_status` based on validation
          results; set `platform_configured` to true only if the wrapper instantiation
          succeeded; set `connectivity_status` to the result of the lightweight request.'
    prompt: Configure the trading infrastructure, including selecting a brokerage
      API, setting up a trading platform, and ensuring connectivity.
    shims: []
  define_trading_strategy:
    agent: false
    code_node_type: stub
    description: Develop a trading strategy based on analysis of historical data.
    implementation: "from pydantic import BaseModel, Field\n\n\nclass CollectHistoricalMarketDataOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for collect_historical_market_data node outputs.\"\
      \"\"\n    assets: str = Field(..., description=\"List of asset tickers collected\"\
