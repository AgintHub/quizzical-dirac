    code_node_type: stub
    description: Refine the trading strategy based on analysis of trading results.
    implementation: "from pydantic import BaseModel, Field\n\n\nclass AnalyzeTradingResultsOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for analyze_trading_results node outputs.\"\"\"\n\
