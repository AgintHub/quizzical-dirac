          ensuring indicator values are aligned with price timestamps.
      - complexity: MEDIUM
        impact: HIGH
        method: Calculate Pearson/Spearman correlations for each indicator vs. next-period
          returns; perform a simple cross‑validation split to confirm predictive stability.
        reason: Reduces the risk of overfitting by selecting only the signals that
          historically move the market.
        text: Perform a correlation and predictive power analysis between each indicator
          and future price returns over a sliding window to identify the most statistically
          significant signals.
      - complexity: MEDIUM
