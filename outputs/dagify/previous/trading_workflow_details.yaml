  monitor_trading_performance:
    agent: false
    code_node_type: pure
    description: Continuously monitors executed trades to calculate performance statistics,
      detect deviations from expected behavior, recommend strategy adjustments, and
      trigger alerts when performance deteriorates.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass ExecuteTradesOutput(BaseModel):\n    \"\"\"Pydantic model for execute_trades\
      \ node outputs.\"\"\"\n    trade_execution_ids: List[str] = Field(..., description=\"\
      Unique identifiers for each trade that was executed\")\n    trade_execution_status:\
      \ List[bool] = Field(..., description=\"True if the trade was executed successfully,\
      \ False otherwise\")\n    trade_execution_timestamps: List[str] = Field(...,\
      \ description=\"ISO\\u20118601 timestamps indicating when each trade was executed\"\
      )\n    trade_execution_prices: List[float] = Field(..., description=\"Price\
      \ at which each trade was executed\")\n    trade_execution_quantities: List[float]\
      \ = Field(..., description=\"Quantity (in units or shares) executed for each\
      \ trade\")\n    trade_execution_instruments: List[str] = Field(..., description=\"\
      Symbol or instrument identifier for each trade\")\n    trade_execution_sides:\
      \ List[str] = Field(..., description=\"Side of the trade: 'buy' or 'sell' for\
      \ each execution\")\n    overall_execution_success: bool = Field(..., description=\"\
      True if all trades in this batch were executed without error\")\n    execution_error_messages:\
      \ List[str] = Field(..., description=\"Error messages for any trades that failed\
      \ to execute\")\n\n\nclass MonitorTradingPerformanceOutput(BaseModel):\n   \
      \ \"\"\"Pydantic model for monitor_trading_performance node outputs.\"\"\"\n\
      \    timestamp: str = Field(..., description=\"Current timestamp of the monitoring\
      \ snapshot\")\n    total_trades: int = Field(..., description=\"Total number\
      \ of trades executed in the monitoring period\")\n    winning_trades: int =\
      \ Field(..., description=\"Number of trades that closed with a profit\")\n \
      \   losing_trades: int = Field(..., description=\"Number of trades that closed\
      \ with a loss\")\n    win_rate: float = Field(..., description=\"Percentage\
      \ of winning trades out of total trades (0 to 1)\")\n    average_return_per_trade:\
      \ float = Field(..., description=\"Average profit or loss per trade expressed\
      \ as a return fraction\")\n    max_drawdown: float = Field(..., description=\"\
      Maximum drawdown observed in the monitoring period\")\n    sharpe_ratio: float\
      \ = Field(..., description=\"Sharpe ratio calculated over the monitoring period\"\
      )\n    is_performance_stable: bool = Field(..., description=\"Flag indicating\
      \ whether performance metrics are within acceptable ranges\")\n    recommended_adjustments:\
      \ str = Field(..., description=\"List of suggested changes to strategy or risk\
      \ management rules\")\n    alert_flag: bool = Field(..., description=\"Flag\
      \ indicating if an alert should be triggered due to significant performance\
      \ deviation\")\n\n\ndef monitor_trading_performance(execute_trades_input: ExecuteTradesOutput,\
      \ **kwargs) -> MonitorTradingPerformanceOutput:\n    \"\"\"Continuously monitors\
      \ executed trades to calculate performance statistics, detect deviations from\
      \ expected behavior, recommend strategy adjustments, and trigger alerts when\
      \ performance deteriorates.\n\n    Args:\n        execute_trades_input: Input\
      \ from the 'execute_trades' node.\n        **kwargs: Additional keyword arguments.\n\
      \n    Returns:\n        MonitorTradingPerformanceOutput: Object containing outputs\
      \ for this node.\n    \"\"\"\n    # Initialize monitoring state with in-memory\
      \ data structures\n    monitoring_state = initialize_monitoring_state()\n  \
      \  position_map = monitoring_state[\"position_map\"]\n    closed_trades = monitoring_state[\"\
      closed_trades\"]\n    equity_curve = monitoring_state[\"equity_curve\"]\n  \
      \  \n    # Load configuration thresholds\n    thresholds = load_performance_thresholds()\n\
      \    \n    # Filter successful trades only\n    successful_trades = filter_successful_trades(\n\
      \        trade_status=execute_trades_input.trade_execution_status,\n       \
      \ trade_ids=execute_trades_input.trade_execution_ids,\n        trade_prices=execute_trades_input.trade_execution_prices,\n\
      \        trade_quantities=execute_trades_input.trade_execution_quantities,\n\
      \        trade_instruments=execute_trades_input.trade_execution_instruments,\n\
      \        trade_sides=execute_trades_input.trade_execution_sides,\n        trade_timestamps=execute_trades_input.trade_execution_timestamps\n\
      \    )\n    \n    # Process each successful trade\n    for trade in successful_trades:\n\
      \        # Update position map and detect closures\n        position_update_result\
      \ = update_position_map(\n            position_map=position_map,\n         \
      \   instrument=trade[\"instrument\"],\n            side=trade[\"side\"],\n \
      \           price=trade[\"price\"],\n            quantity=trade[\"quantity\"\
      ],\n            timestamp=trade[\"timestamp\"]\n        )\n        \n      \
      \  # If position was closed, calculate P&L and update records\n        if position_update_result[\"\
      position_closed\"]:\n            closed_trade_record = calculate_trade_pnl(\n\
      \                entry_price=position_update_result[\"entry_price\"],\n    \
      \            exit_price=trade[\"price\"],\n                quantity=position_update_result[\"\
      closed_quantity\"],\n                side=position_update_result[\"original_side\"\
      ],\n                instrument=trade[\"instrument\"],\n                timestamp=trade[\"\
      timestamp\"]\n            )\n            \n            # Append to closed trades\
      \ list\n            closed_trades.append(closed_trade_record)\n            \n\
      \            # Update equity curve\n            update_equity_curve(\n     \
      \           equity_curve=equity_curve,\n                return_fraction=closed_trade_record[\"\
      return_fraction\"]\n            )\n    \n    # Calculate performance metrics\n\
      \    performance_metrics = calculate_performance_metrics(\n        closed_trades=closed_trades,\n\
      \        equity_curve=equity_curve\n    )\n    \n    # Evaluate performance\
      \ stability\n    stability_result = evaluate_performance_stability(\n      \
      \  metrics=performance_metrics,\n        thresholds=thresholds\n    )\n    \n\
      \    # Generate recommended adjustments\n    recommended_adjustments = generate_recommended_adjustments(\n\
      \        metrics=performance_metrics,\n        thresholds=thresholds,\n    \
      \    stability_result=stability_result\n    )\n    \n    # Check alert conditions\n\
      \    alert_flag = check_alert_conditions(\n        metrics=performance_metrics,\n\
      \        alert_thresholds=thresholds[\"alert_thresholds\"]\n    )\n    \n  \
      \  # Generate current timestamp\n    current_timestamp = get_current_iso_timestamp()\n\
      \    \n    return MonitorTradingPerformanceOutput(\n        timestamp=current_timestamp,\n\
      \        total_trades=performance_metrics[\"total_trades\"],\n        winning_trades=performance_metrics[\"\
      winning_trades\"],\n        losing_trades=performance_metrics[\"losing_trades\"\
      ],\n        win_rate=performance_metrics[\"win_rate\"],\n        average_return_per_trade=performance_metrics[\"\
      average_return_per_trade\"],\n        max_drawdown=performance_metrics[\"max_drawdown\"\
      ],\n        sharpe_ratio=performance_metrics[\"sharpe_ratio\"],\n        is_performance_stable=stability_result[\"\
      is_stable\"],\n        recommended_adjustments=recommended_adjustments,\n  \
      \      alert_flag=alert_flag\n    )"
    name: monitor_trading_performance
    nodes_depended_on:
    - execute_trades
    nodes_dependent_on: []
