dag_type: stub
description: Generated workflow from UI.
name: trading_workflow
nodes:
  analyze_trading_results:
    agent: false
    code_node_type: stub
    description: Analyze the results of trading activities to identify areas for improvement.
    implementation: "from pydantic import BaseModel, Field\n\n\nclass MonitorTradingPerformanceOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for monitor_trading_performance node outputs.\"\"\"\
      \n    timestamp: str = Field(..., description=\"Current timestamp of the monitoring\
      \ snapshot\")\n    total_trades: int = Field(..., description=\"Total number\
      \ of trades executed in the monitoring period\")\n    winning_trades: int =\
      \ Field(..., description=\"Number of trades that closed with a profit\")\n \
      \   losing_trades: int = Field(..., description=\"Number of trades that closed\
      \ with a loss\")\n    win_rate: float = Field(..., description=\"Percentage\
      \ of winning trades out of total trades (0 to 1)\")\n    average_return_per_trade:\
      \ float = Field(..., description=\"Average profit or loss per trade expressed\
      \ as a return fraction\")\n    max_drawdown: float = Field(..., description=\"\
      Maximum drawdown observed in the monitoring period\")\n    sharpe_ratio: float\
      \ = Field(..., description=\"Sharpe ratio calculated over the monitoring period\"\
      )\n    is_performance_stable: bool = Field(..., description=\"Flag indicating\
      \ whether performance metrics are within acceptable ranges\")\n    recommended_adjustments:\
      \ str = Field(..., description=\"List of suggested changes to strategy or risk\
      \ management rules\")\n    alert_flag: bool = Field(..., description=\"Flag\
      \ indicating if an alert should be triggered due to significant performance\
      \ deviation\")\n\n\nclass AnalyzeTradingResultsOutput(BaseModel):\n    \"\"\"\
      Pydantic model for analyze_trading_results node outputs.\"\"\"\n    total_trades:\
      \ int = Field(..., description=\"Total number of trades executed during the\
      \ monitored period.\")\n    win_rate: float = Field(..., description=\"Ratio\
      \ of winning trades to total trades, expressed as a decimal between 0 and 1.\"\
      )\n    average_return_per_trade: float = Field(..., description=\"Mean return\
      \ (profit or loss) per trade expressed as a decimal (e.g., 0.02 for 2%).\")\n\
      \    max_drawdown: float = Field(..., description=\"Maximum percentage drop\
      \ from a peak to a trough in equity during the period.\")\n    sharpe_ratio:\
      \ float = Field(..., description=\"Sharpe ratio of the strategy over the monitored\
      \ period.\")\n    improvement_suggestions: str = Field(..., description=\"List\
      \ of concise suggestions for strategy or risk management enhancements.\")\n\
      \    action_items: str = Field(..., description=\"Concrete action items derived\
      \ from the suggestions, ready for implementation.\")\n    is_significant_change:\
      \ bool = Field(..., description=\"Flag indicating whether the results show a\
      \ statistically significant deviation from expected performance.\")\n\n\ndef\
      \ analyze_trading_results(monitor_trading_performance_input: MonitorTradingPerformanceOutput,\
      \ **kwargs) -> AnalyzeTradingResultsOutput:\n    \"\"\"Analyze the results of\
      \ trading activities to identify areas for improvement.\n\n    Args:\n     \
      \   monitor_trading_performance_input: Input from the 'monitor_trading_performance'\
      \ node.\n        **kwargs: Additional keyword arguments.\n\n    Returns:\n \
      \       AnalyzeTradingResultsOutput: Object containing outputs for this node.\n\
      \    \"\"\"\n    # TODO: Implement this function\n\n    # Return stub output\
      \ with placeholder values\n    return AnalyzeTradingResultsOutput(\n       \
      \ total_trades=0,\n        win_rate=0.0,\n        average_return_per_trade=0.0,\n\
      \        max_drawdown=0.0,\n        sharpe_ratio=0.0,\n        improvement_suggestions=\"\
      \",\n        action_items=\"\",\n        is_significant_change=False,\n    )"
    name: analyze_trading_results
    nodes_depended_on:
    - monitor_trading_performance
    nodes_dependent_on: []
    output_structure:
    - description: Total number of trades executed during the monitored period.
      key: total_trades
      type: int
    - description: Ratio of winning trades to total trades, expressed as a decimal
        between 0 and 1.
      key: win_rate
      type: float
    - description: Mean return (profit or loss) per trade expressed as a decimal (e.g.,
        0.02 for 2%).
      key: average_return_per_trade
      type: float
    - description: Maximum percentage drop from a peak to a trough in equity during
        the period.
      key: max_drawdown
      type: float
    - description: Sharpe ratio of the strategy over the monitored period.
      key: sharpe_ratio
      type: float
    - description: List of concise suggestions for strategy or risk management enhancements.
      key: improvement_suggestions
      type: str
    - description: Concrete action items derived from the suggestions, ready for implementation.
      key: action_items
      type: str
    - description: Flag indicating whether the results show a statistically significant
        deviation from expected performance.
      key: is_significant_change
      type: bool
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Use a JSON parsing library (e.g., Python's json module) and validate
          against the schema; handle missing keys with default values.
        reason: Ensures type safety and consistency with downstream processing.
        text: Retrieve the monitoring snapshot data from the parent node "monitor_trading_performance"
          and deserialize it into a structured dictionary using the predefined JSON
          schema.
      - complexity: LOW
        impact: HIGH
        method: Apply integer addition; include a sanity check that the resulting
          count matches the length of any trade ID list if available.
        reason: Accurate trade count is essential for all subsequent metrics.
        text: Compute "total_trades" by summing the provided "total_trades" from the
          parent snapshot; if missing, calculate as winning_trades + losing_trades.
      - complexity: LOW
        impact: HIGH
        method: Use float division; encapsulate in a try/except block for ZeroDivisionError.
        reason: Provides a normalized performance indicator.
        text: Derive "win_rate" by dividing the number of winning trades by the total
          trades, ensuring a division‑by‑zero guard that returns 0.0 when total_trades
          is zero.
      - complexity: MEDIUM
        impact: MEDIUM
        method: If cumulative return is provided, divide by total_trades; otherwise,
          parse individual trade returns from the parent data if available.
        reason: Standardized metric for trade profitability.
        text: Calculate "average_return_per_trade" by taking the parent snapshot’s
          "average_return_per_trade"; if not available, compute using the cumulative
          profit/loss over all trades divided by total_trades.
      - complexity: MEDIUM
        impact: HIGH
        method: Implement a one‑pass algorithm that tracks running maximum equity
          and calculates drawdowns; handle missing equity data gracefully.
        reason: Max drawdown is a critical risk metric.
        text: Determine "max_drawdown" by retrieving the parent snapshot’s "max_drawdown"
          value; if absent, compute it by scanning the equity curve provided in the
          snapshot (e.g., using peak‑to‑trough algorithm).
      - complexity: MEDIUM
        impact: HIGH
        method: Use NumPy or Pandas to calculate mean and std; apply the Sharpe formula;
          round to four decimals.
        reason: Sharpe ratio contextualizes return relative to volatility.
        text: Compute "sharpe_ratio" by retrieving the parent snapshot’s "sharpe_ratio";
          if absent, compute it using the formula (mean return - risk‑free rate) /
          std deviation of returns, assuming a risk‑free rate of 0.01 (1%).
      - complexity: MEDIUM
        impact: MEDIUM
        method: Define a dictionary of thresholds; iterate over metrics; append strings
          like "Improve stop‑loss granularity" or "Increase position sizing discipline"
          based on the shortfall.
        reason: Provides actionable insights without requiring deep statistical modeling.
        text: 'Generate "improvement_suggestions" by performing a rule‑based analysis:
          compare computed metrics against target thresholds (e.g., win_rate > 0.55,
          max_drawdown < 0.15, Sharpe > 1.0). For any metric that falls below its
          target, add a concise suggestion.'
      - complexity: LOW
        impact: MEDIUM
        method: Use a mapping table or simple templating; if a suggestion is already
          actionable, reuse it verbatim.
        reason: Transforms high‑level ideas into implementable actions.
        text: Translate each suggestion in "improvement_suggestions" into a concrete
          "action_item" by mapping common suggestions to specific tasks (e.g., "Adjust
          stop‑loss to 1.5% of entry price").
      - complexity: MEDIUM
        impact: MEDIUM
        method: Fetch historical win_rate distribution from a persisted dataset; compute
          mean and std; apply z‑score threshold (e.g., |z| > 2).
        reason: Provides a quantitative check for anomalous performance.
        text: 'Assess "is_significant_change" by conducting a simple statistical test:
          if the difference between observed win_rate and expected win_rate (e.g.,
          0.6) is greater than 2 standard deviations of win_rate across historical
          periods, flag as true.'
      - complexity: LOW
        impact: HIGH
        method: Implement a schema validator (e.g., jsonschema) that checks data types
          and required fields.
        reason: Guarantees compatibility with downstream nodes.
        text: Validate the final output dictionary against the defined schema, ensuring
          all fields are present and correctly typed before serializing to JSON.
    prompt: Analyze trading results to understand the effectiveness of the strategy
      and risk management, identifying areas for improvement or optimization.
    shims: []
  backtest_trading_strategy:
    agent: false
    code_node_type: stub
    description: Test the trading strategy on historical data to evaluate performance.
    implementation: "from pydantic import BaseModel, Field\n\n\nclass DefineTradingStrategyOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for define_trading_strategy node outputs.\"\"\"\n\
      \    strategy_name: str = Field(..., description=\"Descriptive name of the trading\
      \ strategy\")\n    entry_rules: str = Field(..., description=\"Textual description\
      \ of the conditions that trigger a long or short position\")\n    exit_rules:\
      \ str = Field(..., description=\"Textual description of the conditions that\
      \ trigger the closure of a position\")\n    position_sizing_rule: str = Field(...,\
      \ description=\"Rule or formula that determines how much capital or how many\
      \ shares/contracts to trade\")\n    risk_management_rule: str = Field(..., description=\"\
      Description of stop\\u2011loss levels, max draw\\u2011down limits, and portfolio\
      \ diversification constraints\")\n    assets_traded: str = Field(..., description=\"\
      List of asset symbols or identifiers that the strategy is designed to trade\"\
      )\n\n\nclass BacktestTradingStrategyOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for backtest_trading_strategy node outputs.\"\"\"\n    total_return: float\
      \ = Field(..., description=\"Total cumulative return of the strategy over the\
      \ backtesting period.\")\n    annualized_return: float = Field(..., description=\"\
      Annualized return of the strategy.\")\n    max_drawdown: float = Field(...,\
      \ description=\"Maximum drawdown observed during backtesting.\")\n    sharpe_ratio:\
      \ float = Field(..., description=\"Sharpe ratio of the strategy.\")\n    number_of_trades:\
      \ int = Field(..., description=\"Total number of trades executed during backtesting.\"\
      )\n    win_rate: float = Field(..., description=\"Fraction of profitable trades\
      \ (value between 0 and 1).\")\n    avg_profit_per_trade: float = Field(...,\
      \ description=\"Average profit per winning trade.\")\n    avg_loss_per_trade:\
      \ float = Field(..., description=\"Average loss per losing trade.\")\n    win_loss_ratio:\
      \ float = Field(..., description=\"Ratio of average profit to average loss.\"\
      )\n    performance_summary: str = Field(..., description=\"Concise textual summary\
      \ of backtest results.\")\n\n\ndef backtest_trading_strategy(define_trading_strategy_input:\
      \ DefineTradingStrategyOutput, **kwargs) -> BacktestTradingStrategyOutput:\n\
      \    \"\"\"Test the trading strategy on historical data to evaluate performance.\n\
      \n    Args:\n        define_trading_strategy_input: Input from the 'define_trading_strategy'\
      \ node.\n        **kwargs: Additional keyword arguments.\n\n    Returns:\n \
      \       BacktestTradingStrategyOutput: Object containing outputs for this node.\n\
      \    \"\"\"\n    # TODO: Implement this function\n\n    # Return stub output\
      \ with placeholder values\n    return BacktestTradingStrategyOutput(\n     \
      \   total_return=0.0,\n        annualized_return=0.0,\n        max_drawdown=0.0,\n\
      \        sharpe_ratio=0.0,\n        number_of_trades=0,\n        win_rate=0.0,\n\
      \        avg_profit_per_trade=0.0,\n        avg_loss_per_trade=0.0,\n      \
      \  win_loss_ratio=0.0,\n        performance_summary=\"\",\n    )"
    name: backtest_trading_strategy
    nodes_depended_on:
    - define_trading_strategy
    nodes_dependent_on: []
    output_structure:
    - description: Total cumulative return of the strategy over the backtesting period.
      key: total_return
      type: float
    - description: Annualized return of the strategy.
      key: annualized_return
      type: float
    - description: Maximum drawdown observed during backtesting.
      key: max_drawdown
      type: float
    - description: Sharpe ratio of the strategy.
      key: sharpe_ratio
      type: float
    - description: Total number of trades executed during backtesting.
      key: number_of_trades
      type: int
    - description: Fraction of profitable trades (value between 0 and 1).
      key: win_rate
      type: float
    - description: Average profit per winning trade.
      key: avg_profit_per_trade
      type: float
    - description: Average loss per losing trade.
      key: avg_loss_per_trade
      type: float
    - description: Ratio of average profit to average loss.
      key: win_loss_ratio
      type: float
    - description: Concise textual summary of backtest results.
      key: performance_summary
      type: str
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Validate presence of each field; use JSON schema validation to assert
          data types before proceeding.
        reason: The backtest logic relies on the precise trading rules and asset universe
          specified by the strategy; missing data would cause incorrect simulation.
        text: Extract strategy definition from the parent node's output, ensuring
          all fields (strategy_name, entry_rules, exit_rules, position_sizing_rule,
          risk_management_rule, assets_traded) are available for use.
      - complexity: MEDIUM
        impact: HIGH
        method: Use a data access layer to query the database by ticker and timeframe;
          apply resampling or interpolation if needed; verify is_clean flag and data_quality_score
          > 0.8.
        reason: Accurate backtesting demands high‑quality, time‑aligned price series;
          the strategy may depend on specific timeframes.
        text: Retrieve clean historical price data for each asset in assets_traded
          from the data repository or by invoking collect_historical_market_data,
          filtering by the timeframes required by the strategy.
      - complexity: HIGH
        impact: HIGH
        method: 'Implement an event‑driven simulator: for each bar, evaluate boolean
          expressions in entry_rules/exits using the bar''s OHLCV data; compute position
          size using a risk‑based formula; apply stop‑loss and take‑profit logic from
          risk_management_rule; maintain a list of open positions and update PnL on
          each step.'
        reason: This step creates the chronological sequence of trades that will be
          used to compute performance metrics.
        text: Simulate trade execution for the entire historical period by iterating
          over each time step, applying entry_rules to generate buy or sell signals,
          and exit_rules to close positions, while respecting position_sizing_rule
          and risk_management_rule.
      - complexity: MEDIUM
        impact: HIGH
        method: For each closed trade, compute PnL = (exit_price - entry_price) *
          quantity; classify as win/loss; use numpy or pandas to aggregate statistics;
          ensure rounding to 6 decimal places for consistency.
        reason: These core metrics directly reflect the strategy’s profitability and
          trade quality.
        text: Calculate cumulative returns per trade, aggregate them to compute total_return,
          number_of_trades, win_rate, avg_profit_per_trade, avg_loss_per_trade, and
          win_loss_ratio.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Use cumulative returns to build equity_curve; apply pandas .cummax()
          to track peaks; compute drawdown = (equity_curve - peaks)/peaks; take the
          minimum value.
        reason: Drawdown is a key risk metric that captures the worst equity loss
          experienced during the period.
        text: Determine max_drawdown by constructing the equity curve over time, computing
          rolling peaks, and measuring the largest drop from a peak to a trough.
      - complexity: LOW
        impact: MEDIUM
        method: Annualized = (1 + total_return) ** (252 / total_trading_days) - 1,
          assuming 252 trading days per year.
        reason: Annualized return allows comparison across strategies with different
          time horizons.
        text: Compute the annualized_return by annualizing the cumulative return based
          on the number of trading days in the backtesting period and the typical
          market calendar.
      - complexity: LOW
        impact: MEDIUM
        method: Set risk_free_rate = 0.0 (or fetch from treasury data); compute daily_excess
          = daily_return - risk_free_rate; sharpe_daily = mean(daily_excess)/std(daily_excess);
          annualized_sharpe = sharpe_daily * sqrt(252).
        reason: Sharpe ratio is a standard risk‑adjusted performance metric.
        text: Calculate Sharpe ratio using the daily excess returns (return minus
          risk‑free rate) divided by the standard deviation of daily returns, then
          annualize the result.
      - complexity: LOW
        impact: LOW
        method: 'Template: "{strategy_name} achieved a total return of {total_return*100:.2f}%,
          an annualized return of {annualized_return*100:.2f}%, max drawdown {max_drawdown*100:.2f}%,
          Sharpe ratio {sharpe_ratio:.2f}. {number_of_trades} trades were executed
          with a win rate of {win_rate:.2%}."'
        reason: The summary provides a quick snapshot for stakeholders and is required
          by the output structure.
        text: Generate a concise performance_summary string summarizing the key metrics,
          formatted for human readability and future reporting.
    prompt: Backtest the defined strategy on historical data, calculating performance
      metrics such as return, drawdown, and Sharpe ratio.
    shims: []
