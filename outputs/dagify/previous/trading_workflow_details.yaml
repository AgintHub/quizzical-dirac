      \    raw_data: dict = fetch_raw_market_data(\n        assets=parsed_params[\"\
      assets\"],\n        timeframes=parsed_params[\"timeframes\"],\n        source=data_source\n\
      \    )\n    \n    # Clean and validate the collected data\n    cleaned_data:\
      \ dict = clean_and_validate_market_data(raw_data=raw_data)\n    \n    # Calculate\
