      \ a list\n    final_cultural_patterns: List[str] = compile_cultural_patterns(significant_patterns=filtered_patterns)\n\
      \    \n    return AnalyzeCulturalDataOutput(\n        cultural_patterns=final_cultural_patterns\n\
      \    )"
