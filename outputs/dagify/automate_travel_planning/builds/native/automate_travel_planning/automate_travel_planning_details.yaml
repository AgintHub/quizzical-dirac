      \ destination country\")\n    health_certificates_required: List[bool] = Field(...,\
      \ description=\"List of whether health certificates are required for each destination\
      \ country\")\n\n\nclass CreateItineraryOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for create_itinerary node outputs.\"\"\"\n    itinerary_id: str = Field(...,\
      \ description=\"Unique identifier for the itinerary\")\n    flight_details:\
