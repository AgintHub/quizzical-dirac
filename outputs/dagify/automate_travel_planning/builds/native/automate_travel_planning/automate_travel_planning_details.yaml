      \ CreateItineraryOutput, **kwargs) -> BookHotelsOutput:\n    \"\"\"Book hotels\
      \ for the trip\n\n    Args:\n        create_itinerary_input: Input from the\
      \ 'create_itinerary' node.\n        **kwargs: Additional keyword arguments.\n\
      \n    Returns:\n        BookHotelsOutput: Object containing outputs for this\
      \ node.\n    \"\"\"\n    # Retrieve the list of selected hotels from the create_itinerary\
      \ node\n    selected_hotels: List[dict] = extract_selected_hotels(hotel_reservations=create_itinerary_input.hotel_reservations)\n\
      \    \n    # Initialize output lists\n    hotel_names: List[str] = []\n    room_types:\
      \ List[str] = []\n    check_in_dates: List[str] = []\n    check_out_dates: List[str]\
      \ = []\n    total_cost: float = 0.0\n    all_bookings_successful: bool = True\n\
      \    \n    # Loop through each selected hotel and book it\n    for hotel in\
      \ selected_hotels:\n        # Retrieve hotel details, including room types and\
