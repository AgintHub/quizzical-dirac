    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass CreateItineraryOutput(BaseModel):\n    \"\"\"Pydantic model for create_itinerary\
      \ node outputs.\"\"\"\n    itinerary_id: str = Field(..., description=\"Unique\
      \ identifier for the itinerary\")\n    flight_details: str = Field(..., description=\"\
      List of flight information, including departure and arrival times, airlines,\
      \ and flight numbers\")\n    hotel_reservations: str = Field(..., description=\"\
      List of hotel reservation information, including hotel names, locations, and\
