    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass CheckImmigrationRequirementsOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for check_immigration_requirements node outputs.\"\"\"\n    destination_countries:\
      \ List[str] = Field(..., description=\"List of destination countries\")\n  \
