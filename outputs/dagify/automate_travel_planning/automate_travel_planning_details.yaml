  finalize_travel_arrangements:
    agent: false
    code_node_type: shim
    description: Finalize all travel arrangements for the trip
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass BookFlightsOutput(BaseModel):\n    \"\"\"Pydantic model for book_flights\
      \ node outputs.\"\"\"\n    flight_booking_status: bool = Field(..., description=\"\
      Whether the flight booking was successful\")\n    flight_itinerary: str = Field(...,\
      \ description=\"Detailed itinerary of the booked flights\")\n    flight_numbers:\
      \ List[str] = Field(..., description=\"List of flight numbers for the booked\
      \ flights\")\n    departure_times: List[str] = Field(..., description=\"List\
      \ of departure times for the booked flights\")\n    arrival_times: List[str]\
      \ = Field(..., description=\"List of arrival times for the booked flights\"\
      )\n    airlines: List[str] = Field(..., description=\"List of airlines for the\
      \ booked flights\")\n    travel_insurance: bool = Field(..., description=\"\
      Whether travel insurance was purchased\")\n    seat_upgrades: bool = Field(...,\
      \ description=\"Whether seat upgrades were purchased\")\n\n\nclass BookHotelsOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for book_hotels node outputs.\"\"\"\n    hotel_names:\
      \ List[str] = Field(..., description=\"List of booked hotel names\")\n    room_types:\
      \ List[str] = Field(..., description=\"List of room types booked\")\n    check_in_dates:\
      \ List[str] = Field(..., description=\"List of check-in dates for each hotel\"\
      )\n    check_out_dates: List[str] = Field(..., description=\"List of check-out\
      \ dates for each hotel\")\n    total_cost: float = Field(..., description=\"\
      Total cost of all hotel bookings\")\n    booking_status: bool = Field(..., description=\"\
      Whether the hotel booking was successful\")\n\n\nclass BookCarsOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for book_cars node outputs.\"\"\"\n    car_rental_booking_reference:\
      \ str = Field(..., description=\"Booking reference number for the car rental\"\
      )\n    car_rental_details: List[str] = Field(..., description=\"List of car\
      \ rental details, including car type, rental agency, and pickup/drop-off information\"\
      )\n    insurance_options: List[str] = Field(..., description=\"List of insurance\
      \ options selected for the car rental\")\n    equipment_upgrades: List[str]\
      \ = Field(..., description=\"List of equipment upgrades selected for the car\
      \ rental, such as GPS or child seats\")\n    total_cost: float = Field(...,\
      \ description=\"Total cost of the car rental, including any additional fees\
      \ or upgrades\")\n    booking_status: bool = Field(..., description=\"Whether\
      \ the car rental booking was successful\")\n\n\nclass ApplyForVisasOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for apply_for_visas node outputs.\"\"\"\n    visa_application_status:\
      \ bool = Field(..., description=\"Whether the visa application has been successfully\
      \ submitted\")\n    visa_types_applied_for: str = Field(..., description=\"\
      List of visa types applied for (e.g., tourist, business, transit)\")\n    required_documentation:\
      \ str = Field(..., description=\"List of required documentation for the visa\
      \ application (e.g., passport, proof of travel, financial statements)\")\n \
      \   visa_application_reference_numbers: str = Field(..., description=\"List\
      \ of reference numbers for the submitted visa applications\")\n    expected_processing_time:\
      \ int = Field(..., description=\"Expected processing time for the visa application\
      \ in days\")\n\n\nclass FinalizeTravelArrangementsOutput(BaseModel):\n    \"\
      \"\"Pydantic model for finalize_travel_arrangements node outputs.\"\"\"\n  \
      \  travel_arrangement_status: bool = Field(..., description=\"Whether all travel\
      \ arrangements have been successfully finalized\")\n    flight_confirmation_numbers:\
      \ List[str] = Field(..., description=\"List of confirmation numbers for booked\
      \ flights\")\n    hotel_confirmation_numbers: List[str] = Field(..., description=\"\
      List of confirmation numbers for booked hotels\")\n    car_rental_confirmation_numbers:\
      \ List[str] = Field(..., description=\"List of confirmation numbers for booked\
      \ car rentals\")\n    visa_application_status: List[str] = Field(..., description=\"\
      List of status updates for visa applications\")\n    total_travel_cost: float\
      \ = Field(..., description=\"Total cost of all travel arrangements\")\n\n\n\
      def finalize_travel_arrangements(book_flights_input: BookFlightsOutput, book_hotels_input:\
      \ BookHotelsOutput, book_cars_input: BookCarsOutput, apply_for_visas_input:\
      \ ApplyForVisasOutput, **kwargs) -> FinalizeTravelArrangementsOutput:\n    \"\
      \"\"Finalize all travel arrangements for the trip\n\n    Args:\n        book_flights_input:\
      \ Input from the 'book_flights' node.\n        book_hotels_input: Input from\
      \ the 'book_hotels' node.\n        book_cars_input: Input from the 'book_cars'\
      \ node.\n        apply_for_visas_input: Input from the 'apply_for_visas' node.\n\
      \        **kwargs: Additional keyword arguments.\n\n    Returns:\n        FinalizeTravelArrangementsOutput:\
      \ Object containing outputs for this node.\n    \"\"\"\n    # Retrieve flight\
      \ details from book_flights output\n    flight_details: dict = extract_flight_details(\n\
      \        flight_data=book_flights_input,\n        required_fields=[\"flight_booking_status\"\
      , \"flight_numbers\"]\n    )\n    \n    # Retrieve hotel details from book_hotels\
      \ output\n    hotel_details: dict = extract_hotel_details(\n        hotel_data=book_hotels_input,\n\
      \        required_fields=[\"booking_status\", \"hotel_names\"]\n    )\n    \n\
      \    # Retrieve car rental details from book_cars output\n    car_rental_details:\
      \ dict = extract_car_rental_details(\n        car_data=book_cars_input,\n  \
      \      required_fields=[\"booking_status\", \"car_rental_details\"]\n    )\n\
      \    \n    # Retrieve visa application details from apply_for_visas output\n\
      \    visa_details: dict = extract_visa_details(\n        visa_data=apply_for_visas_input,\n\
      \        required_fields=[\"visa_application_status\", \"visa_types_applied_for\"\
      ]\n    )\n    \n    # Aggregate confirmation numbers from bookings\n    flight_confirmation_numbers:\
      \ List[str] = get_confirmation_numbers(\n        booking_type=\"flight\", \n\
      \        booking_data=flight_details\n    )\n    \n    hotel_confirmation_numbers:\
      \ List[str] = get_confirmation_numbers(\n        booking_type=\"hotel\", \n\
      \        booking_data=hotel_details\n    )\n    \n    car_rental_confirmation_numbers:\
      \ List[str] = get_confirmation_numbers(\n        booking_type=\"car_rental\"\
      , \n        booking_data=car_rental_details\n    )\n    \n    # Calculate total\
      \ travel cost\n    total_cost: float = calculate_total_travel_cost(\n      \
      \  hotel_cost=book_hotels_input.total_cost,\n        car_rental_cost=book_cars_input.total_cost,\n\
      \        additional_costs={}\n    )\n    \n    # Determine overall travel arrangement\
      \ status\n    travel_status: bool = determine_travel_arrangement_status(\n \
      \       flight_status=book_flights_input.flight_booking_status,\n        hotel_status=book_hotels_input.booking_status,\n\
      \        car_rental_status=book_cars_input.booking_status,\n        visa_status=apply_for_visas_input.visa_application_status\n\
      \    )\n    \n    # Compile visa application status information\n    visa_status_info:\
      \ List[str] = compile_visa_status_info(\n        visa_data=apply_for_visas_input\n\
      \    )\n    \n    # Return the finalized travel arrangements\n    return FinalizeTravelArrangementsOutput(\n\
      \        travel_arrangement_status=travel_status,\n        flight_confirmation_numbers=flight_confirmation_numbers,\n\
      \        hotel_confirmation_numbers=hotel_confirmation_numbers,\n        car_rental_confirmation_numbers=car_rental_confirmation_numbers,\n\
      \        visa_application_status=visa_status_info,\n        total_travel_cost=total_cost\n\
      \    )\n"
    name: finalize_travel_arrangements
    nodes_depended_on:
