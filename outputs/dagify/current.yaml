  compute_cross_asset_features:
    agent: false
    code_node_type: shim
    description: Create correlation and spread features between the primary asset
      and each cross‑asset.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass AlignAndCleanDataOutput(BaseModel):\n    \"\"\"Pydantic model for\
      \ align_and_clean_data node outputs.\"\"\"\n    cleaned_data_csv: str = Field(...,\
      \ description=\"CSV\\u2011formatted text of the cleaned master DataFrame after\
      \ merging and imputation.\")\n    row_count: int = Field(..., description=\"\
      Number of rows (dates) present in the cleaned DataFrame.\")\n    column_names:\
      \ List[str] = Field(..., description=\"List of column names in the cleaned DataFrame,\
      \ including the primary asset fields and all feature columns.\")\n    missing_values_filled:\
      \ bool = Field(..., description=\"Indicates whether any missing values were\
      \ forward\\u2011filled during the cleaning process (true if any fill occurred,\
      \ false if none were needed).\")\n\n\nclass ComputeCrossAssetFeaturesOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for compute_cross_asset_features node outputs.\"\"\
      \"\n    date: List[str] = Field(..., description=\"List of dates for the computed\
      \ features (ISO\\u20118601 strings, sorted ascending).\")\n    asset_pairs:\
      \ List[str] = Field(..., description=\"List of cross\\u2011asset pair identifiers\
      \ used for correlation and spread calculation, formatted as \"Primary-SecondaryTicker\"\
      .\")\n    correlations: List[float] = Field(..., description=\"Flattened list\
      \ of rolling 20\\u2011day Pearson correlation values. Order is by date (earliest\
      \ to latest) then by asset_pairs order.\")\n    price_spreads: List[float] =\
      \ Field(..., description=\"Flattened list of daily price spread values (PrimaryClose\
      \ - SecondaryClose). Order matches the correlations list.\")\n\n\ndef compute_cross_asset_features(align_and_clean_data_input:\
      \ AlignAndCleanDataOutput, **kwargs) -> ComputeCrossAssetFeaturesOutput:\n \
      \   \"\"\"Create correlation and spread features between the primary asset and\
      \ each cross‑asset.\n\n    Args:\n        align_and_clean_data_input: Input\
      \ from the 'align_and_clean_data' node.\n        **kwargs: Additional keyword\
      \ arguments.\n\n    Returns:\n        ComputeCrossAssetFeaturesOutput: Object\
      \ containing outputs for this node.\n    \"\"\"\n    # Load CSV data and parse\
      \ into DataFrame with datetime index\n    df = load_and_parse_csv_with_datetime_index(csv_data=align_and_clean_data_input.cleaned_data_csv)\n\
      \    \n    # Identify primary and secondary asset columns\n    primary_close_col:\
      \ str = identify_primary_close_column(columns=df.columns)\n    secondary_close_cols:\
      \ List[str] = identify_secondary_close_columns(columns=df.columns, primary_col=primary_close_col)\n\
      \    \n    # Compute log returns for all assets\n    returns_df = compute_log_returns(price_df=df,\
      \ close_columns=[primary_close_col] + secondary_close_cols)\n    \n    # Compute\
      \ rolling 20-day correlations\n    corr_df = compute_rolling_correlations(\n\
      \        returns_df=returns_df,\n        primary_col=primary_close_col.replace('_Close',\
      \ '_Ret'),\n        secondary_cols=[col.replace('_Close', '_Ret') for col in\
      \ secondary_close_cols],\n        window=20\n    )\n    \n    # Compute price\
      \ spreads\n    spread_df = compute_price_spreads(\n        price_df=df,\n  \
      \      primary_col=primary_close_col,\n        secondary_cols=secondary_close_cols\n\
