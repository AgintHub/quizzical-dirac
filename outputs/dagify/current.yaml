      implementation: "def parse_world_context(context: str) -> str:\n    \"\"\"\n\
        \    This shim parses the world context to determine the geographical scope\
        \ for further data collection.\n\n    Args:\n        context: Input parameter\
        \ of type str\n\n    Returns:\n        str: Output of type str\n    \"\"\"\
        \n    import re\n    \n    # Analyze the input world context to identify key\
        \ geographical parameters\n    # Convert to lowercase for consistent processing\n\
        \    normalized_context = context.lower().strip()\n    \n    # Define patterns\
        \ for different geographical scopes\n    scope_patterns = {\n        'global':\
        \ r'\\b(world|global|worldwide|international|earth|planet)\\b',\n        'continental':\
        \ r'\\b(continent|africa|asia|europe|north america|south america|australia|antarctica)\\\
        b',\n        'national': r'\\b(country|nation|state|united states|usa|canada|mexico|brazil|china|india|russia|japan)\\\
        b',\n        'regional': r'\\b(region|area|zone|province|territory|district)\\\
        b',\n        'local': r'\\b(city|town|village|local|municipality|urban|rural)\\\
        b'\n    }\n    \n    # Analyze context to determine geographical scope\n \
        \   detected_scope = 'unknown'\n    \n    # Check for each scope pattern in\
        \ order of specificity (most specific first)\n    for scope, pattern in scope_patterns.items():\n\
        \        if re.search(pattern, normalized_context):\n            detected_scope\
        \ = scope\n            break\n    \n    # Validate the parsed geographical\
        \ scope against predefined criteria\n    valid_scopes = ['global', 'continental',\
        \ 'national', 'regional', 'local', 'unknown']\n    \n    if detected_scope\
        \ not in valid_scopes:\n        detected_scope = 'unknown'\n    \n    # If\
        \ no specific scope detected, try to infer from context size\n    if detected_scope\
        \ == 'unknown':\n        if len(normalized_context) > 200:\n            detected_scope\
        \ = 'global'  # Assume larger contexts are global\n        elif len(normalized_context)\
        \ > 50:\n            detected_scope = 'regional'  # Medium contexts are regional\n\
        \        else:\n            detected_scope = 'local'  # Small contexts are\
        \ local\n    \n    # Return the determined geographical scope in standardized\
        \ format\n    return detected_scope"
