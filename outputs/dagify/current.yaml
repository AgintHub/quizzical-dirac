      key: histogram_description
      type: str
    - description: Markdown description of the turnover time‑series chart, highlighting
        trends or spikes.
      key: turnover_chart_description
      type: str
    - description: Full markdown report containing the statistics and chart descriptions.
      key: markdown_report
      type: str
    prompt: Calculate annualized return, Sharpe, max drawdown, turnover, and win rate
      from the equity curve. Also describe a histogram of daily returns and a turnover
      time series chart. Output as a markdown report.
