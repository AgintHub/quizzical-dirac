        \ data types\n    if normalized_data_type == \"name\":\n        # For names,\
        \ split by common delimiters and standardize capitalization\n        names\
        \ = re.split(r'[,;\\n\\r]+', data)\n        formatted_list = [name.strip().title()\
        \ for name in names if name.strip()]\n    \n    elif normalized_data_type\
        \ == \"location\" or normalized_data_type == \"place\":\n        # For locations,\
