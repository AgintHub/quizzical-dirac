        \ community', 'research environment'],\n        'corporate': ['corporate world',\
        \ 'business environment', 'professional sphere']\n    }\n    \n    for indicator,\
        \ domain_interps in domain_indicators.items():\n        if any(indicator in\
        \ keyword for keyword in keywords):\n            for interp in domain_interps:\n\
        \                score = 1.8\n                interp_words = set(interp.lower().split())\n\
