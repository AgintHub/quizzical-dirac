dag_type: shim
description: Generated workflow from UI.
name: multi_factor_quant_strategy_generation
nodes:
  align_and_clean_data:
    agent: false
    code_node_type: stub
    description: Synchronize all fetched datasets to a common calendar, handle missing
      values, and store a clean master dataset.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass FetchPriceDataOutput(BaseModel):\n    \"\"\"Pydantic model for fetch_price_data\
      \ node outputs.\"\"\"\n    dates: List[str] = Field(..., description=\"List\
      \ of dates for the price data.\")\n    opens: List[float] = Field(..., description=\"\
      List of opening prices for each date.\")\n    highs: List[float] = Field(...,\
      \ description=\"List of high prices for each date.\")\n    lows: List[float]\
      \ = Field(..., description=\"List of low prices for each date.\")\n    closes:\
      \ List[float] = Field(..., description=\"List of closing prices for each date.\"\
      )\n    volumes: List[int] = Field(..., description=\"List of trading volumes\
      \ for each date.\")\n\n\nclass FetchCrossAssetDataOutput(BaseModel):\n    \"\
      \"\"Pydantic model for fetch_cross_asset_data node outputs.\"\"\"\n    csv_data:\
      \ str = Field(..., description=\"CSV\\u2011formatted string of the resulting\
      \ table, with a \"Date\" column followed by a column for each cross\\u2011asset's\
      \ closing price.\")\n    asset_names: List[str] = Field(..., description=\"\
      List of cross\\u2011asset identifiers (e.g., ticker symbols) that were fetched.\"\
      )\n    start_date: str = Field(..., description=\"ISO\\u20118601 formatted first\
      \ date of the returned series.\")\n    end_date: str = Field(..., description=\"\
      ISO\\u20118601 formatted last date of the returned series.\")\n    row_count:\
      \ int = Field(..., description=\"Number of rows (dates) in the returned table.\"\
      )\n\n\nclass FetchRegimeIndicatorDataOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for fetch_regime_indicator_data node outputs.\"\"\"\n    regime_indicator_csv:\
      \ str = Field(..., description=\"CSV formatted table containing a Date column\
      \ and one column for each regime indicator, aligned to the price\\u2011data\
      \ calendar.\")\n\n\nclass FetchVolatilityDataOutput(BaseModel):\n    \"\"\"\
      Pydantic model for fetch_volatility_data node outputs.\"\"\"\n    dates: List[str]\
      \ = Field(..., description=\"List of dates for which volatility data is provided,\
      \ formatted as YYYY-MM-DD.\")\n    realized_vol: List[float] = Field(..., description=\"\
      30\\u2011day rolling realized volatility values corresponding to each date.\"\
      )\n    implied_vol: List[float] = Field(..., description=\"Implied volatility\
      \ index values for the primary asset corresponding to each date.\")\n\n\nclass\
      \ AlignAndCleanDataOutput(BaseModel):\n    \"\"\"Pydantic model for align_and_clean_data\
      \ node outputs.\"\"\"\n    cleaned_data_csv: str = Field(..., description=\"\
      CSV\\u2011formatted text of the cleaned master DataFrame after merging and imputation.\"\
      )\n    row_count: int = Field(..., description=\"Number of rows (dates) present\
      \ in the cleaned DataFrame.\")\n    column_names: List[str] = Field(..., description=\"\
      List of column names in the cleaned DataFrame, including the primary asset fields\
      \ and all feature columns.\")\n    missing_values_filled: bool = Field(...,\
      \ description=\"Indicates whether any missing values were forward\\u2011filled\
      \ during the cleaning process (true if any fill occurred, false if none were\
      \ needed).\")\n\n\ndef align_and_clean_data(fetch_price_data_input: FetchPriceDataOutput,\
      \ fetch_cross_asset_data_input: FetchCrossAssetDataOutput, fetch_regime_indicator_data_input:\
      \ FetchRegimeIndicatorDataOutput, fetch_volatility_data_input: FetchVolatilityDataOutput,\
      \ **kwargs) -> AlignAndCleanDataOutput:\n    \"\"\"Synchronize all fetched datasets\
      \ to a common calendar, handle missing values, and store a clean master dataset.\n\
      \n    Args:\n        fetch_price_data_input: Input from the 'fetch_price_data'\
      \ node.\n        fetch_cross_asset_data_input: Input from the 'fetch_cross_asset_data'\
      \ node.\n        fetch_regime_indicator_data_input: Input from the 'fetch_regime_indicator_data'\
      \ node.\n        fetch_volatility_data_input: Input from the 'fetch_volatility_data'\
      \ node.\n        **kwargs: Additional keyword arguments.\n\n    Returns:\n \
      \       AlignAndCleanDataOutput: Object containing outputs for this node.\n\
      \    \"\"\"\n    # TODO: Implement this function\n\n    # Return stub output\
      \ with placeholder values\n    return AlignAndCleanDataOutput(\n        cleaned_data_csv=\"\
      \",\n        row_count=0,\n        column_names=[],\n        missing_values_filled=False,\n\
      \    )"
    name: align_and_clean_data
    nodes_depended_on:
    - fetch_price_data
    - fetch_cross_asset_data
    - fetch_regime_indicator_data
    - fetch_volatility_data
    nodes_dependent_on: []
    output_structure:
    - description: CSV‑formatted text of the cleaned master DataFrame after merging
        and imputation.
      key: cleaned_data_csv
      type: str
    - description: Number of rows (dates) present in the cleaned DataFrame.
      key: row_count
      type: int
    - description: List of column names in the cleaned DataFrame, including the primary
        asset fields and all feature columns.
      key: column_names
      type: List[str]
    - description: Indicates whether any missing values were forward‑filled during
        the cleaning process (true if any fill occurred, false if none were needed).
      key: missing_values_filled
      type: bool
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Use `pd.DataFrame` constructors from the primitive lists; e.g., for
          fetch_price_data build columns Date, Open, High, Low, Close, Volume. Apply
          `pd.to_datetime(df['Date'])` and `df.set_index('Date', inplace=True)` for
          all five DataFrames.
        reason: Uniform datetime indexing guarantees a deterministic merge order and
          simplifies calendar alignment.
        text: Load each parent node's output into a Pandas DataFrame with Date parsed
          as `datetime64[ns]` and set as the index.
      - complexity: LOW
        impact: MEDIUM
        method: Check `df.index.duplicated().any()` and raise an exception if true;
          enforce `df.index = df.index.tz_localize('UTC')` when tz‑naive.
        reason: Duplicate dates or timezone mismatches cause ambiguous merges and
          hidden NaNs.
        text: Validate that all five DataFrames share the same timezone (UTC) and
          that there are no duplicate Date entries within any table.
      - complexity: MEDIUM
        impact: HIGH
        method: Start with `master_df = price_df`; iterate over `[cross_asset_df,
          regime_df, volatility_df]` and execute `master_df = master_df.join(other_df,
          how='outer')`. Preserve original column names to avoid collisions.
        reason: Outer join preserves the full universe of dates from any source, creating
          the superset calendar required for downstream feature engineering.
        text: Perform an outer join on the Date index across all five DataFrames using
          `pd.merge(..., how='outer')` sequentially or `pd.concat(..., axis=1, join='outer')`.
      - complexity: LOW
        impact: LOW
        method: Store the result; after forward‑fill, compute `missing_after_fill
          = master_df.isna().any().any()` and set `missing_values_filled = missing_before_fill
          and not missing_after_fill`.
        reason: The output field `missing_values_filled` must reflect whether forward‑fill
          actually occurred.
        text: Create a boolean flag `missing_before_fill = master_df.isna().any().any()`
          to record whether any NaNs exist prior to imputation.
      - complexity: LOW
        impact: HIGH
        method: Execute `master_df.ffill(inplace=True); master_df.bfill(inplace=True)`.
        reason: Forward‑fill respects causality (using the most recent known value),
          while a trailing `bfill` ensures the first rows are not dropped unnecessarily.
        text: Apply forward‑fill (`ffill`) on the merged DataFrame, then backward‑fill
          (`bfill`) as a safety net for leading NaNs.
      - complexity: LOW
        impact: MEDIUM
        method: Call `master_df.dropna(inplace=True)` and verify `master_df.empty`
          is false; otherwise raise an alert.
        reason: Downstream models cannot handle missing entries; dropping ensures
          a clean dataset.
        text: Drop any remaining rows that still contain NaN values after imputation
          using `master_df.dropna(inplace=True)`.
      - complexity: LOW
        impact: LOW
        method: Assign variables directly after the final drop operation.
        reason: These fields are required by the downstream schema and useful for
          sanity‑checking the cleaning step.
        text: Capture `row_count = master_df.shape[0]` and `column_names = list(master_df.columns)`
          for output metadata.
      - complexity: LOW
        impact: LOW
        method: Use `cleaned_data_csv = master_df.reset_index().to_csv(index=False,
          line_terminator='\n')`.
        reason: The downstream nodes expect CSV text; omitting the index avoids an
          extra unnamed column.
        text: Convert the cleaned DataFrame to a CSV‑formatted string without the
          index (`index=False`) and store as `cleaned_data_csv`.
      - complexity: LOW
        impact: HIGH
        method: 'Return `{ ''cleaned_data_csv'': cleaned_data_csv, ''row_count'':
          int(row_count), ''column_names'': column_names, ''missing_values_filled'':
          bool(missing_values_filled) }`.'
        reason: Consistent typing and field naming allow downstream nodes to consume
          the result without conversion errors.
        text: Assemble the final output dictionary matching the declared `output_structure`
          and return it to the workflow engine.
    prompt: Merge the five tables on Date, forward‑fill any missing values, and drop
      rows still containing NaNs. Return the cleaned DataFrame as CSV text.
    shims: []
  analyze_feature_importance:
    agent: false
    code_node_type: stub
    description: Compute and report the importance of each feature for the selected
      model.
    implementation: "from pydantic import BaseModel, Field\n\n\nclass SelectBestModelOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for select_best_model node outputs.\"\"\"\n    best_model_identifier:\
      \ str = Field(..., description=\"Identifier of the selected best model.\")\n\
      \    sharpe_ratio: float = Field(..., description=\"Sharpe ratio of the selected\
      \ model.\")\n    max_drawdown: float = Field(..., description=\"Maximum drawdown\
      \ of the selected model.\")\n    annualized_return: float = Field(..., description=\"\
      Annualized return of the selected model.\")\n\n\nclass AssembleFeatureMatrixOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for assemble_feature_matrix node outputs.\"\"\"\n\
      \    feature_matrix_csv: str = Field(..., description=\"CSV\\u2011formatted\
      \ string containing the complete feature matrix with a Date column, all merged\
      \ feature columns, and a Target column for the next\\u2011day return.\")\n\n\
      \nclass AnalyzeFeatureImportanceOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for analyze_feature_importance node outputs.\"\"\"\n    model_id: str = Field(...,\
      \ description=\"Identifier of the model selected as best (e.g., \"GBM_v1\" or\
      \ \"LSTM_ensemble\")\")\n    feature_names: str = Field(..., description=\"\
      List of feature names sorted from most to least important\")\n    importance_scores:\
      \ float = Field(..., description=\"Corresponding importance scores for each\
      \ feature in feature_names (higher means more important)\")\n    ranking_method:\
      \ str = Field(..., description=\"Method used to compute importance (e.g., \"\
      SHAP\", \"gain\", \"permutation\")\")\n\n\ndef analyze_feature_importance(select_best_model_input:\
      \ SelectBestModelOutput, assemble_feature_matrix_input: AssembleFeatureMatrixOutput,\
      \ **kwargs) -> AnalyzeFeatureImportanceOutput:\n    \"\"\"Compute and report\
      \ the importance of each feature for the selected model.\n\n    Args:\n    \
      \    select_best_model_input: Input from the 'select_best_model' node.\n   \
      \     assemble_feature_matrix_input: Input from the 'assemble_feature_matrix'\
      \ node.\n        **kwargs: Additional keyword arguments.\n\n    Returns:\n \
      \       AnalyzeFeatureImportanceOutput: Object containing outputs for this node.\n\
      \    \"\"\"\n    # TODO: Implement this function\n\n    # Return stub output\
      \ with placeholder values\n    return AnalyzeFeatureImportanceOutput(\n    \
      \    model_id=\"\",\n        feature_names=\"\",\n        importance_scores=0.0,\n\
      \        ranking_method=\"\",\n    )"
    name: analyze_feature_importance
    nodes_depended_on:
    - select_best_model
    - assemble_feature_matrix
    nodes_dependent_on: []
    output_structure:
    - description: Identifier of the model selected as best (e.g., "GBM_v1" or "LSTM_ensemble")
      key: model_id
      type: str
    - description: List of feature names sorted from most to least important
      key: feature_names
      type: str
    - description: Corresponding importance scores for each feature in feature_names
        (higher means more important)
      key: importance_scores
      type: float
    - description: Method used to compute importance (e.g., "SHAP", "gain", "permutation")
      key: ranking_method
      type: str
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Access the `best_model_identifier` field from the `select_best_model`
          node's output.
        reason: The `model_id` is required to load the selected model for feature
          importance analysis.
        text: Retrieve the best model identifier from the output of the `select_best_model`
          node.
      - complexity: MEDIUM
        impact: HIGH
        method: Use a CSV parsing library (e.g., pandas in Python) to load the `feature_matrix_csv`
          into a dataframe.
        reason: The model needs the feature data used for training to determine feature
          importances. Loading from CSV ensures consistent data format.
        text: Load the feature matrix from the CSV string provided in the `feature_matrix_csv`
          field of the `assemble_feature_matrix` node's output.
      - complexity: MEDIUM
        impact: HIGH
        method: Implement a model registry or loading function that maps `model_id`
          to a corresponding model object. Handle potential errors like model not
          found.
        reason: The model needs to be loaded to calculate feature importances based
          on its internal structure or through permutation methods.
        text: Load the selected model based on the `model_id` retrieved earlier. Assume
          a model registry or loading function exists. If the model ID contains information
          about the model type, use that.
      - complexity: HIGH
        impact: HIGH
        method: Implement a conditional logic to select the feature importance method
          based on the model type. Account for cases where feature importance is not
          available through direct model introspection. Allow overriding this choice
          using external config parameters.
        reason: Different model types have different methods for determining feature
          importance. This step selects the appropriate method.
        text: Determine feature importance ranking method. If the model is a tree-based
          model (e.g., Gradient Boosting), use 'gain' (mean decrease in impurity).
          If the model is linear/logistic regression, use coefficients as the importance
          score. If the above are not applicable, or if specified in configuration,
          use SHAP values.
      - complexity: HIGH
        impact: HIGH
        method: Use model-specific methods to compute feature importances. For tree
          based models, use `model.feature_importances_`. For SHAP, instantiate a
          `shap.Explainer` object with the model (or model's prediction function)
          and compute SHAP values for a representative sample of the data.
        reason: This is the core step where the feature importances are calculated.
        text: Compute feature importances using the chosen method. For 'gain', extract
          the feature importances directly from the model. For SHAP values, use a
          SHAP explainer on a subset of the feature matrix.
      - complexity: LOW
        impact: HIGH
        method: Sort the feature names based on the corresponding importance scores
          using a sorting algorithm (e.g., `sorted` function in Python with `reverse=True`).
        reason: The ranked list provides the most relevant features at the top.
        text: Rank the features based on their importance scores in descending order.
      - complexity: LOW
        impact: LOW
        method: Unzip the sorted list of tuples (feature name, importance score).
        reason: This prepares the data for the output structure.
        text: Extract the sorted feature names and corresponding importance scores
          into separate lists.
      - complexity: LOW
        impact: HIGH
        method: Assign the calculated values to the corresponding fields in the output
          dictionary.
        reason: This provides the results in the required format.
        text: Populate the output structure with the `model_id`, sorted `feature_names`,
          `importance_scores`, and `ranking_method`.
    prompt: For the chosen model, generate a ranked list of feature importances (e.g.,
      gain, SHAP values). Present as a table with Feature and ImportanceScore.
    shims: []
  assemble_feature_matrix:
    agent: false
    code_node_type: shim
    description: Combine all individual feature tables into a single matrix aligned
      with the target variable.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass ComputePriceActionFeaturesOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for compute_price_action_features node outputs.\"\"\"\n    csv_data: str =\
      \ Field(..., description=\"CSV\\u2011formatted text containing the Date column\
      \ followed by each computed feature column (log_return, ma_10, ma_30, rsi, macd,\
      \ atr).\")\n    feature_names: List[str] = Field(..., description=\"List of\
      \ feature column names in the order they appear in the CSV (excluding the Date\
      \ column).\")\n    row_count: int = Field(..., description=\"Number of rows\
      \ (dates) in the generated feature table.\")\n\n\nclass ComputeCrossAssetFeaturesOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for compute_cross_asset_features node outputs.\"\"\
      \"\n    date: List[str] = Field(..., description=\"List of dates for the computed\
      \ features (ISO\\u20118601 strings, sorted ascending).\")\n    asset_pairs:\
      \ List[str] = Field(..., description=\"List of cross\\u2011asset pair identifiers\
      \ used for correlation and spread calculation, formatted as \"Primary-SecondaryTicker\"\
      .\")\n    correlations: List[float] = Field(..., description=\"Flattened list\
      \ of rolling 20\\u2011day Pearson correlation values. Order is by date (earliest\
      \ to latest) then by asset_pairs order.\")\n    price_spreads: List[float] =\
      \ Field(..., description=\"Flattened list of daily price spread values (PrimaryClose\
      \ - SecondaryClose). Order matches the correlations list.\")\n\n\nclass ComputeRegimeFeaturesOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for compute_regime_features node outputs.\"\"\"\n\
      \    dates: List[str] = Field(..., description=\"List of dates (ISO\\u20118601\
      \ strings) for which regime signals are generated.\")\n    regime_labels: List[str]\
      \ = Field(..., description=\"Corresponding regime label for each date: either\
      \ \"high_vol\" or \"low_vol\".\")\n    pmi_flags: List[bool] = Field(..., description=\"\
      Binary flag indicating PMI direction for each date: true for positive PMI, false\
      \ for negative PMI.\")\n\n\nclass ComputeVolatilityFeaturesOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for compute_volatility_features node outputs.\"\"\"\
      \n    dates: List[str] = Field(..., description=\"List of dates (ISO format)\
      \ for which the forecasts are generated.\")\n    garch_forecasts: List[float]\
      \ = Field(..., description=\"One\\u2011step\\u2011ahead volatility forecast\
      \ from the GARCH(1,1) model for each corresponding date.\")\n    implied_vol_delta_5d:\
      \ List[float] = Field(..., description=\"5\\u2011day change in implied volatility\
      \ (ImpliedVol[t] - ImpliedVol[t-5]) for each date.\")\n\n\nclass AssembleFeatureMatrixOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for assemble_feature_matrix node outputs.\"\"\"\n\
      \    feature_matrix_csv: str = Field(..., description=\"CSV\\u2011formatted\
      \ string containing the complete feature matrix with a Date column, all merged\
      \ feature columns, and a Target column for the next\\u2011day return.\")\n\n\
      \ndef assemble_feature_matrix(compute_price_action_features_input: ComputePriceActionFeaturesOutput,\
      \ compute_cross_asset_features_input: ComputeCrossAssetFeaturesOutput, compute_regime_features_input:\
      \ ComputeRegimeFeaturesOutput, compute_volatility_features_input: ComputeVolatilityFeaturesOutput,\
      \ **kwargs) -> AssembleFeatureMatrixOutput:\n    \"\"\"Combine all individual\
      \ feature tables into a single matrix aligned with the target variable.\n\n\
      \    Args:\n        compute_price_action_features_input: Input from the 'compute_price_action_features'\
      \ node.\n        compute_cross_asset_features_input: Input from the 'compute_cross_asset_features'\
      \ node.\n        compute_regime_features_input: Input from the 'compute_regime_features'\
      \ node.\n        compute_volatility_features_input: Input from the 'compute_volatility_features'\
      \ node.\n        **kwargs: Additional keyword arguments.\n\n    Returns:\n \
      \       AssembleFeatureMatrixOutput: Object containing outputs for this node.\n\
      \    \"\"\"\n    # Load CSV payloads from each parent node into DataFrames\n\
      \    price_df = load_price_action_csv(csv_data=compute_price_action_features_input.csv_data)\n\
      \    cross_df = load_cross_asset_csv(dates=compute_cross_asset_features_input.date,\
      \ \n                                     asset_pairs=compute_cross_asset_features_input.asset_pairs,\n\
      \                                     correlations=compute_cross_asset_features_input.correlations,\n\
      \                                     price_spreads=compute_cross_asset_features_input.price_spreads)\n\
      \    regime_df = load_regime_csv(dates=compute_regime_features_input.dates,\n\
      \                                 regime_labels=compute_regime_features_input.regime_labels,\n\
      \                                 pmi_flags=compute_regime_features_input.pmi_flags)\n\
      \    vol_df = load_volatility_csv(dates=compute_volatility_features_input.dates,\n\
      \                                  garch_forecasts=compute_volatility_features_input.garch_forecasts,\n\
      \                                  implied_vol_delta_5d=compute_volatility_features_input.implied_vol_delta_5d)\n\
      \    \n    # Standardize Date columns and set as index\n    price_df = standardize_date_index(df=price_df)\n\
      \    cross_df = standardize_date_index(df=cross_df)\n    regime_df = standardize_date_index(df=regime_df)\n\
      \    vol_df = standardize_date_index(df=vol_df)\n    \n    # Perform inner join\
      \ on Date index\n    merged_df = inner_join_on_date(price_df=price_df, cross_df=cross_df,\
      \ regime_df=regime_df, vol_df=vol_df)\n    \n    # Detect and resolve duplicate\
      \ column names\n    merged_df = resolve_duplicate_columns(df=merged_df, source_prefixes=['price_',\
      \ 'cross_', 'regime_', 'vol_'])\n    \n    # Compute target variable (next-day\
      \ simple return)\n    merged_df = compute_next_day_return_target(df=merged_df,\
      \ close_column='close')\n    \n    # Re-index to chronological order and reset\
      \ index\n    merged_df = sort_and_reset_index(df=merged_df)\n    \n    # Validate\
      \ final matrix\n    validate_feature_matrix(df=merged_df, expected_columns=['Date',\
      \ 'Target'])\n    \n    # Serialize to CSV string\n    feature_matrix_csv: str\
      \ = serialize_to_csv_string(df=merged_df)\n    \n    # Log summary for observability\n\
      \    log_feature_matrix_summary(df=merged_df)\n    \n    return AssembleFeatureMatrixOutput(\n\
      \        feature_matrix_csv=feature_matrix_csv\n    )"
    name: assemble_feature_matrix
    nodes_depended_on:
    - compute_price_action_features
    - compute_cross_asset_features
    - compute_regime_features
    - compute_volatility_features
    nodes_dependent_on: []
    output_structure:
    - description: CSV‑formatted string containing the complete feature matrix with
        a Date column, all merged feature columns, and a Target column for the next‑day
        return.
      key: feature_matrix_csv
      type: str
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: Use pandas.read_csv with `parse_dates=['Date']`, `dayfirst=False`,
          `dtype` inference disabled; wrap in try/except to capture malformed rows.
        reason: Ensures that all feature tables are correctly interpreted before any
          join operation; parsing errors are caught early.
        text: Load the CSV payloads from each parent node (price_action, cross_asset,
          regime, volatility) into in‑memory data frames using a robust CSV parser
          that respects ISO‑8601 dates and quoted fields.
      - complexity: LOW
        impact: HIGH
        method: Apply `df['Date'] = pd.to_datetime(df['Date']).dt.normalize()` and
          then `df.set_index('Date', inplace=True)`.
        reason: Date inconsistencies (timezones, format variations) would cause mismatched
          joins and missing rows.
        text: Standardize the Date column across all data frames to midnight UTC and
          set it as the index to guarantee exact alignment during the merge.
      - complexity: MEDIUM
        impact: HIGH
        method: Use `merged = price_df.join([cross_df, regime_df, vol_df], how='inner')`.
        reason: Target computation requires a complete set of predictors; dropping
          dates with missing features avoids NaNs later in modeling.
        text: Perform an inner join on the Date index across the four feature data
          frames to keep only dates present in every source, thereby guaranteeing
          a complete feature row for each observation.
      - complexity: MEDIUM
        impact: MEDIUM
        method: After merging, inspect `merged.columns`. For any duplicates, rename
          using a prefix based on source table (e.g., `price_`, `vol_`). Implement
          a helper `unique_rename(columns, source_prefix)`.
        reason: Duplicate columns cause CSV export failures and ambiguous feature
          references in downstream models.
        text: Detect and resolve any duplicate column names that may arise from overlapping
          feature names (e.g., both price and volatility tables containing a column
          called `date`).
      - complexity: MEDIUM
        impact: HIGH
        method: Create a series `next_day_return = price_df['close'].shift(-1) / price_df['close']
          - 1`. Append as a new column `Target` to the merged data frame. Drop the
          final row where Target is NaN.
        reason: The model learns to predict this target; it must be aligned with the
          feature row date (i.e., return from t to t+1 assigned to row at date t).
        text: Compute the target variable – next‑day simple return – using the cleaned
          primary asset closing price series that resides in the price_action feature
          table (column `close`).
      - complexity: LOW
        impact: LOW
        method: Execute `merged.sort_index(inplace=True); merged.reset_index(inplace=True)`.
        reason: Ordered dates simplify downstream time‑series splits and improve readability
