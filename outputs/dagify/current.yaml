      \ asset symbols or identifiers that the strategy is designed to trade\")\n\n\
      \ndef define_trading_strategy(collect_historical_market_data_input: CollectHistoricalMarketDataOutput,\
      \ **kwargs) -> DefineTradingStrategyOutput:\n    \"\"\"Develop a trading strategy\
