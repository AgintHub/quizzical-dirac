        \        if not cleaned:\n            continue\n            \n        # Remove\
        \ special characters except spaces, hyphens, and apostrophes\n        cleaned\
        \ = re.sub(r'[^a-zA-Z\\s\\-\\']+', '', cleaned)\n        \n        # Normalize\
        \ whitespace (replace multiple spaces with single space)\n        cleaned\
        \ = re.sub(r'\\s+', ' ', cleaned)\n        \n        # Capitalize each word\
        \ (title case)\n        cleaned = cleaned.title()\n        \n        # Handle\
        \ common continent name variations and standardize\n        continent_mapping\
        \ = {\n            'N America': 'North America',\n            'N. America':\
        \ 'North America',\n            'S America': 'South America', \n         \
        \   'S. America': 'South America',\n            'Australia/Oceania': 'Australia',\n\
        \            'Oceania': 'Australia',\n            'Antarctic': 'Antarctica',\n\
        \            'Europe/Asia': 'Eurasia'\n        }\n        \n        # Apply\
        \ mapping if exists\n        if cleaned in continent_mapping:\n          \
        \  cleaned = continent_mapping[cleaned]\n            \n        # Only add\
        \ non-empty, valid continent names\n        if cleaned and len(cleaned) >\
        \ 1:\n            formatted_continents.append(cleaned)\n    \n    # Remove\
        \ duplicates while preserving order\n    seen = set()\n    result = []\n \
        \   for continent in formatted_continents:\n        if continent not in seen:\n\
        \            seen.add(continent)\n            result.append(continent)\n \
        \   \n    return result"
