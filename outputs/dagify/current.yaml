        \ 'learning environment', 'academic community', 'knowledge world'],\n    \
        \    'health': ['global health', 'medical field', 'healthcare system', 'wellness\
        \ domain'],\n        'sports': ['sports world', 'athletic community', 'competitive\
        \ arena', 'sporting realm'],\n        'entertainment': ['entertainment industry',\
        \ 'media world', 'creative sphere', 'cultural entertainment']\n    }\n   \
        \ \n    # Score and rank interpretations\n    scored_interpretations = []\n\
        \    \n    # Add base interpretations with base score\n    for interp in base_interpretations:\n\
        \        score = 1.0\n        # Boost score if interpretation words appear\
        \ in keywords\n        interp_words = set(interp.lower().split())\n      \
        \  overlap = len(interp_words.intersection(keywords))\n        score += overlap\
        \ * 0.5\n        scored_interpretations.append((interp, score))\n    \n  \
