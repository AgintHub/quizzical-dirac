      \    )\n    \n    # Process each successful trade\n    for trade in successful_trades:\n\
      \        # Update position map and detect closures\n        position_update_result\
      \ = update_position_map(\n            position_map=position_map,\n         \
      \   instrument=trade[\"instrument\"],\n            side=trade[\"side\"],\n \
