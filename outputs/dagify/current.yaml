        \ 'french', 'german', 'italian', 'portuguese',\n            'russian', 'chinese',\
        \ 'japanese', 'korean', 'arabic', 'hindi',\n            'bengali', 'punjabi',\
        \ 'tamil', 'telugu', 'marathi', 'gujarati',\n            'urdu', 'persian',\
        \ 'turkish', 'greek', 'hebrew', 'thai',\n            'vietnamese', 'indonesian',\
        \ 'malay', 'filipino', 'dutch', 'swedish',\n            'norwegian', 'danish',\
        \ 'polish', 'czech', 'hungarian', 'romanian'\n        }\n        \n      \
        \  # Check if language is recognized\n        found_match = False\n      \
        \  for language in known_languages:\n            if language in cleaned_data\
