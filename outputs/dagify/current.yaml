        VALID: Recognized language - {language}\")\n                found_match =\
        \ True\n                break\n        \n        if not found_match:\n   \
        \         validation_results.append(\"WARNING: Unrecognized language - requires\
        \ manual verification\")\n    \n    elif data_type == 'cultural_practice':\n\
        \        # Cultural practice keywords validation\n        practice_keywords\
        \ = {\n            'festival', 'ceremony', 'ritual', 'tradition', 'custom',\
        \ 'celebration',\n            'dance', 'music', 'art', 'cuisine', 'clothing',\
        \ 'marriage', 'funeral',\n            'birth', 'coming of age', 'harvest',\
        \ 'religious', 'seasonal',\n            'wedding', 'prayer', 'meditation',\
        \ 'pilgrimage'\n        }\n        \n        # Check if practice contains\
        \ recognized keywords\n        found_keywords = []\n        for keyword in\
        \ practice_keywords:\n            if keyword in cleaned_data:\n          \
        \      found_keywords.append(keyword)\n        \n        if found_keywords:\n\
        \            validation_results.append(f\"VALID: Cultural practice with recognized\
        \ elements - {', '.join(found_keywords)}\")\n        else:\n            validation_results.append(\"\
        WARNING: Cultural practice with no recognized keywords - requires manual verification\"\
        )\n    \n    # World context validation\n    if world_context and world_context.strip():\n\
        \        context_lower = world_context.lower()\n        \n        # Check\
