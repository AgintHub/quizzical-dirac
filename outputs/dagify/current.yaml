        \        found_match = False\n        for religion in known_religions:\n \
        \           if religion in cleaned_data or cleaned_data in religion:\n   \
        \             validation_results.append(f\"VALID: Recognized religion - {religion}\"\
        )\n                found_match = True\n                break\n        \n \
        \       if not found_match:\n            validation_results.append(\"WARNING:\
        \ Unrecognized religion - requires manual verification\")\n    \n    elif\
        \ data_type == 'language':\n        # Known languages validation (ISO 639-1\
