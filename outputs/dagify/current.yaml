        \ = ['middle east', 'southeast asia', 'east asia', 'south asia', 'central\
        \ asia',\n                  'eastern europe', 'western europe', 'northern\
        \ europe', 'southern europe',\n                  'caribbean', 'central america',\
        \ 'oceania']\n        \n        context_found = False\n        for continent\
        \ in continents:\n            if continent in context_lower:\n           \
        \     validation_results.append(f\"CONTEXT: Geographical context identified\
        \ - {continent}\")\n                context_found = True\n               \
        \ break\n        \n        if not context_found:\n            for region in\
        \ regions:\n                if region in context_lower:\n                \
        \    validation_results.append(f\"CONTEXT: Regional context identified - {region}\"\
        )\n                    context_found = True\n                    break\n \
        \       \n        if not context_found:\n            validation_results.append(\"\
        CONTEXT: No recognized geographical context\")\n        \n        # Check\
