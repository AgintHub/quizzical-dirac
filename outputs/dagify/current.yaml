  evaluate_models:
    agent: false
    code_node_type: shim
    description: Assess all trained candidates on the test set and compute performance
      metrics.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass TrainModelsOutput(BaseModel):\n    \"\"\"Pydantic model for train_models\
      \ node outputs.\"\"\"\n    hyperparameters: List[str] = Field(..., description=\"\
      List of hyperparameter combinations for each trained model.\")\n    validation_sharpe:\
      \ List[float] = Field(..., description=\"List of Sharpe ratios calculated on\
      \ the validation set for each trained model.\")\n    validation_rmse: List[float]\
      \ = Field(..., description=\"List of Root Mean Squared Errors calculated on\
      \ the validation set for each trained model.\")\n\n\nclass SplitDatasetOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for split_dataset node outputs.\"\"\"\n    train_csv:\
      \ str = Field(..., description=\"CSV formatted text containing the training\
      \ subset of the feature matrix.\")\n    validation_csv: str = Field(..., description=\"\
      CSV formatted text containing the validation subset of the feature matrix.\"\
      )\n    test_csv: str = Field(..., description=\"CSV formatted text containing\
      \ the test subset of the feature matrix.\")\n\n\nclass EvaluateModelsOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for evaluate_models node outputs.\"\"\"\n    candidate_models:\
      \ List[str] = Field(..., description=\"Identifier or name of each evaluated\
      \ model candidate.\")\n    sharpe_ratios: List[float] = Field(..., description=\"\
      Sharpe ratio for each model on the test set.\")\n    annualized_returns: List[float]\
      \ = Field(..., description=\"Annualized return (in percent) for each model on\
      \ the test set.\")\n    max_drawdowns: List[float] = Field(..., description=\"\
      Maximum drawdown (in percent) observed for each model on the test set.\")\n\
      \    turnovers: List[float] = Field(..., description=\"Average portfolio turnover\
      \ (as a percent of portfolio per period) for each model.\")\n    hit_rates:\
      \ List[float] = Field(..., description=\"Proportion of trades with positive\
      \ return (hit\\u2011rate) for each model.\")\n    ranks: List[int] = Field(...,\
      \ description=\"Rank of each model based on the chosen composite performance\
      \ criterion (1 = best).\")\n\n\ndef evaluate_models(train_models_input: TrainModelsOutput,\
      \ split_dataset_input: SplitDatasetOutput, **kwargs) -> EvaluateModelsOutput:\n\
      \    \"\"\"Assess all trained candidates on the test set and compute performance\
      \ metrics.\n\n    Args:\n        train_models_input: Input from the 'train_models'\
      \ node.\n        split_dataset_input: Input from the 'split_dataset' node.\n\
      \        **kwargs: Additional keyword arguments.\n\n    Returns:\n        EvaluateModelsOutput:\
      \ Object containing outputs for this node.\n    \"\"\"\n    # Parse CSV strings\
      \ into DataFrames with proper dtypes\n    train_df = parse_csv_to_dataframe(csv_string=split_dataset_input.train_csv)\n\
      \    validation_df = parse_csv_to_dataframe(csv_string=split_dataset_input.validation_csv)\n\
      \    test_df = parse_csv_to_dataframe(csv_string=split_dataset_input.test_csv)\n\
      \    \n    # Validate test DataFrame has required columns\n    validate_test_dataframe_columns(test_df=test_df)\n\
      \    \n    # Extract model identifiers and parse hyperparameters\n    model_mapping:\
      \ Dict[str, Dict] = extract_model_identifiers_and_hyperparams(hyperparameters=train_models_input.hyperparameters)\n\
      \    \n    # Load trained models from storage\n    loaded_models: Dict[str,\
      \ Any] = load_trained_models(model_ids=list(model_mapping.keys()))\n    \n \
      \   # Generate predictions for each valid model\n    predictions: Dict[str,\
      \ Any] = generate_test_predictions(models=loaded_models, test_df=test_df)\n\
      \    \n    # Convert predictions to position signals\n    positions: Dict[str,\
      \ Any] = convert_predictions_to_positions(predictions=predictions)\n    \n \
      \   # Compute daily portfolio returns for each model\n    daily_returns: Dict[str,\
      \ Any] = compute_portfolio_returns(positions=positions, test_df=test_df)\n \
      \   \n    # Calculate performance metrics for each model\n    sharpe_ratios:\
      \ List[float] = calculate_sharpe_ratios(daily_returns=daily_returns)\n    annualized_returns:\
      \ List[float] = calculate_annualized_returns(daily_returns=daily_returns)\n\
      \    max_drawdowns: List[float] = calculate_max_drawdowns(daily_returns=daily_returns)\n\
      \    turnovers: List[float] = calculate_turnovers(positions=positions)\n   \
      \ hit_rates: List[float] = calculate_hit_rates(daily_returns=daily_returns)\n\
      \    \n    # Calculate composite ranking scores\n    ranks: List[int] = calculate_composite_rankings(\n\
      \        sharpe_ratios=sharpe_ratios,\n        max_drawdowns=max_drawdowns,\n\
      \        annualized_returns=annualized_returns\n    )\n    \n    # Get candidate\
      \ model identifiers in order\n    candidate_models: List[str] = list(loaded_models.keys())\n\
      \    \n    # Validate final output\n    validate_output_consistency(\n     \
      \   candidate_models=candidate_models,\n        sharpe_ratios=sharpe_ratios,\n\
      \        annualized_returns=annualized_returns,\n        max_drawdowns=max_drawdowns,\n\
      \        turnovers=turnovers,\n        hit_rates=hit_rates,\n        ranks=ranks\n\
      \    )\n    \n    # Log evaluation summary\n    log_evaluation_summary(\n  \
      \      candidate_models=candidate_models,\n        sharpe_ratios=sharpe_ratios,\n\
      \        max_drawdowns=max_drawdowns,\n        ranks=ranks\n    )\n    \n  \
      \  return EvaluateModelsOutput(\n        candidate_models=candidate_models,\n\
      \        sharpe_ratios=sharpe_ratios,\n        annualized_returns=annualized_returns,\n\
      \        max_drawdowns=max_drawdowns,\n        turnovers=turnovers,\n      \
      \  hit_rates=hit_rates,\n        ranks=ranks\n    )"
    name: evaluate_models
    nodes_depended_on:
    - train_models
    - split_dataset
    nodes_dependent_on: []
    output_structure:
    - description: Identifier or name of each evaluated model candidate.
      key: candidate_models
      type: List[str]
    - description: Sharpe ratio for each model on the test set.
      key: sharpe_ratios
      type: List[float]
    - description: Annualized return (in percent) for each model on the test set.
      key: annualized_returns
      type: List[float]
    - description: Maximum drawdown (in percent) observed for each model on the test
